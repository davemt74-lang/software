name: Adaptive model inventory contract v1
on:
  pull_request:
    paths:
      - 'includes/homeserver-model-inventory-v1.php'
      - 'tests/homeserver-model-inventory-v1.php'
      - '.github/workflows/adaptive-model-inventory-contract-v1.yml'
  push:
    branches: [main]
    paths:
      - 'includes/homeserver-model-inventory-v1.php'
      - 'tests/homeserver-model-inventory-v1.php'
      - '.github/workflows/adaptive-model-inventory-contract-v1.yml'
permissions:
  contents: read
jobs:
  inventory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php tests/homeserver-model-inventory-v1.php
