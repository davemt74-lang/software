name: Polish Profile Knowledge Media
on:
  push:
    branches:
      - feature/profile-knowledge-media-20260905
    paths:
      - tools/polish-profile-knowledge-media.py
      - .github/workflows/polish-profile-knowledge-media.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-knowledge-media-20260905
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply privacy polish
        run: python3 tools/polish-profile-knowledge-media.py
      - name: Focused validation
        run: |
          php -l includes/profile-agent.php
          node tests/profile-knowledge-media-contract.mjs
      - name: Commit polish
        run: |
          git config user.name "davemt74-lang"
          git config user.email "davemt74@gmail.com"
          git add includes/profile-agent.php profile-agent-portal.js tests/profile-knowledge-media-contract.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Allow policy-gated personal Knowledge in Profile Agent"
            git push origin HEAD:feature/profile-knowledge-media-20260905
          fi
