name: Profile Conversion Intelligence v1.78

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: php -l includes/profile-agent-runtime.php
      - name: JavaScript syntax
        run: |
          node --check profile-agent-portal.js
          node --check tests/profile-conversion-intelligence-v178-contract.mjs
      - name: Profile conversion intelligence contract
        run: node tests/profile-conversion-intelligence-v178-contract.mjs
