name: Proactive Agent Operations v0.36

on:
  pull_request:
    paths:
      - 'includes/agent-proactive-operations-v036.php'
      - 'includes/agent-proactive-v123.php'
      - 'includes/bootstrap.php'
      - 'includes/agent-cognitive-loop-v310.php'
      - 'includes/notifications.php'
      - 'tests/proactive-agent-v036-contract.mjs'
      - '.github/workflows/proactive-agent-v036.yml'
  push:
    branches: [main]
    paths:
      - 'includes/agent-proactive-operations-v036.php'
      - 'includes/agent-proactive-v123.php'
      - 'includes/bootstrap.php'
      - 'includes/agent-cognitive-loop-v310.php'
      - 'includes/notifications.php'
      - 'tests/proactive-agent-v036-contract.mjs'
      - '.github/workflows/proactive-agent-v036.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Lint proactive PHP
        run: |
          php -l includes/agent-proactive-operations-v036.php
          php -l includes/agent-proactive-v123.php
          php -l includes/bootstrap.php
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run proactive operations contract
        run: node tests/proactive-agent-v036-contract.mjs
