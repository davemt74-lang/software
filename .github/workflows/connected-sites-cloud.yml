name: Connected Sites Cloud

on:
  pull_request:
    paths:
      - '.github/workflows/connected-sites-cloud.yml'
      - 'api/chat*.php'
      - 'api/connected-gelato-v1.php'
      - 'chat.php'
      - 'chat-tools.*'
      - 'chat-connected-sites-v1.js'
      - 'includes/agent-chat-runtime-v2160.php'
      - 'includes/connected-*.php'
      - 'tests/connected-*.php'
      - 'tests/connected-gelato-api-v1.mjs'
      - 'tests/connected-sites-browser.mjs'
      - 'upgrade.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/connected-sites-cloud.yml'
      - 'api/chat*.php'
      - 'api/connected-gelato-v1.php'
      - 'chat.php'
      - 'chat-tools.*'
      - 'chat-connected-sites-v1.js'
      - 'includes/agent-chat-runtime-v2160.php'
      - 'includes/connected-*.php'
      - 'tests/connected-*.php'
      - 'tests/connected-gelato-api-v1.mjs'
      - 'tests/connected-sites-browser.mjs'
      - 'upgrade.php'

permissions:
  contents: read

jobs:
  cloud-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, mbstring, pdo_sqlite, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test direct transport, named chat and existing runtime routing
        run: |
          php tests/connected-gelato-v1.php
          php tests/connected-sites-chat-v1.php
          php tests/cloud-provider-preservation.php
          php tests/ai-credential-recovery.php
          node tests/connected-gelato-api-v1.mjs
          node tests/agent-runtime-routing-v420.mjs
      - name: Install Chromium for the shipped Chat tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test pairing, the installed agent name and disconnect in Chat
        run: node tests/connected-sites-browser.mjs
