name: HomeServer Runtime Journey

on:
  push:
    branches:
      - main
      - section-1-runtime-journey-**
  pull_request:

permissions:
  contents: read

jobs:
  runtime-journey:
    name: Runtime journey · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint canonical runtime files
        run: |
          php -l includes/chat-execution-v019.php
          php -l includes/homeserver-agent-v018.php
          php -l includes/homeserver-agent-v025.php
          php -l tests/homeserver-runtime-journey-v030.php

      - name: Verify canonical VP3/HomeServer contracts
        run: |
          node tests/homeserver-vp3-integration-contract.mjs
          node tests/chat-execution-v019-contract.mjs
          node tests/chat-execution-v022-contract.mjs

      - name: Verify complete compute provenance journey
        run: php tests/homeserver-runtime-journey-v030.php
