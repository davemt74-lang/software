name: HomeServer Runtime Journey

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - section-1-runtime-journey-**
  pull_request:

permissions:
  contents: read

jobs:
  transfer-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
      connection: ${{ steps.scope.outputs.connection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: |
          python3 - <<'PY_SCOPE'
          import os, re, subprocess
          diff = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True, capture_output=True)
          pattern = r'^(transcript.*|tests/transcript.*|includes/transcript.*|includes/profile-agent-transcription-context\.php|agent-reminders\.js|(?:api|includes)/agent-reminders-v1\.php|tests/agent-reminders.*|agent-screen-(?:share|watch-zone)\.js|(?:api|includes)/agent-screen-(?:share|sessions)-v1\.php|tests/agent-screen-(?:share|sessions|watch-zone).*|agent-tv-watching\.js|includes/tv-watching-v1\.php|api/tv-watching-v1\.php|tests/tv.*|voice-trained.*|agent-trained-voice\.js|agent-voice-guard\.js|agent-participant-continuity\.js|participant-recovery-v1\.js|tests/participant-recovery-browser\.mjs|tests/participant-(?:tracking|continuity)-browser\.mjs|tests/trained-voice.*|tests/agent-voice-guard.*|agent-(?:orb|eyes).*|tests/agent-(?:orb|eyes).*|chat-tools\.(?:js|css)|chat-voice\.js|chat\.(?:php|css|js)|tests/chat-(?:canvas-voice-browser|speech-recovery)\.mjs|chat-browser-research-v1\.(?:js|css)|(?:api|includes)/chat-browser-research-v1\.php|includes/chat-research-continuity-r3\.php|tests/chat-research-continuity-r3.*|tests/chat-browser-research.*|chat-agent-teams-a3\.(?:js|css)|chat-notifications-drawer-v240\.js|api/agent-missions-cloud-v1\.php|tests/agent-missions-cloud-a3-browser\.mjs|tests/agent-missions-cloud-a4-browser\.mjs|tests/agent-missions-cloud-a5c2-browser\.mjs|tests/agent-missions-cloud-a5c3-browser\.mjs|tests/agent-missions-cloud-a5c4-browser\.mjs|tests/agent-missions-cloud-a5c5-browser\.mjs|tests/agent-missions-cloud-a5c6-browser\.mjs|tests/agent-missions-cloud-a5c(?:[789]|10|11)-browser\.mjs|chat-homeserver-transcription-import\.js|artist-listening(-workspace\.js|\.php)|includes/artist-listening\.php|api/artist-listening-v172\.php|includes/homeserver-(transcription-import|knowledge-backup).*\.php|api/homeserver-transcription-import.*\.php|tests/transfer.*section7.*|\.github/workflows/homeserver-runtime-journey\.yml)$'
          initiative = r'^(?:(?:includes|api)/agent-initiative(?:-[a-z0-9-]+)?-v1\.php|(?:includes|api)/agent-top-of-mind-v1\.php|agent-top-of-mind-v1\.(?:js|css)|includes/(?:agent-screen-insights-v1|agent-tool-json-v1|agent-worker-health-v1|agent-capability-contract-v1|agent-capability-awareness-v1|agent-runtime-routing-v420|video-meetings-homeserver-v1801|agent-workflow-runs-v1400|homeserver-scope-v026|homeserver-capabilities-v024|homeserver-agent-v018|homeserver-vp3)\.php|tests/(?:agent-initiative[^/]*|agent-worker-health-v1|agent-top-of-mind[^/]*)\.(?:php|mjs)|tests/initiative-(?:followthrough-(?:browser|e2e)|capabilities-browser)\.mjs|tests/agent-capability-contract-v1\.php|tests/agent-core-(?:(?:adoption|install-parity)-v1\.php|startup-http\.mjs)|api/(?:chat|chat-v236|chat-stream-v121|chat-notifications-brain-v240)\.php|includes/(?:agent-chat-runtime-v2160|member-header)\.php|tests/fixtures/initiative-(?:chat-loop-http|followthrough-chat|capabilities-chat)\.php|setup\.php|(?:(?:api|includes)/)?agent-activity-v94\.(?:php|js)|chat-cognitive-presentation-v510\.(?:js|css)|api/cognitive-presentation-v510\.php)$'
          workbench = r'^(?:chat-initiative-workbench-v1\.(?:js|css)|(?:api|includes)/initiative-work[^/]+\.php|tests/(?:chat-initiative-workbench-browser|initiative-workbench-api)\.mjs|tests/initiative-work-[^/]+\.php|(?:includes|tests)/initiative-product-launch(?:-state)?-v1\.php|(?:includes|tests)/(?:initiative-promotion-outcomes|profile-promotion-(?:attribution|click))-v1\.php|profile-promotion-click\.php)$'
          live = r'^(?:(?:agent-live-context-v1|chat-initiative-voice-v1)\.js|agent-worker-v1910\.php|includes/(?:agent-live-context-v1|homeserver-transient-schema-v1|agent-record-tools-v1|agent-capability-chat-v1)\.php|(?:api|includes)/agent-screen-audio-v1\.php|tests/(?:agent-live-[^/]+|agent-screen-audio-events-v1|homeserver-https-transient-inference(?:-mysql)?)\.(?:php|mjs)|tests/initiative-live-context-browser\.mjs|tests/fixtures/initiative-live-context-chat\.php|upgrade-homeserver-transient-inference-v1\.sql)$'
          connections = r'^(?:api/chat-youtube-playback-v1\.php|(?:admin/)?connections\.php|(?:connection-oauth|connection-test|connection-gmail-popup|connection-gmail-inbox|connection-gmail-github|youtube-connection-v1)\.php|connections-v1\.css|(?:api/)?chat-email-v1\.(?:php|js|css)|(?:chat-youtube-v1|gmail-popup-v1)\.(?:css|js)|assets/youtube-logo-v1\.png|(?:api|includes|tests)/agent-connections?[^/]*\.(?:php|mjs))$'
          development = r'^(?:(?:admin|api|includes|tests|workers)/agent-development[^/]*\.(?:php|mjs|py)|(?:tests/)?chat-agent-development[^/]*\.(?:mjs|js|css))$'
          changed = diff.returncode != 0 or any(re.match(pattern, p) or re.match(initiative, p) or re.match(workbench, p) or re.match(live, p) or re.match(connections, p) or re.match(development, p) for p in diff.stdout.splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(changed).lower() + '\n')
              connection = diff.returncode != 0 or any(re.match(r'^(includes/homeserver-(https-relay-v1300|cloud-pairing-actions-v1200|reconciliation-v246|shared-agent-v210)\.php|api/homeserver-https-poll-v1300\.php|tests/(connection_lifecycle|homeserver-continuity-permissions|homeserver-https-transient-inference(?:-mysql)?)\.php|\.github/workflows/homeserver-runtime-journey\.yml)$', p) for p in diff.stdout.splitlines())
              output.write('connection=' + str(connection).lower() + '\n')
          PY_SCOPE
