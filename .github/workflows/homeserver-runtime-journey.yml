name: HomeServer Runtime Journey

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - section-1-runtime-journey-**
  pull_request:

permissions:
  contents: read

jobs:
  runtime-journey:
    name: Runtime journey · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint canonical runtime files
        run: |
          php -l includes/chat-execution-v019.php
          php -l includes/homeserver-agent-v018.php
          php -l includes/homeserver-agent-v025.php
          php -l includes/homeserver-account-pairing-v1210.php
          php -l includes/homeserver-cloud-pairing-v1200.php
          php -l includes/homeserver-cloud-pairing-actions-v1200.php
          php -l includes/homeserver-scheduling-connector-v620.php
          php -l includes/homeserver-commerce-agent-v1000.php
          php -l includes/homeserver-https-relay-v1300.php
          php -l includes/homeserver-shared-agent-v210.php
          php -l includes/homeserver-execution-routing-v220.php
          php -l includes/homeserver-local-execution-v230.php
          php -l includes/homeserver-local-reads-v231.php
          php -l includes/homeserver-compute-v232.php
          php -l includes/homeserver-governed-actions-v233.php
          php -l includes/homeserver-voice-v234.php
          php -l includes/homeserver-profile-agent-v235.php
          php -l includes/homeserver-acceptance-v236.php
          php -l includes/homeserver-federated-data-v240.php
          php -l includes/homeserver-contacts-v241.php
          php -l includes/homeserver-knowledge-v242.php
          php -l includes/homeserver-tasks-calendar-v243.php
          php -l includes/homeserver-files-v244.php
          php -l includes/homeserver-agent-brain-memory-v245.php
          php -l includes/knowledge-retrieval-v162.php
          php -l api/homeserver-governed-actions-v233.php
          php -l api/homeserver-voice-v234.php
          php -l api/agent-voice-v117.php
          php -l api/profile-agent.php
          php -l api/homeserver-acceptance-v236.php
          php -l api/homeserver-contacts-v241.php
          php -l api/homeserver-knowledge-v242.php
          php -l api/homeserver-tasks-calendar-v243.php
          php -l api/homeserver-files-v244.php
          php -l api/homeserver-agent-brain-memory-v245.php
          php -l tests/homeserver-v235-voice-profile-unit.php
          php -l tests/homeserver-v236-release-acceptance-unit.php
          php -l tests/homeserver-v240-federated-data-unit.php
          php -l tests/homeserver-v241-contacts-continuity-unit.php
          php -l tests/homeserver-v242-knowledge-continuity-unit.php
          php -l tests/homeserver-v243-task-calendar-continuity-unit.php
          php -l tests/homeserver-v244-files-document-continuity-unit.php
          php -l tests/homeserver-v245-agent-brain-memory-continuity-unit.php
          php -l tests/knowledge-agent-context-v162-contract.php
          php -l tests/knowledge-agent-context-v162-security-contract.php
          php -l tests/homeserver-v233-governed-actions-unit.php
          php -l tests/homeserver-v232-compute-unit.php
          php -l tests/homeserver-v231-local-reads-unit.php
          php -l includes/homeserver-agent-read-v230.php
          php -l tests/homeserver-v230-read-execution-unit.php
          php -l tests/homeserver-v230-agent-compute-unit.php
          php -l tests/homeserver-v230-execution-unit.php
          php -l api/homeserver-https-pair-v1300.php
          php -l api/homeserver-https-poll-v1300.php
          php -l api/homeserver-connection-v1200.php
          php -l api/homeserver-status.php
          php -l settings-homeserver.php
          php -l setup.php
          php -l upgrade.php
          php -l tests/homeserver-runtime-journey-v030.php
          node --check homeserver-settings-v1210.js
          node --check tests/homeserver-settings-recovery-v1220-contract.mjs
          node --check tests/homeserver-https-relay-v1300-contract.mjs
          node --check tests/homeserver-shared-agent-v210-contract.mjs
          node --check tests/homeserver-v220-presence-routing-contract.mjs
          node --check tests/homeserver-v230-execution-contract.mjs
          node --check tests/homeserver-v231-local-reads-contract.mjs
          node --check tests/homeserver-v232-compute-contract.mjs
          node --check tests/homeserver-v233-governed-actions-contract.mjs
          node --check tests/homeserver-v235-voice-profile-contract.mjs
          node --check tests/homeserver-v236-release-acceptance-contract.mjs
          node --check tests/homeserver-v240-federated-data-contract.mjs
          node --check tests/homeserver-v241-contacts-continuity-contract.mjs
          node --check tests/homeserver-v242-knowledge-continuity-contract.mjs
          node --check tests/homeserver-v243-task-calendar-continuity-contract.mjs
          node --check tests/homeserver-v244-files-document-continuity-contract.mjs
          node --check tests/homeserver-v245-agent-brain-memory-continuity-contract.mjs
          node --check tests/homeserver-v230-read-execution-contract.mjs
          node --check tests/homeserver-v230-agent-compute-contract.mjs

      - name: Verify canonical VP3/HomeServer contracts
        run: |
          node tests/homeserver-vp3-integration-contract.mjs
          node tests/homeserver-cloud-pairing-v1200-contract.mjs
          node tests/homeserver-account-pairing-v1210-contract.mjs
          node tests/homeserver-settings-recovery-v1220-contract.mjs
          node tests/homeserver-https-relay-v1300-contract.mjs
          node tests/homeserver-shared-agent-v210-contract.mjs
          node tests/homeserver-v220-presence-routing-contract.mjs
          node tests/homeserver-v230-execution-contract.mjs
          php tests/homeserver-v230-execution-unit.php
          node tests/homeserver-v231-local-reads-contract.mjs
          php tests/homeserver-v231-local-reads-unit.php
          node tests/homeserver-v232-compute-contract.mjs
          php tests/homeserver-v232-compute-unit.php
          node tests/homeserver-v233-governed-actions-contract.mjs
          php tests/homeserver-v233-governed-actions-unit.php
          node tests/homeserver-v235-voice-profile-contract.mjs
          php tests/homeserver-v235-voice-profile-unit.php
          node tests/homeserver-v236-release-acceptance-contract.mjs
          php tests/homeserver-v236-release-acceptance-unit.php
          node tests/homeserver-v240-federated-data-contract.mjs
          php tests/homeserver-v240-federated-data-unit.php
          node tests/homeserver-v241-contacts-continuity-contract.mjs
          php tests/homeserver-v241-contacts-continuity-unit.php
          node tests/homeserver-v242-knowledge-continuity-contract.mjs
          php tests/homeserver-v242-knowledge-continuity-unit.php
          node tests/homeserver-v243-task-calendar-continuity-contract.mjs
          php tests/homeserver-v243-task-calendar-continuity-unit.php
          node tests/homeserver-v244-files-document-continuity-contract.mjs
          php tests/homeserver-v244-files-document-continuity-unit.php
          node tests/homeserver-v245-agent-brain-memory-continuity-contract.mjs
          php tests/homeserver-v245-agent-brain-memory-continuity-unit.php
          php tests/knowledge-agent-context-v162-contract.php
          php tests/knowledge-agent-context-v162-security-contract.php
          node tests/homeserver-v230-read-execution-contract.mjs
          php tests/homeserver-v230-read-execution-unit.php
          node tests/homeserver-v230-agent-compute-contract.mjs
          php tests/homeserver-v230-agent-compute-unit.php
          node tests/chat-execution-v019-contract.mjs
          node tests/chat-execution-v022-contract.mjs

      - name: Verify complete compute provenance journey
        run: php tests/homeserver-runtime-journey-v030.php
