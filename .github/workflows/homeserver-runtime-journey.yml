name: HomeServer Runtime Journey

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - section-1-runtime-journey-**
  pull_request:

permissions:
  contents: read

jobs:
  transfer-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
      connection: ${{ steps.scope.outputs.connection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: |
          python3 - <<'PY_SCOPE'
          import os, re, subprocess
          diff = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True, capture_output=True)
          pattern = r'^(agent-reminders\.js|(?:api|includes)/agent-reminders-v1\.php|tests/agent-reminders.*|agent-screen-share\.js|(?:api|includes)/agent-screen-share-v1\.php|tests/agent-screen-share.*|agent-tv-watching\.js|includes/tv-watching-v1\.php|api/tv-watching-v1\.php|tests/tv.*|voice-trained.*|agent-trained-voice\.js|agent-voice-guard\.js|agent-participant-continuity\.js|tests/participant-(?:tracking|continuity)-browser\.mjs|tests/trained-voice.*|tests/agent-voice-guard.*|agent-(?:orb|eyes).*|tests/agent-(?:orb|eyes).*|chat-tools\.(?:js|css)|chat-voice\.js|chat\.(?:php|css|js)|tests/chat-canvas-voice-browser\.mjs|chat-browser-research-v1\.(?:js|css)|(?:api|includes)/chat-browser-research-v1\.php|includes/chat-research-continuity-r3\.php|tests/chat-research-continuity-r3.*|tests/chat-browser-research.*|chat-agent-teams-a3\.(?:js|css)|chat-notifications-drawer-v240\.js|api/agent-missions-cloud-v1\.php|tests/agent-missions-cloud-a3-browser\.mjs|tests/agent-missions-cloud-a4-browser\.mjs|tests/agent-missions-cloud-a5c2-browser\.mjs|tests/agent-missions-cloud-a5c3-browser\.mjs|tests/agent-missions-cloud-a5c4-browser\.mjs|tests/agent-missions-cloud-a5c5-browser\.mjs|tests/agent-missions-cloud-a5c6-browser\.mjs|tests/agent-missions-cloud-a5c(?:[789]|10|11)-browser\.mjs|chat-homeserver-transcription-import\.js|artist-listening(-workspace\.js|\.php)|includes/artist-listening\.php|api/artist-listening-v172\.php|includes/homeserver-(transcription-import|knowledge-backup).*\.php|api/homeserver-transcription-import.*\.php|tests/transfer.*section7.*|\.github/workflows/homeserver-runtime-journey\.yml)$'
          changed = diff.returncode != 0 or any(re.match(pattern, p) for p in diff.stdout.splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(changed).lower() + '\n')
              connection = diff.returncode != 0 or any(re.match(r'^(includes/homeserver-(https-relay-v1300|cloud-pairing-actions-v1200|reconciliation-v246|shared-agent-v210)\.php|api/homeserver-https-poll-v1300\.php|tests/(connection_lifecycle|homeserver-continuity-permissions)\.php|\.github/workflows/homeserver-runtime-journey\.yml)$', p) for p in diff.stdout.splitlines())
              output.write('connection=' + str(connection).lower() + '\n')
          PY_SCOPE
  transfer-browser:
    needs: transfer-scope
    if: needs.transfer-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node tests/transfer-section7.mjs
      - name: Floating Agent and Agent Eyes browser acceptance
        run: |
          php tests/agent-reminders-v1.php
          node tests/agent-reminders-api.mjs
          node tests/agent-reminders-browser.mjs
          php tests/agent-screen-share-v1.php
          node tests/agent-screen-share-api.mjs
          node tests/agent-screen-share-browser.mjs
          node tests/agent-eyes-core.mjs
          node tests/agent-orb-browser.mjs
          node tests/agent-orb-cloud-browser.mjs
          node tests/activity-center-layout-browser.mjs
          node tests/agent-voice-guard-browser.mjs
          node tests/participant-continuity-browser.mjs
          node tests/participant-tracking-browser.mjs
          node tests/tv-watching-browser.mjs
          node tests/trained-voice-core.mjs
          node tests/trained-voice-real-browser.mjs
      - name: Agent Teams A3 real browser and Brain drawer acceptance
        run: node tests/agent-missions-cloud-a3-browser.mjs
      - name: A5C2 reviewed specialist assignments browser acceptance
        run: node tests/agent-missions-cloud-a5c2-browser.mjs
      - name: A5C3 exact specialist change review
        run: node tests/agent-missions-cloud-a5c3-browser.mjs
      - name: A5C4 verified results and lead completion
        run: node tests/agent-missions-cloud-a5c4-browser.mjs
      - name: Cloud ordinary composer task mode
        run: node tests/agent-missions-cloud-a5c5-browser.mjs
      - name: Compact Chat canvas and routed voice conversation
        run: |
          node tests/chat-canvas-voice-browser.mjs
          node tests/agent-eyes-listening-handoff-browser.mjs
      - name: Shared Agent Voice menu, greeting and movement
        run: |
          php tests/agent-voice-preferences.php
          node tests/agent-voice-menu-browser.mjs
      - name: Cloud scheduled specialist controls
        run: node tests/agent-missions-cloud-a5c6-browser.mjs
      - name: Cloud automatic lead routing browser acceptance
        run: node tests/agent-missions-cloud-a5c7-browser.mjs
      - name: Live mission progress, notices and reconnect browser acceptance
        run: node tests/agent-missions-cloud-a5c8-browser.mjs
      - name: Cloud chat command reviews and mission continuity
        run: node tests/agent-missions-cloud-a5c9-browser.mjs
      - name: Mission lifecycle completion and all-surface revocation
        run: node tests/agent-missions-cloud-a5c10-browser.mjs
      - name: Chat browser research approval, cited findings and diagnostics
        run: node tests/agent-missions-cloud-a5c11-browser.mjs
      - name: Chrome research on the Chat canvas
        run: |
          node tests/chat-browser-research-ui.mjs
          node tests/chat-research-continuity-r3-ui.mjs
      - name: A4 reviewed cognitive staffing browser acceptance
        run: node tests/agent-missions-cloud-a4-browser.mjs
  transfer-mysql:
    needs: transfer-scope
    if: needs.transfer-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: section7-fixture
          MYSQL_DATABASE: section7
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psection7-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - name: SQLite atomic import and verified backup acknowledgements
        run: |
          php tests/transfer_backup_section7.php
          php tests/agent_context_section8.php
          php tests/speaker_attribution_section9.php
      - name: MySQL transitions and six parallel imports
        env:
          VP3_SECTION7_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=section7;charset=utf8mb4
          VP3_SECTION7_MYSQL_PASSWORD: section7-fixture
        run: php tests/transfer_integrity_section7.php
      - name: Chat research upgrade and concurrent canonical ownership
        env:
          VP3_SECTION7_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=section7;charset=utf8mb4
          VP3_SECTION7_MYSQL_PASSWORD: section7-fixture
        run: |
          php tests/chat-browser-research-mysql.php
          php tests/agent-reminders-mysql.php
  connection-mysql:
    needs: transfer-scope
    if: needs.transfer-scope.outputs.connection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: connection-fixture
          MYSQL_DATABASE: connection
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pconnection-fixture"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Poll replacement and concurrent revocation
        env:
          VP3_CONNECTION_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=connection;charset=utf8mb4
          VP3_CONNECTION_MYSQL_PASSWORD: connection-fixture
        run: php tests/connection_lifecycle.php
      - name: Authorized reconciliation coverage and permission failure retries
        env:
          VP3_CONNECTION_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=connection;charset=utf8mb4
          VP3_CONNECTION_MYSQL_PASSWORD: connection-fixture
        run: php tests/homeserver-continuity-permissions.php
  runtime-journey:
    name: Runtime journey · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Connection lifecycle authority and stale relay snapshots
        run: php tests/connection_lifecycle.php
      - name: Authorized reconciliation coverage and permission failure retries
        run: php tests/homeserver-continuity-permissions.php
      - name: Connected and reconciliation status presentation
        run: node tests/homeserver-continuity-permissions.mjs
      - name: Chat device pairing contract
        run: |
          php -l includes/homeserver-device-code-v1.php
          php -l api/homeserver-device-code-v1.php
          php -l settings-homeserver.php
          node --check homeserver-device-code-v1.js
