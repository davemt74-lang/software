name: Browser Companion Transaction Trust, Control & Production Hardening v22.80

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - browser-companion-transaction-trust-control-v2280

permissions:
  contents: read

jobs:
  contract:
    name: Transaction Trust, Control & Production Hardening · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: v22.80 Transaction Trust, Control & Production Hardening contract
        run: node tests/browser-companion-transaction-control-v2280.mjs

      - name: v22.80 transaction production release matrix
        run: node tests/browser-companion-transaction-release-gate-v2280.mjs

      - name: Retained transaction contracts
        run: |
          node tests/browser-companion-transaction-safety-v2240.mjs
          node tests/browser-companion-transaction-outcome-v2250.mjs
          node tests/browser-companion-transaction-continuity-v2260.mjs
          node tests/browser-companion-transaction-intelligence-v2270.mjs

      - name: Retained Browser Companion contracts
        run: |
          node tests/extension-device-token-v2100.mjs
          node tests/browser-companion-account-shell-v2110.mjs
          node tests/browser-companion-cognitive-now-v2120.mjs
          node tests/browser-cognitive-review-hardening-v2120.mjs
          node tests/browser-companion-contextual-agent-v2130.mjs
          node tests/browser-companion-proactive-notifications-v2140.mjs
          node tests/browser-companion-contextual-quick-actions-v2150.mjs
          node tests/browser-companion-agent-workspace-v2160.mjs
          node tests/browser-companion-cross-web-memory-v2170.mjs
          node tests/browser-companion-agent-execution-v2180.mjs
          node tests/browser-companion-delegated-workflows-v2190.mjs
          node tests/browser-companion-agent-runtime-v2200.mjs
          node tests/browser-companion-web-interaction-v2210.mjs
          node tests/browser-companion-multisite-v2220.mjs
          node tests/browser-companion-research-agent-v2230.mjs

      - name: JavaScript syntax
        run: |
          node --check browser-companion/background.js
          node --check browser-companion/sidepanel.js
          node --check tests/browser-companion-transaction-control-v2280.mjs
          node --check tests/browser-companion-transaction-release-gate-v2280.mjs

      - name: PHP syntax
        run: |
          php -l includes/browser-transaction-control-v2280.php
          php -l api/extension-transaction-control-v2280.php
          php -l includes/browser-transaction-intelligence-v2270.php
          php -l api/extension-transaction-intelligence-v2270.php
          php -l includes/browser-transaction-continuity-v2260.php
          php -l api/extension-transaction-continuity-v2260.php
          php -l includes/browser-transaction-outcome-v2250.php
          php -l includes/browser-transaction-safety-v2240.php
          php -l agent-workflows.php
          php -l upgrade.php

  package:
    name: Build v22.80 final transaction deploy packages
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build cumulative final transaction overlay
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/server/api dist/server/includes dist/server/browser-companion
          (
            cd browser-companion
            zip -r ../dist/vp3-browser-companion-extension-v22.80.zip . -x '*.DS_Store'
          )
          unzip -t dist/vp3-browser-companion-extension-v22.80.zip

          cp api/extension-token.php api/extension-me.php api/extension-device-disconnect-v2030.php api/extension-cognitive-now-v2120.php api/extension-notifications-v2140.php api/extension-agent-voice-v2140.php api/extension-agent-chat-v2160.php api/extension-memory-v2170.php api/extension-execution-v2180.php api/extension-delegation-v2190.php api/extension-agent-runtime-v2200.php api/extension-web-interaction-v2210.php api/extension-multisite-v2220.php api/extension-research-agent-v2230.php api/extension-transaction-safety-v2240.php api/extension-transaction-outcome-v2250.php api/extension-transaction-continuity-v2260.php api/extension-transaction-intelligence-v2270.php api/extension-transaction-control-v2280.php dist/server/api/
          cp includes/extension-device-auth-v2000.php includes/extension-device-auth-v2001.php includes/extension-device-token-v2100.php includes/extension-notifications-v2140.php includes/agent-chat-runtime-v2160.php includes/browser-memory-v2170.php includes/browser-execution-v2180.php includes/browser-delegation-v2190.php includes/browser-agent-runtime-v2200.php includes/browser-web-interaction-v2210.php includes/browser-multisite-v2220.php includes/browser-research-schema-v2230.php includes/browser-research-runtime-v2230.php includes/browser-research-save-v2230.php includes/browser-transaction-safety-v2240.php includes/browser-transaction-outcome-v2250.php includes/browser-transaction-continuity-v2260.php includes/browser-transaction-intelligence-v2270.php includes/browser-transaction-control-v2280.php includes/agent-workflow-runs-v1400.php includes/agent-job-engine-v1900.php includes/agent-worker-runtime-v1910.php dist/server/includes/
          cp includes/browser-context-v2130.php includes/agent-surface-context-v131.php includes/browser-share-v2010.php includes/browser-source-feed-v2050.php includes/research-projects-v2060.php includes/knowledge.php includes/knowledge-retrieval-v162.php includes/user-calendar-v1300.php includes/crm-v180.php dist/server/includes/
          cp includes/cognitive-*.php includes/agent-cognitive-loop-v310.php includes/bootstrap.php includes/notifications.php dist/server/includes/

          cp extension-connect.php upgrade.php chat.php agent-workflows.php agent-workflows-v1400.css chat.js chat-browser-context-v2130.js chat-browser-context-v2130.css chat-notifications-drawer-v240.js chat-notifications-drawer-v240.css dist/server/
          cp chat-cognitive-*.js chat-cognitive-*.css dist/server/
          cp -R browser-companion/. dist/server/browser-companion/

          cat > dist/server/DEPLOY.txt <<'EOF'
          VP3 Browser Companion v22.80 — Transaction Trust, Control & Production Hardening
          FINAL cumulative transaction overlay through v22.80.

          Extract into the VP3 application root and overwrite included files.
          Sign in as owner/admin and run upgrade.php once.

          v22.80 closes the v22.40-v22.80 transaction feature family with:
          - server-authoritative monitoring and cross-device scan leases
          - owner Stop / Resume / Forget controls
          - bounded retention and explicit pruning
          - notification cooldown/escalation suppression
          - scan failure health and durable control receipts
          - full v22.40 -> v22.80 audit visibility
          - production release matrix and retained Browser Companion contracts

          Stop preserves the transaction audit chain. Forget requires a stopped
          tracker and removes only v22.60-v22.80 continuity/intelligence tracking;
          original v22.40 submission and v22.50 outcome history remain.

          Raw page text, raw URLs, browser history and raw transaction identifiers
          are not persisted by the transaction control layer. No v22.80 action
          executes an external write. Every consequential external action still
          requires a fresh v22.40 exact-form review and explicit authorization.

          This release freezes the transaction architecture at v22.80.
          EOF

          (
            cd dist/server
            zip -r ../vp3-browser-companion-server-v22.80.zip .
          )
          unzip -t dist/vp3-browser-companion-server-v22.80.zip

          sha256sum dist/vp3-browser-companion-extension-v22.80.zip > dist/vp3-browser-companion-extension-v22.80.zip.sha256
          sha256sum dist/vp3-browser-companion-server-v22.80.zip > dist/vp3-browser-companion-server-v22.80.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: vp3-browser-companion-transaction-final-v22.80
          path: |
            dist/vp3-browser-companion-extension-v22.80.zip
            dist/vp3-browser-companion-extension-v22.80.zip.sha256
            dist/vp3-browser-companion-server-v22.80.zip
            dist/vp3-browser-companion-server-v22.80.zip.sha256
          if-no-files-found: error
          retention-days: 30
