name: Phase 8 Final Hardening Patch

on:
  push:
    branches: [feature-paid-appointments-phase-8]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-paid-appointments-phase-8
          fetch-depth: 0
      - name: Apply final Phase 8 hardening
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:140]}')
              text=text.replace(old,new) if count is None else text.replace(old,new,count)
              p.write_text(text)

          # Remove the earlier permissive money parser so the strict minor-unit
          # parser in part5 is the single canonical implementation.
          p=Path('includes/agent-paid-appointments-v800-part3.php')
          text=p.read_text()
          start=text.index('function agent_paid_appointments_decimal_to_minor_v800')
          end=text.index('function agent_paid_appointments_create_checkout_v800',start)
          text=text[:start]+text[end:]
          p.write_text(text)

          # Stripe: do not send an empty customer_email. Square: fail explicitly
          # on currency mismatch or unsupported sandbox application fees.
          replace('includes/agent-paid-appointments-v800-part3.php',
              "$params=['mode'=>'payment','success_url'=>$return.'&session_id={CHECKOUT_SESSION_ID}','cancel_url'=>$cancel,'customer_email'=>(string)$paid['payer_email'],'line_items'=>[['quantity'=>1,'price_data'=>['currency'=>$currency,'unit_amount'=>$due,'product_data'=>['name'=>$name]]]],'metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']],'payment_intent_data'=>['metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']]]];",
              "$params=['mode'=>'payment','success_url'=>$return.'&session_id={CHECKOUT_SESSION_ID}','cancel_url'=>$cancel,'line_items'=>[['quantity'=>1,'price_data'=>['currency'=>$currency,'unit_amount'=>$due,'product_data'=>['name'=>$name]]]],'metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']],'payment_intent_data'=>['metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']]]];$payerEmail=trim((string)$paid['payer_email']);if($payerEmail!==''&&filter_var($payerEmail,FILTER_VALIDATE_EMAIL))$params['customer_email']=$payerEmail;")
          replace('includes/agent-paid-appointments-v800-part3.php',
              "$body=['idempotency_key'=>$idempotency,'quick_pay'=>['name'=>$name,'price_money'=>['amount'=>$due,'currency'=>strtoupper($currency)],'location_id'=>$locationId],'checkout_options'=>['redirect_url'=>$return]];\n        if($fee>0)$body['checkout_options']['app_fee_money']=['amount'=>$fee,'currency'=>strtoupper($currency)];",
              "$squareCurrency=strtoupper(trim((string)($caps['currency']??'')));if($squareCurrency!==''&&$squareCurrency!==strtoupper($currency))throw new RuntimeException('This Square location does not support the appointment currency.');\n        $body=['idempotency_key'=>$idempotency,'quick_pay'=>['name'=>$name,'price_money'=>['amount'=>$due,'currency'=>strtoupper($currency)],'location_id'=>$locationId],'checkout_options'=>['redirect_url'=>$return]];\n        if($fee>0){$squareCfg=agent_paid_appointments_config_v800()['square'];if((string)$squareCfg['environment']!=='production')throw new RuntimeException('Square sandbox does not support application fees for hosted appointment checkout. Set the appointment platform fee to 0 while testing Square sandbox.');$body['checkout_options']['app_fee_money']=['amount'=>$fee,'currency'=>strtoupper($currency)];}")

          # Agent Chat create: paid appointment types become a payment hold/link,
          # never a false "Booked" confirmation. Roll back if commercial setup fails.
          p=Path('includes/agent-scheduling-tools-v460.php')
          text=p.read_text()
          start=text.index("    if($operation==='create'){")
          end=text.index("    if($operation==='reschedule'){",start)
          create_block=r'''    if($operation==='create'){
              $event=agent_scheduling_event_type_v430($pdo,(int)($payload['event_type_id']??0));
              if(!$event||(int)$event['owner_user_id']!==(int)$user['id'])throw new RuntimeException('That appointment type is no longer available to this account.');
              $guestEmail=strtolower(trim((string)($payload['guest_email']??'')));
              $paidTerms=null;$paidDue=0;
              if(function_exists('agent_paid_appointments_schema_ready_v800')&&agent_paid_appointments_schema_ready_v800($pdo)){
                  $paidTerms=agent_paid_appointments_event_terms_v800($pdo,(int)$event['id']);
                  $paidDue=agent_paid_appointments_amount_due_v800($paidTerms);
                  if($paidDue>0&&($guestEmail===''||!filter_var($guestEmail,FILTER_VALIDATE_EMAIL)))throw new RuntimeException('Paid appointments need the guest email before I can hold the time and create a secure payment link.');
                  if($paidDue>0&&(!function_exists('agent_appointment_lifecycle_schema_ready_v700')||!agent_appointment_lifecycle_schema_ready_v700($pdo)))throw new RuntimeException('Run the VP3 database upgrade before Agent-paid appointment booking can be used.');
              }
              $booking=agent_scheduling_create_booking_v430($pdo,[
                  'event_type_id'=>(int)$event['id'],'start_at_utc'=>(string)$payload['start_at_utc'],'guest_timezone'=>(string)$event['schedule_timezone'],
                  'guest_name'=>(string)$payload['guest_name'],'guest_email'=>$guestEmail,'guest_phone'=>'','guest_notes'=>'',
                  'created_by_user_id'=>(int)$user['id'],'created_by_agent_id'=>$agentId,'source'=>'agent',
              ]);
              if($paidDue>0){
                  try{
                      $canonical=agent_appointment_lifecycle_booking_v700($pdo,(int)$booking['id'],(int)$user['id'])?:$booking;
                      $paid=agent_paid_appointments_create_personal_v800($pdo,$canonical);
                      if(!$paid)throw new RuntimeException('Paid appointment state could not be created.');
                      $paymentUrl=agent_paid_appointments_payment_url_v800($pdo,$paid);
                      if($paymentUrl==='')throw new RuntimeException('Secure appointment payment link could not be created.');
                  }catch(Throwable $commercialError){
                      try{agent_scheduling_cancel_booking_v430($pdo,(int)$booking['id'],(int)$user['id']);}catch(Throwable $ignored){}
                      throw $commercialError;
                  }
                  $result['answer']='Time held pending payment. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is reserved for '.agent_scheduling_tools_slot_label_v460((string)$booking['start_at_utc'],(string)$booking['organizer_timezone']).'. The appointment is not confirmed until the payment provider verifies payment.';
                  $result['actions'][]=['type'=>'open_url','label'=>'Open secure payment','url'=>$paymentUrl];
                  agent_tool_log($user,'scheduling.book',(string)$pending['request_text'],'success',['booking_id'=>(int)$booking['id'],'event_type_id'=>(int)$booking['event_type_id'],'start_at_utc'=>(string)$booking['start_at_utc'],'agent_id'=>$agentId,'payment_status'=>'awaiting_payment','paid_booking_id'=>(int)$paid['id']],$conversationId);
                  return $result;
              }
              $result['answer']='Booked. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is set for '.agent_scheduling_tools_slot_label_v460((string)$booking['start_at_utc'],(string)$booking['organizer_timezone']).'.';
              $result['actions'][]=['type'=>'open_url','label'=>'Open Scheduling','url'=>url('/scheduling.php?open='.(int)$booking['id'].'#bookings')];
              agent_tool_log($user,'scheduling.book',(string)$pending['request_text'],'success',['booking_id'=>(int)$booking['id'],'event_type_id'=>(int)$booking['event_type_id'],'start_at_utc'=>(string)$booking['start_at_utc'],'agent_id'=>$agentId],$conversationId);
              return $result;
          }
'''
          text=text[:start]+create_block+text[end:]
          p.write_text(text)

          # Agent cancellation should immediately preserve paid cancellation/refund
          # lineage instead of waiting for background reconciliation.
          replace('includes/agent-scheduling-tools-v460.php',
              "        if(!agent_scheduling_cancel_booking_v430($pdo,$bookingId,(int)$user['id']))throw new RuntimeException('That appointment could not be cancelled.');\n        $result['answer']='Cancelled. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is no longer on your schedule.';",
              "        $paid=(function_exists('agent_paid_appointments_schema_ready_v800')&&agent_paid_appointments_schema_ready_v800($pdo))?agent_paid_appointments_paid_booking_for_booking_v800($pdo,$bookingId):null;\n        if(function_exists('agent_appointment_lifecycle_schema_ready_v700')&&agent_appointment_lifecycle_schema_ready_v700($pdo)){$life=agent_appointment_lifecycle_booking_v700($pdo,$bookingId,(int)$user['id']);if(!$life)throw new RuntimeException('That appointment is no longer available.');agent_appointment_lifecycle_transition_v700($pdo,$life,'cancelled','agent',(int)$user['id'],$agentId?:null,['source'=>'agent_chat_v460']);}elseif(!agent_scheduling_cancel_booking_v430($pdo,$bookingId,(int)$user['id']))throw new RuntimeException('That appointment could not be cancelled.');\n        if($paid)agent_paid_appointments_record_cancellation_v800($pdo,$paid,'agent',(int)$user['id'],$agentId?:null,'agent_chat_cancelled');\n        $result['answer']='Cancelled. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is no longer on your schedule.';")

          # Update older contracts to protect the newer in-place semantics rather
          # than requiring the retired cancel+create implementation.
          p=Path('tests/agent-scheduling-tools-v460-contract.mjs');text=p.read_text()
          old="""assert.match(tools, /SELECT GET_LOCK\\(\\?,5\\)/, 'rescheduling must serialize its cancel/create transaction');
assert.match(tools, /if\\(\\$started\\)\\$pdo->beginTransaction\\(\\)/, 'rescheduling must be atomic');
assert.match(tools, /if\\(\\$started&&\\$pdo->inTransaction\\(\\)\\)\\$pdo->rollBack\\(\\)/, 'failed reschedules must roll back');
assert.match(tools, /rescheduled_from_id=\\?/, 'rescheduling must preserve booking lineage');
assert.match(tools, /SELECT RELEASE_LOCK\\(\\?\\)/, 'reschedule schedule lock must be released');"""
          new="""assert.match(tools, /agent_appointment_lifecycle_reschedule_v700/, 'approved Agent rescheduling must delegate to the canonical in-place lifecycle path');
const rescheduleStart=tools.indexOf('function agent_scheduling_tools_reschedule_owner_v460');
const rescheduleEnd=tools.indexOf('function agent_scheduling_tools_execute_pending_v460',rescheduleStart);
const reschedule=rescheduleStart>=0&&rescheduleEnd>rescheduleStart?tools.slice(rescheduleStart,rescheduleEnd):'';
assert.ok(reschedule,'Agent reschedule helper must exist');
assert.doesNotMatch(reschedule,/agent_scheduling_create_booking_v430/,'Agent rescheduling must not create a replacement booking');
assert.match(reschedule,/agent_paid_appointments_paid_booking_for_booking_v800/,'Agent rescheduling must inspect commercial lineage when Phase 8 is installed');
assert.match(reschedule,/Complete or cancel the pending appointment payment before rescheduling/,'Agent rescheduling must not confirm an unpaid commercial hold');
assert.match(reschedule,/agent_paid_appointments_record_reschedule_v800/,'Paid Agent reschedules must audit retained payment lineage');"""
          if old not in text: raise SystemExit('v460 legacy reschedule contract block not found')
          p.write_text(text.replace(old,new))

          replace('tests/agent-appointment-lifecycle-v700-contract.mjs',
              "assert.match(publicPage,/agent_scheduling_cancel_booking_v430[\\s\\S]*throw \\$captureError/,'A failed intake persistence step must roll back the canonical booking');",
              "assert.match(publicPage,/agent_appointment_lifecycle_capture_intake_v700[\\s\\S]*agent_scheduling_cancel_booking_v430[\\s\\S]*throw \\$commercialError/,'A failed intake or commercial persistence step must roll back the canonical booking');")

          replace('tests/agent-paid-appointments-v800-contract.mjs',
              "assert.match(core,/PRIMARY KEY\\s*\\(workspace_owner_user_id\\)/,'A Team must have only one primary appointment provider selection');",
              "assert.match(core,/workspace_owner_user_id INT UNSIGNED NOT NULL PRIMARY KEY/,'A Team must have only one primary appointment provider selection');")
          replace('tests/agent-paid-appointments-v800-contract.mjs',
              "assert.match(core,/main_location_id/,'Square connection must resolve the merchant payment location instead of treating merchant_id as location_id');",
              "assert.match(core,/main_location_id/,'Square connection must resolve the merchant payment location instead of treating merchant_id as location_id');\nassert.match(core,/Square sandbox does not support application fees for hosted appointment checkout/,'Square sandbox must fail clearly instead of silently dropping a configured platform fee');\nassert.match(core,/Square location does not support the appointment currency/,'Square checkout must reject a seller-location currency mismatch before provider mutation');")
          replace('tests/agent-paid-appointments-v800-contract.mjs',
              "assert.match(legacyReschedule,/agent_paid_appointments_record_reschedule_v800/,'Paid Agent Chat reschedule must audit retained commercial lineage');",
              "assert.match(legacyReschedule,/agent_paid_appointments_record_reschedule_v800/,'Paid Agent Chat reschedule must audit retained commercial lineage');\nassert.match(legacyTools,/Paid appointments need the guest email before I can hold the time and create a secure payment link/,'Agent-created paid appointments must require an addressable payer');\nassert.match(legacyTools,/Time held pending payment/,'Agent-created paid appointments must be described as held, not confirmed');\nassert.match(legacyTools,/agent_paid_appointments_create_personal_v800/,'Agent-created paid appointments must create canonical commercial state');\nassert.match(legacyTools,/agent_paid_appointments_payment_url_v800/,'Agent-created paid appointments must return a secure payment path');")
      - name: Commit final hardening
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/agent-paid-appointments-v800-part3.php includes/agent-scheduling-tools-v460.php tests/agent-scheduling-tools-v460-contract.mjs tests/agent-appointment-lifecycle-v700-contract.mjs tests/agent-paid-appointments-v800-contract.mjs
          git commit -m "Phase 8: complete Agent commerce and provider hardening"
          git push origin HEAD:feature-paid-appointments-phase-8
