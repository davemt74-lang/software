name: Video Meetings v18.23 Meeting Commitment Command

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: meeting commitment command (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - name: Check out VP3 Cloud
        uses: actions/checkout@v4
      - name: Check out pinned HomeServer Phase 18.11
        uses: actions/checkout@v4
        with:
          repository: davemt74-lang/otro
          ref: 1d600b6154b43638c94d71b5238a15fab0b33d9f
          path: homeserver-v1890
          persist-credentials: false
      - name: Verify pinned HomeServer revision
        run: test "$(git -C homeserver-v1890 rev-parse HEAD)" = "1d600b6154b43638c94d71b5238a15fab0b33d9f"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: |
          php -l includes/video-meetings-memory-v18120.php
          php -l includes/video-meetings-memory-v18120-part3.php
          php -l includes/video-meetings-automation-v18130.php
          php -l includes/video-meetings-agenda-v18140.php
          php -l includes/video-meetings-actions-v18150.php
          for f in includes/video-meetings-actions-v18150-part*.php; do php -l "$f"; done
          php -l includes/video-meetings-followthrough-intelligence-v18160.php
          for f in includes/video-meetings-followthrough-intelligence-v18160-part*.php; do php -l "$f"; done
          php -l includes/video-meetings-outcome-learning-v18170.php
          for f in includes/video-meetings-outcome-learning-v18170-part*.php; do php -l "$f"; done
          php -l includes/video-meetings-adaptive-planning-v18180.php
          for f in includes/video-meetings-adaptive-planning-v18180-part*.php; do php -l "$f"; done
          php -l includes/video-meetings-plan-action-guard-v18190.php
          php -l includes/video-meetings-plan-action-handoff-v18190.php
          php -l includes/video-meetings-followthrough-verification-v18200.php
          for f in includes/video-meetings-followthrough-verification-v18200-part*.php; do php -l "$f"; done
          php -l includes/video-meetings-cross-meeting-continuity-v18210.php
          php -l includes/video-meetings-cross-meeting-continuity-guard-v18210.php
          php -l includes/video-meetings-closure-recurring-continuity-v18220.php
          php -l includes/video-meetings-closure-recurring-continuity-guard-v18220.php
          php -l includes/video-meetings-commitment-command-v18230.php
          php -l includes/video-meetings-commitment-command-v18230-chat.php
          php -l api/video-meeting-closure.php
          php -l api/video-meeting-continuity.php
          php -l api/video-meeting-automation.php
          php -l api/chat-v236.php
          php -l meeting.php
          php -l upgrade.php
      - name: JavaScript syntax
        run: |
          node --check video-meetings-automation-v18130.js
          node --check video-meetings-followthrough-intelligence-v18160.js
          node --check video-meetings-adaptive-planning-v18180.js
          node --check video-meetings-plan-action-handoff-v18190.js
          node --check video-meetings-followthrough-verification-v18200.js
          node --check video-meetings-cross-meeting-continuity-v18210.js
          node --check video-meetings-closure-recurring-continuity-v18220.js
          node --check tests/video-meetings-closure-recurring-continuity-v18220-contract.mjs
          node --check tests/video-meetings-commitment-command-v18230-contract.mjs
      - name: Meeting Intelligence regression contracts 18.2-18.22
        run: |
          node tests/video-meetings-intelligence-v1820-contract.mjs
          node tests/video-meetings-intelligence-v1890-contract.mjs
          node tests/video-meetings-intelligence-v18100-contract.mjs
          node tests/video-meetings-live-agent-v18110-contract.mjs
          node tests/video-meetings-memory-v18120-contract.mjs
          node tests/video-meetings-automation-v18130-contract.mjs
          node tests/video-meetings-agenda-v18140-contract.mjs
          node tests/video-meetings-actions-v18150-contract.mjs
          node tests/video-meetings-followthrough-intelligence-v18160-contract.mjs
          node tests/video-meetings-outcome-learning-v18170-contract.mjs
          node tests/video-meetings-adaptive-planning-v18180-contract.mjs
          node tests/video-meetings-plan-action-handoff-v18190-contract.mjs
          node tests/video-meetings-followthrough-verification-v18200-contract.mjs
          node tests/video-meetings-cross-meeting-continuity-v18210-contract.mjs
          node tests/video-meetings-closure-recurring-continuity-v18220-contract.mjs
      - name: Phase 18.23 Meeting Commitment Command contract
        run: node tests/video-meetings-commitment-command-v18230-contract.mjs

  meeting-reliability-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        name: Select focused meeting lifecycle acceptance
        shell: bash
        run: |
          python3 - <<'PY_SCOPE'
          import os, re, subprocess
          diff = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True, capture_output=True)
          pattern = r'^(video-meetings.*\.js|meeting\.php|api/video-meeting.*\.php|includes/video-meetings.*\.php|tests/meetings.*section6.*|\.github/workflows/video-meetings-v18230\.yml)$'
          changed = diff.returncode != 0 or any(re.match(pattern, p) for p in diff.stdout.splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(changed).lower() + '\n')
          PY_SCOPE
  meeting-browser:
    needs: meeting-reliability-scope
    if: needs.meeting-reliability-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser acceptance runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Real Chromium meeting controller races
        run: node tests/meetings-section6.mjs
  meeting-presence:
    needs: meeting-reliability-scope
    if: needs.meeting-reliability-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: section6-fixture
          MYSQL_DATABASE: section6
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psection6-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - name: Canonical SQLite presence transitions
        run: php tests/meetings_integrity_section6.php
      - name: Canonical InnoDB presence transitions and join/end races
        env:
          VP3_SECTION6_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=section6;charset=utf8mb4
          VP3_SECTION6_MYSQL_PASSWORD: section6-fixture
        run: php tests/meetings_integrity_section6.php
