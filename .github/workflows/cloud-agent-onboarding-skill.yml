name: Cloud Agent Onboarding Skill
on:
  pull_request:
    paths:
      - 'includes/agent-onboarding-skill-v100.php'
      - 'includes/onboarding-intelligence.php'
      - 'includes/chat-onboarding-v241.php'
      - 'includes/agent-cognitive-loop-v310.php'
      - 'includes/bootstrap.php'
      - 'chat-agent-identity-v236.js'
      - 'tests/agent-onboarding-skill-v100.php'
      - 'tests/chat-onboarding-v241.mjs'
      - 'tests/agent-onboarding-current-systems-v242.mjs'
      - '.github/workflows/cloud-agent-onboarding-skill.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-agent-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  onboarding-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused PHP and JS syntax
        run: |
          php -l includes/agent-onboarding-skill-v100.php
          php -l includes/chat-onboarding-v241.php
          php -l includes/agent-cognitive-loop-v310.php
          php -l includes/onboarding-intelligence.php
          node --check chat-agent-identity-v236.js
      - name: Skill task, consent and canonical-state test
        run: php tests/agent-onboarding-skill-v100.php
      - name: Retained account onboarding and voice regression contracts
        run: |
          node tests/chat-onboarding-v241.mjs
          node tests/agent-onboarding-current-systems-v242.mjs
