name: Verified deploy package
on:
  push:
    branches: [codex/package-cloud-auto-sync-80f20bef]
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 80f20bef985dda729c6ed48cd96641b4381edc5a
          path: verified-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate packaging script
        run: python -m py_compile tools/package_verified_deploy.py
      - name: Verify official artifact and publish deploy ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/package_verified_deploy.py cloud davemt74-lang/software 80f20bef985dda729c6ed48cd96641b4381edc5a 37543993357 cloud-auto-sync-80f20bef VP3-Cloud-AutoSync-80f20bef-Deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: verified-deploy-80f20bef
          path: deploy-output/*
          if-no-files-found: error
          retention-days: 30
