name: Video Meetings v18.10 Follow-Through

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: follow-through contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out VP3 Cloud
        uses: actions/checkout@v4

      - name: Check out pinned HomeServer Phase 18.9
        uses: actions/checkout@v4
        with:
          repository: davemt74-lang/otro
          ref: 9dd65b10915687786c8674575b622ceb0792e68e
          path: homeserver-v1890
          persist-credentials: false

      - name: Verify pinned HomeServer revision
        shell: bash
        run: test "$(git -C homeserver-v1890 rev-parse HEAD)" = "9dd65b10915687786c8674575b622ceb0792e68e"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax
        run: |
          php -l includes/video-meetings-followthrough-v18100.php
          for f in includes/video-meetings-followthrough-v18100-part*.php; do php -l "$f"; done
          php -l includes/video-meetings-intelligence-handoff-v1890.php
          php -l api/video-meeting-intelligence.php

      - name: JavaScript syntax
        run: |
          node --check video-meetings-intelligence-v1820.js
          node --check video-meetings-followthrough-v18100.js
          node --check tests/video-meetings-intelligence-v1820-contract.mjs
          node --check tests/video-meetings-intelligence-v1890-contract.mjs
          node --check tests/video-meetings-intelligence-v18100-contract.mjs

      - name: Phase 18.2 regression contract
        run: node tests/video-meetings-intelligence-v1820-contract.mjs

      - name: Phase 18.9 hybrid regression contract
        run: node tests/video-meetings-intelligence-v1890-contract.mjs

      - name: Phase 18.10 follow-through contract
        run: node tests/video-meetings-intelligence-v18100-contract.mjs
