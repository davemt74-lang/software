name: Video Meetings v18.2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/video-meetings-intelligence-v1820.php
          php -l includes/agent-appointment-lifecycle-v700.php
          php -l api/video-meeting-intelligence.php
          php -l api/video-meeting-presence.php
          php -l meeting.php
          php -l meetings.php
          php -l upgrade.php
      - name: JavaScript syntax
        run: |
          node --check video-meetings-v1800.js
          node --check video-meetings-intelligence-v1820.js
          node --check tests/video-meetings-intelligence-v1820-contract.mjs
      - name: Meeting Intelligence contract
        run: node tests/video-meetings-intelligence-v1820-contract.mjs
