name: Profile Commerce Secure File v11.30

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Secure file delivery contract
        run: node tests/profile-commerce-secure-file-v1130-contract.mjs
      - name: Retained digital/manual delivery contract
        run: node tests/profile-commerce-delivery-v1120-contract.mjs
      - name: Retained customer refund request contract
        run: node tests/profile-commerce-refund-requests-v1110-contract.mjs
      - name: Retained customer lifecycle contract
        run: node tests/profile-commerce-lifecycle-v1100-contract.mjs
      - name: Retained Profile Commerce contract
        run: node tests/profile-commerce-v900-contract.mjs
      - name: Retained Commerce contract
        run: node tests/agent-commerce-v800-contract.mjs
      - name: Frozen Agent Commerce contract
        run: node tests/commerce-agent-v1-contract.mjs
      - name: Frozen payment authority contract
        run: node tests/commerce-payment-v1-contract.mjs
      - name: Secure file runtime load
        run: php -r "require 'includes/agent-commerce-v800.php'; require 'includes/profile-agent.php'; require 'includes/profile-commerce-v900.php'; require 'includes/profile-commerce-ops-v900.php'; require 'includes/profile-commerce-delivery-v1120.php'; require 'includes/profile-commerce-delivery-file-v1130.php'; require 'includes/profile-commerce-receipt-v1100.php'; require 'includes/profile-commerce-lifecycle-v1100.php'; echo 'PROFILE_COMMERCE_SECURE_FILE_RUNTIME=PASS'.PHP_EOL;"
      - name: PHP syntax
        run: |
          php -l includes/profile-commerce-delivery-file-v1130.php
          php -l profile-commerce-delivery-file.php
          php -l profile-commerce-delivery.php
          php -l profile-commerce-order.php
  payment_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.1', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pa2-fixture
          MYSQL_DATABASE: commerce_recovery_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppa2-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commerce PA2 SQLite recovery and customer review
        run: |
          php tests/commerce-provider-evidence-pa2.php
          php tests/commerce-recovery-pa2.php
          php tests/commerce-projection-recovery-pa2.php
          php tests/commerce-checkout-creation-pa2.php
          php tests/commerce-appointment-recovery-pa2.php
          php tests/profile-checkout-status-pa2.php
          node tests/commerce-webhook-pa2.mjs
          node tests/profile-checkout-review-pa2.mjs
      - name: Commerce PA2 MySQL recovery and concurrent delivery
        env:
          VP3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=commerce_recovery_ci;charset=utf8mb4
          VP3_TEST_MYSQL_USER: root
          VP3_TEST_MYSQL_PASS: pa2-fixture
        run: |
          php tests/commerce-provider-evidence-pa2.php
          php tests/commerce-recovery-pa2.php
          php tests/commerce-projection-recovery-pa2.php
          php tests/commerce-checkout-creation-pa2.php
          php tests/commerce-appointment-recovery-pa2.php
          node tests/commerce-webhook-pa2.mjs
