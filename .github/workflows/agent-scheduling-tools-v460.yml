name: Agent Scheduling Tools v4.60

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scheduling tools contract
        run: node tests/agent-scheduling-tools-v460-contract.mjs
      - name: PHP syntax
        run: |
          php -l includes/agent-scheduling-tools-v460.php
          php -l includes/agent-tool-authorization-v400.php
          php -l includes/bootstrap.php
