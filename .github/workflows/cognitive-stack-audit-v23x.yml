name: Cognitive Stack v23.x Backwards Audit

on:
  pull_request:
    paths:
      - 'includes/cognitive-operations-v2300.php'
      - 'includes/cognitive-priority-queue-v2310.php'
      - 'includes/cognitive-opportunities-v2320.php'
      - 'includes/cognitive-action-planning-v2330.php'
      - 'includes/cognitive-feed-v530.php'
      - 'includes/cognitive-planning-v550.php'
      - 'includes/cognitive-orchestration-v560.php'
      - 'includes/agent-chat-intelligence-v171.php'
      - 'tests/cognitive-operations-v2300.mjs'
      - 'tests/cognitive-priority-queue-v2310.mjs'
      - 'tests/cognitive-opportunities-v2320.mjs'
      - 'tests/cognitive-action-planning-v2330.mjs'
      - 'tests/agent-work-queue-v172-contract.mjs'
      - 'tests/cognitive-stack-audit-v23x.mjs'
      - 'docs/VP3_COGNITIVE_STACK_AUDIT_V23X.md'
      - '.github/workflows/cognitive-stack-audit-v23x.yml'
  push:
    branches:
      - 'cognitive-stack-audit-hardening-v23x'

jobs:
  audit:
    name: Cognitive Stack Audit · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/cognitive-operations-v2300.php
          php -l includes/cognitive-priority-queue-v2310.php
          php -l includes/cognitive-opportunities-v2320.php
          php -l includes/cognitive-action-planning-v2330.php
          php -l includes/cognitive-feed-v530.php
          php -l includes/cognitive-planning-v550.php
          php -l includes/cognitive-orchestration-v560.php
          php -l includes/agent-chat-intelligence-v171.php
      - name: Stack audit contract
        run: node tests/cognitive-stack-audit-v23x.mjs
      - name: v23.x contracts
        run: |
          node tests/cognitive-operations-v2300.mjs
          node tests/cognitive-priority-queue-v2310.mjs
          node tests/cognitive-opportunities-v2320.mjs
          node tests/cognitive-action-planning-v2330.mjs
      - name: Retained cognitive runtime contracts
        run: |
          node tests/cognitive-runtime-core-v500.mjs
          node tests/cognitive-feed-v530.mjs
          node tests/cognitive-learning-v540.mjs
          node tests/cognitive-planning-v550.mjs
          node tests/cognitive-orchestration-v560.mjs
          node tests/cognitive-memory-v570.mjs
      - name: Retained work and Browser contracts
        run: |
          node tests/agent-work-queue-v172-contract.mjs
          node tests/agent-work-control-v173-contract.mjs
          node tests/agent-work-dependencies-v174-contract.mjs
          node tests/browser-companion-cognitive-now-v2120.mjs
