name: Team Chat Retirement v3.80

on:
  push:
    branches:
      - main
      - feature/retire-legacy-team-chat-v380
  pull_request:

permissions:
  contents: read

jobs:
  retirement-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Team Chat retirement contract
        run: node tests/team-chat-retirement-v380.mjs

      - name: JavaScript syntax
        run: node --check tests/team-chat-retirement-v380.mjs

      - name: PHP syntax
        run: |
          php -l api/team-chat-v81.php
          php -l api/team-chat-v103.php
          php -l api/team-chat-v109.php
          php -l api/team-chat-v320.php
          php -l includes/human-messaging-v370.php
          php -l includes/team-chat-widget-v81.php
