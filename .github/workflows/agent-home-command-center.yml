name: Agent Home Command Center

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l home.php
          php -l includes/auth.php
          php -l includes/member-navigation.php
          php -l includes/main-sidebar.php
          php -l includes/member-header.php
      - name: JavaScript syntax
        run: |
          node --check agent-home-v194.js
          node --check tests/agent-home-command-center-contract.mjs
      - name: Agent Home contract
        run: node tests/agent-home-command-center-contract.mjs
      - name: Retained member shell contracts
        run: |
          node tests/member-shell-v1320-contract.mjs
          node tests/member-sidebar-shell-contract.mjs
          node tests/main-feed-canonical-ui-contract.mjs
      - name: Retained authenticated shell consolidation
        run: node tests/authenticated-shell-consolidation-contract.mjs
      - name: Retained VP3 normalization and runtime cleanup
        run: |
          node tests/authenticated-shell-vp3-normalization-contract.mjs
          node tests/authenticated-vp3-runtime-cleanup-contract.mjs
      - name: Retained My Knowledge folder browser
        run: node tests/knowledge-library-v161-browser-contract.mjs
      - name: Retained Profile Runtime Resilience
        run: node tests/profile-runtime-resilience-contract.mjs
