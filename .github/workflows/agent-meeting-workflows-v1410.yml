name: Agent Meeting Workflows v14.10

on:
  push:
    branches:
      - main
      - phase-14-1-meeting-prep-followup
  pull_request:

permissions:
  contents: read

jobs:
  meeting-workflows:
    name: Meeting workflows · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint meeting workflow PHP
        run: |
          php -l includes/agent-meeting-workflows-v1410.php
          php -l includes/agent-appointment-lifecycle-v700.php
          php -l includes/agent-appointment-lifecycle-v700-part7.php
          php -l includes/agent-appointment-lifecycle-v700-part8.php
          php -l includes/appointment-lifecycle-controller-v700.php
          php -l includes/agent-workflow-runs-v1400.php
          php -l includes/bootstrap.php

      - name: Verify meeting workflow contract
        run: |
          node tests/agent-meeting-workflows-v1410-contract.mjs
          php tests/agent-meeting-workflows-v1410-test.php