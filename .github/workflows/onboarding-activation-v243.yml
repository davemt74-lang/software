name: Onboarding Activation + Agent Follow-Through v2.43

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'includes/onboarding-intelligence.php'
      - 'includes/chat-onboarding-v241.php'
      - 'includes/cognitive-cards-v520.php'
      - 'includes/cognitive-feed-v530.php'
      - 'api/cognitive-feed-v530.php'
      - 'chat-cognitive-cards-v520.js'
      - 'chat-cognitive-feed-v530.js'
      - 'chat.php'
      - 'tests/onboarding-activation-v243.mjs'
      - 'tests/agent-onboarding-current-systems-v242.mjs'
      - 'tests/chat-onboarding-v241.mjs'
      - 'tests/cognitive-cards-v520.mjs'
      - 'tests/cognitive-feed-v530.mjs'
      - '.github/workflows/onboarding-activation-v243.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Activation + Follow-Through · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/onboarding-intelligence.php
          php -l includes/chat-onboarding-v241.php
          php -l includes/cognitive-cards-v520.php
          php -l includes/cognitive-feed-v530.php
          php -l api/cognitive-feed-v530.php
          php -l chat.php
      - name: JavaScript syntax
        run: |
          node --check chat-cognitive-cards-v520.js
          node --check chat-cognitive-feed-v530.js
          node --check tests/onboarding-activation-v243.mjs
          node --check tests/agent-onboarding-current-systems-v242.mjs
          node --check tests/chat-onboarding-v241.mjs
          node --check tests/cognitive-cards-v520.mjs
          node --check tests/cognitive-feed-v530.mjs
      - name: Activation + follow-through contract
        run: node tests/onboarding-activation-v243.mjs
      - name: Retained current-system onboarding
        run: node tests/agent-onboarding-current-systems-v242.mjs
      - name: Retained onboarding domain
        run: node tests/chat-onboarding-v241.mjs
      - name: Retained Universal Cards
        run: node tests/cognitive-cards-v520.mjs
      - name: Retained Cognitive Feed
        run: node tests/cognitive-feed-v530.mjs
