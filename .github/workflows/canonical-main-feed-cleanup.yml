name: Canonical Main Feed Cleanup

on:
  push:
    branches:
      - fix/canonical-main-feed-navigation

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-main-feed-navigation
          fetch-depth: 0
      - name: Apply canonical cleanup
        run: python3 tools/canonical-main-feed-cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chat-legacy-v108.php chat.js chat-notifications-drawer-v240.js includes/member-navigation.php profile-agent.php chat.php
          git commit -m "Canonicalize Main Feed navigation and attention UI"
          git push origin HEAD:fix/canonical-main-feed-navigation
