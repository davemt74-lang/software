name: Cognitive Operations Core v23.00

on:
  pull_request:
    paths:
      - 'docs/VP3_COGNITIVE_OPERATIONS_V2300.md'
      - 'includes/cognitive-operations-v2300.php'
      - 'includes/cognitive-feed-v530.php'
      - 'includes/bootstrap.php'
      - 'chat-cognitive-feed-v530.js'
      - 'chat-cognitive-feed-v530.css'
      - 'tests/cognitive-operations-v2300.mjs'
      - '.github/workflows/cognitive-operations-v2300.yml'
  push:
    branches:
      - 'cognitive-operations-v2300'

jobs:
  contract:
    name: Cognitive Operations v23.00 · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/cognitive-operations-v2300.php
          php -l includes/cognitive-feed-v530.php
          php -l includes/bootstrap.php
      - name: JavaScript syntax
        run: node --check chat-cognitive-feed-v530.js
      - name: v23.00 architecture contract
        run: node tests/cognitive-operations-v2300.mjs
      - name: Retained Cognitive Runtime contracts
        run: |
          node tests/cognitive-runtime-core-v500.mjs
          node tests/cognitive-feed-v530.mjs
          node tests/cognitive-learning-v540.mjs
          node tests/cognitive-planning-v550.mjs
          node tests/cognitive-orchestration-v560.mjs
          node tests/cognitive-memory-v570.mjs
