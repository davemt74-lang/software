name: Canonical AI Gateway

on:
  push:
    branches:
      - main
      - section-2-ai-gateway-**
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: AI Gateway · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint gateway and routing layer
        run: |
          php -l includes/ai-gateway-v031.php
          php -l includes/agent-compute-v020.php
          php -l includes/agent-compute-v021.php
          php -l includes/agent-compute-v023.php
          php -l tests/ai-gateway-v031.php

      - name: Verify gateway and compatibility contracts
        run: |
          php tests/ai-gateway-v031.php
          php tests/agent-compute-v020.php
          php tests/agent-compute-v021.php
          php tests/agent-compute-v023.php
          node tests/agent-compute-v020-contract.mjs
          node tests/agent-compute-v021-contract.mjs
          node tests/agent-compute-v023-contract.mjs
          node tests/chat-execution-v019-contract.mjs
          node tests/chat-execution-v022-contract.mjs
