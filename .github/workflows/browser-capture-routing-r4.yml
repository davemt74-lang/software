name: Conversational Knowledge Actions R9
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: capture-r4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Real atomic capture, project, Chat and Knowledge acceptance
        env:
          VP3_SECTION7_MYSQL_DSN: mysql:host=127.0.0.1;port=3306
          VP3_SECTION7_MYSQL_PASSWORD: fixture
        run: |
          php tests/project-knowledge-r5-mysql.php
          php tests/project-knowledge-r6-mysql.php
          php tests/project-knowledge-r7-mysql.php
          php tests/knowledge-actions-r9-mysql.php
          php tests/project-knowledge-r6-reports.php
          php tests/project-knowledge-r6-delegation.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser acceptance runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Actual extension dispatch and mobile composer
        run: |
          node tests/browser-capture-routing-r4.mjs
          node tests/browser-capture-routing-r4-ui.mjs
          node tests/project-knowledge-r5-ui.mjs
          node tests/project-knowledge-r6-ui.mjs
          node tests/project-knowledge-r7-ui.mjs
          node tests/knowledge-actions-r8-ui.mjs
          node tests/knowledge-actions-r9-ui.mjs
      - name: Capture integration syntax
        run: |
          php -l api/knowledge-actions-r8.php
          php -l includes/knowledge-actions-r8.php
          node --check knowledge-actions-r8.js
          php -l api/project-knowledge-r7.php
          php -l includes/project-knowledge-r7.php
          php -l includes/knowledge-refresh-guard-r7.php
          node --check browser-companion/project-knowledge-r7.js
          php -l api/project-knowledge-r6.php
          php -l includes/project-knowledge-r6.php
          php -l api/project-knowledge-r5.php
          php -l includes/project-knowledge-r5.php
          php -l api/extension-capture-routing-r4.php
          php -l includes/browser-capture-routing-r4.php
          php -l includes/homeserver-workspace-sync-v1.php
          node --check browser-companion/capture-routing-r4.js
          node --check browser-companion/project-knowledge-r5.js
