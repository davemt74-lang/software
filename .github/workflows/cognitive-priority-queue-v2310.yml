name: Cognitive Priority Queue v23.10

on:
  pull_request:
    paths:
      - 'docs/VP3_COGNITIVE_PRIORITY_QUEUE_V2310.md'
      - 'includes/cognitive-priority-queue-v2310.php'
      - 'includes/cognitive-feed-v530.php'
      - 'includes/bootstrap.php'
      - 'chat-cognitive-feed-v530.js'
      - 'chat-cognitive-feed-v530.css'
      - 'chat.php'
      - 'api/extension-cognitive-now-v2120.php'
      - 'tests/cognitive-priority-queue-v2310.mjs'
      - '.github/workflows/cognitive-priority-queue-v2310.yml'
  push:
    branches:
      - 'cognitive-priority-queue-v2310'

jobs:
  contract:
    name: Cognitive Priority Queue v23.10 · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/cognitive-priority-queue-v2310.php
          php -l includes/cognitive-feed-v530.php
          php -l includes/bootstrap.php
          php -l api/extension-cognitive-now-v2120.php
          php -l chat.php
      - name: JavaScript syntax
        run: node --check chat-cognitive-feed-v530.js
      - name: v23.10 architecture contract
        run: node tests/cognitive-priority-queue-v2310.mjs
      - name: Retained cognitive + work queue contracts
        run: |
          node tests/cognitive-operations-v2300.mjs
          node tests/cognitive-feed-v530.mjs
          node tests/cognitive-learning-v540.mjs
          node tests/cognitive-planning-v550.mjs
          node tests/cognitive-orchestration-v560.mjs
          node tests/cognitive-memory-v570.mjs
          node tests/agent-work-queue-v172-contract.mjs
          node tests/agent-work-control-v173-contract.mjs
          node tests/agent-work-dependencies-v174-contract.mjs
          node tests/browser-companion-cognitive-now-v2120.mjs
