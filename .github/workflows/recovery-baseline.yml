name: Recovery Baseline

# Recovery is the final merge gate: once an exact-head run starts, let it finish
# so GitHub records a definitive pass/fail instead of a late cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false


on:
  push:
    branches:
      - main
      - recovery/**
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime versions
        run: |
          php --version
          node --version
          python3 --version

      - name: Interactive capture ownership and Stop acceptance
        run: |
          node tests/capture-ownership-section1.mjs
          php -l chat.php
          php -l artist-listening.php
          php -l meeting.php
          php -l video-editor.php
          php -l admin/stems.php

      - name: Listening and conversation correctness
        run: |
          node tests/listening-section2.mjs
          node tests/transcription-section3.mjs
          node tests/transcription-section4.mjs
          node tests/participants-section5.mjs
          php tests/participants_integrity_section5.php
          php tests/meetings_integrity_section6.php
          php tests/transfer_backup_section7.php
          php tests/agent_context_section8.php
          php tests/speaker_attribution_section9.php
          php tests/meeting_recording_section9.php
          php -l includes/meeting-speakers-section9.php
          php -l api/video-meeting-transcript.php
          node tests/cloud-homeserver-transcription-import-v1.mjs
          node tests/homeserver-transcription-backup-v029-contract.mjs
          node tests/transcription-editor-api.mjs
          php -l includes/artist-listening.php
          php tests/transcription_integrity_section4.php
          node --check chat-voice.js
          node --check conversation-voice-v122.js
          node --check artist-listening.js
          node --check artist-listening-recognition.js
          node --check artist-listening-realtime.js

      - name: Onboarding account authority and pairing recovery
        run: |
          php tests/onboarding_accounts_section11.php
          php tests/auth_accounts_section11.php
          php -l includes/auth.php
          php -l signup.php
          php -l account.php
          php -l api/chat-onboarding-v241.php
          php -l api/homeserver-https-pair-v1300.php
          node tests/homeserver-https-relay-v1300-contract.mjs
          node tests/homeserver-chat-device-code-v1.mjs
          node tests/homeserver-account-pairing-v1210-contract.mjs
          node tests/chat-onboarding-v241.mjs
          php tests/agent-onboarding-skill-v100.php

      - name: Stem editor full-feature audit
        run: |
          node tests/stem-feature-audit.mjs
          php tests/stem_feature_integrity.php
          node tests/stem-project-loader.mjs
          node tests/stem-first-paint-loader-v233.mjs
          node tests/stem-media-failure-v228.mjs
          node tests/stem-midi-runtime-repair-v220.mjs
          node tests/stem-v210-reintroduction-v225.mjs
          node tests/stem-v211-reintroduction-v226.mjs
          node tests/stem-v211-quarantine-v227.mjs
          node tests/stem-command-bus-v159.mjs
          node tests/stem-project-create-library-v158.mjs
          node tests/stem-agent-v131-integration.mjs
          node tests/fan-private-stem-mixes.mjs

      - name: Music module full-feature audit
        run: |
          node tests/music-module-runtime.mjs
          php tests/music-module-integrity.php
          node tests/player-catalog-v190.mjs
          php tests/player-catalog-v190.php
          node tests/artist-music-v185.mjs
          node tests/artist-media-v182.mjs
          node tests/artist-profile-v181.mjs
          node tests/artist-cms-v186.mjs
          node tests/music-workspace-resource-ownership-v330.mjs
          node tests/release-workspace-compat-v332.mjs
          node --check chat.js

      - name: Contacts CRM tasks and calendar Section 12 integrity
        run: |
          php tests/productivity_section12.php
          node tests/user-calendar-v1300-contract.mjs
          node tests/agent-calendar-sync-v500-contract.mjs
          node tests/homeserver-v241-contacts-continuity-contract.mjs
          php tests/homeserver-v241-contacts-continuity-unit.php
          node tests/homeserver-v243-task-calendar-continuity-contract.mjs
          php tests/homeserver-v243-task-calendar-continuity-unit.php
          php tests/calendar-schedule-awareness-v1330-test.php
          node tests/crm-v180.mjs
      - name: Section 14 current permissions and authority
        run: php tests/authority_section14.php
      - name: Section 13 events, notifications and automation
        run: |
          php -l includes/notifications.php
          php -l tests/events_automation_section13.php
          php tests/events_automation_section13.php
          node tests/notifications_state_section13.mjs
          node tests/chat-notifications-brain-v240.mjs
      - name: Run recovered baseline suite
        run: python3 tools/run_recovery_baseline.py

      - name: CI workflow governance
        run: node tests/ci-workflow-consolidation.mjs
