name: Recovery Baseline

# Recovery is the final merge gate: once an exact-head run starts, let it finish
# so GitHub records a definitive pass/fail instead of a late cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false


on:
  push:
    branches:
      - main
      - recovery/**
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime versions
        run: |
          php --version
          node --version
          python3 --version

      - name: Interactive capture ownership and Stop acceptance
        run: |
          node tests/capture-ownership-section1.mjs
          php -l chat.php
          php -l artist-listening.php
          php -l meeting.php
          php -l video-editor.php
          php -l admin/stems.php

      - name: Listening and conversation correctness
        run: |
          node tests/listening-section2.mjs
          node tests/transcription-section3.mjs
          node tests/transcription-section4.mjs
          node tests/participants-section5.mjs
          php tests/participants_integrity_section5.php
          php tests/meetings_integrity_section6.php
          php tests/transfer_backup_section7.php
          php tests/agent_context_section8.php
          php tests/speaker_attribution_section9.php
          php tests/meeting_recording_section9.php
          php -l includes/meeting-speakers-section9.php
          php -l api/video-meeting-transcript.php
          node tests/cloud-homeserver-transcription-import-v1.mjs
          node tests/homeserver-transcription-backup-v029-contract.mjs
          node tests/transcription-editor-api.mjs
          php -l includes/artist-listening.php
          php tests/transcription_integrity_section4.php
          node --check chat-voice.js
          node --check conversation-voice-v122.js
          node --check artist-listening.js
          node --check artist-listening-recognition.js
          node --check artist-listening-realtime.js

      - name: Onboarding account authority and pairing recovery
        run: |
          php tests/onboarding_accounts_section11.php
          php -l api/chat-onboarding-v241.php
          php -l api/homeserver-https-pair-v1300.php
          node tests/homeserver-https-relay-v1300-contract.mjs
          node tests/homeserver-chat-device-code-v1.mjs
          node tests/homeserver-account-pairing-v1210-contract.mjs
          node tests/chat-onboarding-v241.mjs
          php tests/agent-onboarding-skill-v100.php

      - name: Run recovered baseline suite
        run: python3 tools/run_recovery_baseline.py

      - name: CI workflow governance
        run: node tests/ci-workflow-consolidation.mjs

