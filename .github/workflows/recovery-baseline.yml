name: Recovery Baseline

# Recovery is the final merge gate: once an exact-head run starts, let it finish
# so GitHub records a definitive pass/fail instead of a late cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false


on:
  push:
    branches:
      - main
      - recovery/**
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite, curl, sodium

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Connected Sites authorization and direct Cloud routing
        run: |
          php tests/connected-gelato-v1.php
          php tests/connected-sites-chat-v1.php
          node tests/connected-gelato-api-v1.mjs

      - name: Current capability awareness and permission isolation
        run: |
          php tests/agent-capability-awareness-v1.php
          php tests/agent-capability-chat-v1.php
          php tests/agent-catch-up-v1.php
          php tests/agent-catch-up-meeting-prep-v1.php
          php tests/agent-catch-up-profile-calls-v1.php
          node tests/cognitive-presentation-account-binding.mjs
          node tests/calendar-schedule-awareness-v1330-contract.mjs
          php tests/phone-agent-read-v1.php
          php tests/workflow-receipts-v1.php
          php tests/scheduling-receipts-v1.php
          php tests/agent-record-tools-v1.php
          php tests/task-lists-v1.php
          php tests/participant-updates-v1.php
          php tests/participant-conversation-v2.php
          node tests/participant-updates-api.mjs
          php tests/agent-navigation-v1.php
          php tests/voice-enrollment-tool-v1.php
          php tests/runtime-route-selection-v1.php
          php tests/agent-media-read-v1.php
          php tests/agent-photo-media-v1.php
          php tests/agent-image-generation-v1.php
          php tests/agent-image-transport-v1.php
          node tests/chat-canvas-media-api.mjs
          php tests/agent-app-read-v1.php
          php tests/agent-private-share-read-v1.php
          php tests/agent-vrss-read-v1.php
          php tests/agent-vrss-outcomes-v1.php
          php tests/agent-tracky-read-v1.php
          php tests/agent-radar-read-v1.php
          php tests/agent-analytics-read-v1.php
          php tests/agent-release-routing-v1.php
          php tests/agent-release-tools-v1.php
          php tests/agent-profile-webmcp-read-v1.php
          php tests/agent-profile-webmcp-outcomes-v1.php
          node tests/agent-release-profile-chat-api.mjs
          node tests/profile-webmcp-native-outcomes-v1.mjs
          php tests/profile-public-authority-pa1.php
          php tests/agent-message-authority-pa1.php
          node tests/agent-message-api-pa1.mjs
          node tests/profile-owner-api-pa1.mjs
          node tests/profile-owner-threads-pa1.mjs
          php tests/profile-handoff-pa3.php
          php tests/profile-handoff-binding-pa3.php
          php tests/profile-handoff-recovery-pa3.php
          php tests/profile-live-text-pa3d.php
          node tests/profile-handoff-api-pa3.mjs
          node tests/profile-live-chat-api-pa3d.mjs
          node tests/profile-visitor-doorbell-pa3.mjs
          node tests/profile-visitor-handoff-pa3.mjs
          node tests/profile-chat-choice-pa3d.mjs
          php tests/profile-calls-pa3c.php
          php tests/profile-calls-provider-pa3c.php
          php tests/profile-calls-concurrency-pa3c.php
          node tests/profile-calls-api-pa3c.mjs
          node tests/profile-calls-admin-pa3c.mjs
          node tests/profile-calls-pa3c.mjs
          php tests/profile-assisted-phone-settings-pa3c.php
          node tests/profile-call-assistance-api-pa3c.mjs
          python3 -B tests/profile-call-worker-pa3c.py
          php tests/commerce-provider-evidence-pa2.php
          php tests/commerce-recovery-pa2.php
          php tests/commerce-projection-recovery-pa2.php
          php tests/commerce-checkout-creation-pa2.php
          php tests/commerce-appointment-recovery-pa2.php
          php tests/profile-checkout-status-pa2.php
          node tests/commerce-webhook-pa2.mjs
          node tests/profile-checkout-review-pa2.mjs
          php tests/agent-system-app-read-v1.php
          php tests/agent-app-operations-v1.php
          php tests/homeserver-read-receipts-v1.php
          node tests/agent-capability-chat-api.mjs
          php tests/agent-tool-receipts-v1.php
          php tests/tool-json-provider-v1.php
          php tests/reminder-read-repair-v1.php
          php tests/proactive-chat-repair-v1.php
          php tests/transcript-agent-v1.php
          php tests/transcript-conversation-v1.php
          php tests/transcript-agent-intelligence-v1.php
          php tests/transcript-brain-v1.php
          python3 tools/check_agent_capability_inventory.py

      - name: Runtime versions
        run: |
          php --version
          node --version
          python3 --version

      - name: Upgrade POST database initialization and TV schema readiness
        run: php tests/upgrade-database-connection.php

      - name: TV Watching account history and multimodal provider payloads
        run: |
          php tests/tv-watching-v1.php
          php tests/tv-vision-provider-v1.php
          php -l api/tv-watching-v1.php

      - name: Haiku 5.5 routing and request compatibility
        run: php tests/haiku55.php

      - name: Interactive capture ownership and Stop acceptance
        run: |
          node tests/capture-ownership-section1.mjs
          php -l chat.php
          php -l artist-listening.php
          php -l meeting.php
          php -l video-editor.php
          php -l admin/stems.php

      - name: Listening and conversation correctness
        run: |
          node tests/listening-section2.mjs
          node tests/transcription-section3.mjs
          node tests/transcription-section4.mjs
          node tests/participants-section5.mjs
          php tests/participants_integrity_section5.php
          php tests/meetings_integrity_section6.php
          php tests/transfer_backup_section7.php
          php tests/agent_context_section8.php
          php tests/speaker_attribution_section9.php
          php tests/meeting_recording_section9.php
          php -l includes/meeting-speakers-section9.php
          php -l api/video-meeting-transcript.php
          node tests/cloud-homeserver-transcription-import-v1.mjs
          node tests/homeserver-transcription-backup-v029-contract.mjs
          node tests/transcription-editor-api.mjs
          php -l includes/artist-listening.php
          php tests/transcription_integrity_section4.php
          node --check chat-voice.js
          node --check conversation-voice-v122.js
          node --check artist-listening.js
          node --check artist-listening-recognition.js
          node --check artist-listening-realtime.js

      - name: Onboarding account authority and pairing recovery
        run: |
          python3 tests/homeserver_pairing_request_size.py
          php tests/onboarding_accounts_section11.php
          php tests/auth_accounts_section11.php
          php -l includes/auth.php
          php -l signup.php
          php -l account.php
          php -l api/chat-onboarding-v241.php
          php -l api/homeserver-https-pair-v1300.php
          node tests/homeserver-https-relay-v1300-contract.mjs
          node tests/homeserver-chat-device-code-v1.mjs
          node tests/homeserver-account-pairing-v1210-contract.mjs
          node tests/chat-onboarding-v241.mjs
          php tests/agent-onboarding-skill-v100.php

      - name: Stem editor full-feature audit
        run: |
          node tests/stem-feature-audit.mjs
          php tests/stem_feature_integrity.php
          node tests/stem-project-loader.mjs
          node tests/stem-first-paint-loader-v233.mjs
          node tests/stem-media-failure-v228.mjs
          node tests/stem-midi-runtime-repair-v220.mjs
          node tests/stem-v210-reintroduction-v225.mjs
          node tests/stem-v211-reintroduction-v226.mjs
          node tests/stem-v211-quarantine-v227.mjs
          node tests/stem-command-bus-v159.mjs
          node tests/stem-project-create-library-v158.mjs
          node tests/stem-agent-v131-integration.mjs
          node tests/fan-private-stem-mixes.mjs

      - name: Music module full-feature audit
        run: |
          node tests/chat-load-runtime.mjs
          php tests/cloud-load-integrity.php
          node tests/chat-media-http.mjs
          node tests/music-module-runtime.mjs
          php tests/music-module-integrity.php
          node tests/player-catalog-v190.mjs
          php tests/player-catalog-v190.php
          node tests/artist-music-v185.mjs
          node tests/artist-media-v182.mjs
          node tests/artist-profile-v181.mjs
          node tests/artist-cms-v186.mjs
          node tests/music-workspace-resource-ownership-v330.mjs
          node tests/release-workspace-compat-v332.mjs
          node --check chat.js

      - name: Contacts CRM tasks and calendar Section 12 integrity
        run: |
          php tests/productivity_section12.php
          node tests/user-calendar-v1300-contract.mjs
          node tests/agent-calendar-sync-v500-contract.mjs
          node tests/homeserver-v241-contacts-continuity-contract.mjs
          php tests/homeserver-v241-contacts-continuity-unit.php
          node tests/homeserver-v243-task-calendar-continuity-contract.mjs
          php tests/homeserver-v243-task-calendar-continuity-unit.php
          php tests/calendar-schedule-awareness-v1330-test.php
          node tests/crm-v180.mjs
      - name: Section 14 current permissions and authority
        run: php tests/authority_section14.php
      - name: Section 13 events, notifications and automation
        run: |
          php -l includes/notifications.php
          php -l tests/events_automation_section13.php
          php tests/events_automation_section13.php
          node tests/notifications_state_section13.mjs
          node tests/chat-notifications-brain-v240.mjs
      - name: Run recovered baseline suite
        run: python3 tools/run_recovery_baseline.py

      - name: CI workflow governance
        run: node tests/ci-workflow-consolidation.mjs

  connected-sites-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for the shipped Chat tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test pairing, the installed agent name and disconnect in Chat
        run: node tests/connected-sites-browser.mjs

