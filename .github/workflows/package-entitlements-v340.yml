name: Package Entitlements v3.40

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches:
      - main
      - feature/package-entitlement-composition-v340

permissions:
  contents: read

jobs:
  entitlement-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP lint entitlement surfaces
        run: |
          php -l includes/subscription-schema.php
          php -l includes/subscription-entitlements-v340.php
          php -l includes/subscriptions.php
          php -l includes/subscription-access.php
          php -l includes/subscription-request-gates.php
          php -l includes/permissions-v105.php
          php -l includes/artist-workspaces-v104.php
          php -l includes/team-subscription.php
          php -l includes/music-workspace-plugin-v320.php
          php -l admin/packages.php
          php -l admin/entitlements.php
          php -l admin/permissions.php
          php -l setup.php
          php -l upgrade.php
          php -l includes/member-navigation.php
          php -l tracky.php
          php -l includes/system-apps-v100.php
          php -l includes/system-apps-v110.php
          php -l includes/system-apps-v120.php
          php -l includes/system-apps-v130.php
          php -l includes/system-apps-v140.php
          php -l includes/system-apps-v150.php
          php -l includes/system-apps-v160.php
          php -l includes/system-apps-v170.php
          php -l includes/system-apps-v180.php
          php -l includes/system-apps-v190.php
          php -l includes/system-apps-v200.php
          php -l tests/system-apps-v190-runtime.php
          php -l api/system-apps-v100.php
          php -l apps.php

      - name: Package entitlement composition contract
        run: node tests/package-entitlement-composition-v340.mjs

      - name: Phone and Messaging Cloud PH2 lint
        run: |
          php -l includes/phone-cloud-v100.php
          php -l api/phone-cloud-v100.php
          php -l admin/phone.php
          php -l phone.php
          php -l includes/member-user-menu.php
          php -l includes/member-header.php
          php -l includes/main-sidebar.php
          node --check member-agent-voice-menu.js

      - name: Phone package and user dropdown contract
        run: node tests/phone-cloud-ph2-contract.mjs

      - name: Agent SMS Inbox PH3A lint and contracts
        run: |
          php -l includes/phone-sms-v110.php
          php -l api/phone-sms-inbound-v110.php
          php -l api/phone-sms-v110.php
          php -l phone-inbox.php
          php -l admin/phone.php
          php -l phone.php
          php -l upgrade.php
          node tests/phone-sms-ph3a-contract.mjs
          php tests/phone-sms-ph3a-runtime.php

      - name: Authorized Outgoing SMS PH3B lint and contracts
        run: |
          php -l includes/phone-sms-outbound-v120.php
          php -l api/phone-sms-outbound-v120.php
          php -l api/phone-sms-status-v120.php
          php -l phone-inbox.php
          php -l admin/phone.php
          php -l admin/packages.php
          php -l upgrade.php
          node tests/phone-sms-ph3b-contract.mjs
          php tests/phone-sms-ph3b-runtime.php

      - name: Incoming Voice and Voicemail PH3C lint and contracts
        run: |
          php -l includes/phone-voice-v130.php
          php -l api/phone-voice-inbound-v130.php
          php -l api/phone-voice-complete-v130.php
          php -l api/phone-voice-recording-v130.php
          php -l api/phone-voice-audio-v130.php
          php -l phone-calls.php
          php -l admin/phone.php
          php -l phone.php
          php -l upgrade.php
          node tests/phone-voice-ph3c-contract.mjs
          php tests/phone-voice-ph3c-runtime.php

      - name: Tenant-bound Voice Routing PH3E runtime
        run: |
          php -l includes/phone-voice-v130.php
          php -l tests/phone-voice-ph3e-runtime.php
          php tests/phone-voice-ph3e-runtime.php

      - name: Cloud Voice Conversations PH3F runtime and contracts
        run: |
          php -l includes/phone-voice-conversation-v140.php
          php -l api/phone-voice-turn-v140.php
          php -l includes/ai-settings.php
          php -l admin/phone.php
          php -l phone-calls.php
          php -l upgrade.php
          php -l tests/phone-voice-ph3f-runtime.php
          node tests/phone-voice-ph3f-contract.mjs
          php tests/phone-voice-ph3f-runtime.php
      - name: Cloud SIP Streaming PH3G runtime and contracts
        run: |
          php -l includes/phone-voice-stream-v150.php
          php -l includes/phone-voice-v130.php
          php -l api/phone-voice-stream-resolve-v150.php
          php -l api/phone-voice-stream-active-v150.php
          php -l api/phone-voice-stream-complete-v150.php
          php -l api/phone-voice-inbound-v130.php
          php -l admin/phone.php
          php -l upgrade.php
          php -l tests/phone-voice-ph3g-runtime.php
          php -l tests/phone-voice-ph3g-integration.php
          node tests/phone-voice-ph3g-contract.mjs
          php tests/phone-voice-ph3g-runtime.php
          php tests/phone-voice-ph3g-integration.php

      - name: PH3H non-billable live calling preflight
        run: |
          php -l includes/phone-voice-readiness-v160.php
          php -l admin/phone.php
          php -l tests/phone-voice-ph3h-runtime.php
          php tests/phone-voice-ph3h-runtime.php

      - name: PH3I-A account setup guidance
        run: |
          php -l includes/phone-setup-v170.php
          php -l admin/phone.php
          php -l tests/phone-setup-ph3ia-runtime.php
          php tests/phone-setup-ph3ia-runtime.php

      - name: PH3I-B signed worker heartbeat and health view
        run: |
          php -l includes/phone-worker-health-v171.php
          php -l api/phone-worker-heartbeat-v171.php
          php -l admin/phone.php
          php -l upgrade.php
          php -l tests/phone-worker-ph3ib-runtime.php
          php tests/phone-worker-ph3ib-runtime.php

      - name: Tracky navigation and overview contract
        run: node tests/tracky-navigation-overview-v282.mjs

      - name: System Apps catalog and ownership contract
        run: node tests/system-apps-v100-contract.mjs

      - name: System Apps HomeServer install contract
        run: node tests/system-apps-v110-contract.mjs

      - name: System Apps Hosting binding contract
        run: node tests/system-apps-v120-contract.mjs

      - name: System Apps revocation hardening contract
        run: node tests/system-apps-v130-contract.mjs

      - name: System Apps unified product UX contract
        run: node tests/system-apps-v140-contract.mjs

      - name: System Apps Agent integration contract
        run: node tests/system-apps-v150-contract.mjs

      - name: System Apps governed Agent actions contract
        run: node tests/system-apps-v160-contract.mjs

      - name: System Apps health diagnostics contract
        run: node tests/system-apps-v170-contract.mjs

      - name: System Apps end-to-end Agent action UX contract
        run: |
          node tests/system-apps-v190-contract.mjs
          php tests/system-apps-v190-runtime.php

      - name: System Apps integrated release lifecycle contract
        run: node tests/system-apps-v200-contract.mjs

  phone-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, curl, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assignment, signed callbacks, Chat integration and private recordings
        run: |
          php tests/phone-assignment-isolation-v111.php
          php tests/phone-subscription-access-v1.php
          php tests/phone-assigned-entrypoints-v1.php
          php tests/phone-browser-workspace-v1.php
          php tests/operator-schedule-calendar-v1.php
          php tests/operator-outreach-v1.php
          php tests/operator-schedule-calendar-v1.php timeout
          php tests/operator-schedule-calendar-v1.php mismatch
          bash tests/operator-schedule-worker-cli-v1.sh
          php tests/operator-holder-modes-v1.php
          php tests/operator-auto-call-migration.php
          php tests/phone-operator-suggestion-evidence.php
          php tests/phone-caller-contacts-schema-v1.php
          php tests/phone-contact-management-v1.php
          php tests/calendar-recurrence-v1340.php
          php tests/calendar-event-v1340-page.php
          php tests/phone-browser-load-v1.php
          php tests/phone-workspace-integration-v1.php
          php tests/phone-recording-pipeline-v1.php
          php tests/phone-voicemail-v1.php
          php tests/phone-recording-speech-v1.php
          php tests/phone-recording-audio-http-v1.php
          php tests/ai-direct-authority-scope-v1.php
          php tests/phone-voice-utc-v131.php
          php tests/phone-agent-read-v1.php
          php tests/phone-sms-ph3a-runtime.php
          php tests/phone-sms-ph3b-runtime.php
          node tests/phone-workspace-v1.mjs
          node tests/phone-voicemail-capture-v1.mjs
          node tests/phone-voicemail-chat-v1.mjs
          node tests/phone-operator-capture-v1.mjs
          node tests/phone-operator-voice-mixer-v1.mjs
          PHP_BIN=php node tests/phone-workspace-release-v1.mjs --projection-only
      - name: Private phone push queue, canonical sources and runtime guard
        run: |
          php tests/phone-sqlite-transactions-v1.php
          php tests/phone-push-delivery-v1.php
          php tests/phone-push-events-v1.php
          php tests/phone-push-vapid-cache-v1.php
          php tests/phone-push-transport-v1.php
          node tests/phone-push-delivery-ui-v1.mjs
          node tests/phone-push-service-worker-v1.mjs
          if php -r 'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);'; then
            node tests/phone-push-transport-crypto-v1.mjs
            php tests/phone-push-worker-v1.php
          fi
          node tests/phone-push-http-v1.mjs
      - name: PHP and JavaScript syntax
        run: |
          git ls-files -z '*phone*.php' | xargs -0 -n1 php -l
          php -l setup.php
          php -l upgrade.php
          php -l includes/bootstrap.php
          php -l includes/ai-direct-account-v1.php
          node --check phone-workspace-v1.js
          node --check phone-operator-capture-v1.js
          node --check phone-voicemail-capture-v1.js
          node --check phone-operator-voice-mixer-v1.js
          php -l includes/agent-operator-voice-turns-v1.php
          php -l includes/agent-operator-admission-v1.php
          php -l includes/agent-operator-admission-schema-v1.php
          php -l includes/agent-operator-live-v1.php
          php -l includes/agent-operator-live-schema-v1.php
          node --check chat.js

  phone-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      VP3_PHONE_MYSQL_USER: root
      VP3_PHONE_MYSQL_PASSWORD: fixture_password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, curl, dom, fileinfo
          coverage: none
      - name: Create isolated disposable databases
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306",getenv("VP3_PHONE_MYSQL_USER"),getenv("VP3_PHONE_MYSQL_PASSWORD")); foreach(["phone_assignment_test","phone_workspace_test","phone_pipeline_test","phone_subscription_test","phone_contacts_test","phone_voicemail_test"] as $name){$p->exec("CREATE DATABASE ".$name." CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");}'
      - name: Upgrade historical SMS assignment ownership on MySQL
        env:
          VP3_PHONE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=phone_assignment_test;charset=utf8mb4
        run: php tests/phone-assignment-isolation-v111.php
      - name: Browser phone state and signed carrier lifecycle on MySQL
        env:
          VP3_PHONE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=phone_workspace_test;charset=utf8mb4
        run: php tests/phone-browser-workspace-v1.php
      - name: Private recording persistence and speech budget on MySQL
        env:
          VP3_PHONE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=phone_pipeline_test;charset=utf8mb4
        run: php tests/phone-recording-pipeline-v1.php
      - name: Contact ownership and Calendar schedules on MySQL
        env:
          VP3_PHONE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=phone_contacts_test;charset=utf8mb4
        run: php tests/phone-contact-management-v1.php
      - name: Real monthly subscriptions and explicit admin grants on MySQL
        env:
          VP3_PHONE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=phone_subscription_test;charset=utf8mb4
        run: php tests/phone-subscription-access-v1.php
      - name: Private voicemail settings greetings and deletion on MySQL
        env:
          VP3_PHONE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=phone_voicemail_test;charset=utf8mb4
        run: php tests/phone-voicemail-v1.php
      - name: Private phone push leases and revocation on native MySQL
        env:
          VP3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          VP3_TEST_MYSQL_USER: root
          VP3_TEST_MYSQL_PASS: fixture_password
        run: |
          php tests/phone-push-delivery-v1.php
          php tests/phone-push-vapid-cache-v1.php

  phone-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, curl, dom, fileinfo
          coverage: none
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: bash tools/install-ci-chromium.sh
      - name: Actual PHP projection, browser call controls and bundled SDK
        env:
          PHP_BIN: php
        run: node tests/phone-workspace-release-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-phone-browser-review
          path: tests/artifacts/phone-workspace-*.png
          if-no-files-found: error
