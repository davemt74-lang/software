name: Package Entitlements v3.40

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches:
      - main
      - feature/package-entitlement-composition-v340

permissions:
  contents: read

jobs:
  entitlement-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP lint entitlement surfaces
        run: |
          php -l includes/subscription-schema.php
          php -l includes/subscription-entitlements-v340.php
          php -l includes/subscriptions.php
          php -l includes/subscription-access.php
          php -l includes/subscription-request-gates.php
          php -l includes/permissions-v105.php
          php -l includes/artist-workspaces-v104.php
          php -l includes/team-subscription.php
          php -l includes/music-workspace-plugin-v320.php
          php -l admin/packages.php
          php -l admin/entitlements.php
          php -l admin/permissions.php
          php -l setup.php
          php -l upgrade.php
          php -l includes/member-navigation.php
          php -l tracky.php
          php -l includes/system-apps-v100.php
          php -l includes/system-apps-v110.php
          php -l includes/system-apps-v120.php
          php -l includes/system-apps-v130.php
          php -l includes/system-apps-v140.php
          php -l includes/system-apps-v150.php
          php -l includes/system-apps-v160.php
          php -l includes/system-apps-v170.php
          php -l includes/system-apps-v180.php
          php -l includes/system-apps-v190.php
          php -l includes/system-apps-v200.php
          php -l tests/system-apps-v190-runtime.php
          php -l api/system-apps-v100.php
          php -l apps.php

      - name: Package entitlement composition contract
        run: node tests/package-entitlement-composition-v340.mjs

      - name: Tracky navigation and overview contract
        run: node tests/tracky-navigation-overview-v282.mjs

      - name: System Apps catalog and ownership contract
        run: node tests/system-apps-v100-contract.mjs

      - name: System Apps HomeServer install contract
        run: node tests/system-apps-v110-contract.mjs

      - name: System Apps Hosting binding contract
        run: node tests/system-apps-v120-contract.mjs

      - name: System Apps revocation hardening contract
        run: node tests/system-apps-v130-contract.mjs

      - name: System Apps unified product UX contract
        run: node tests/system-apps-v140-contract.mjs

      - name: System Apps Agent integration contract
        run: node tests/system-apps-v150-contract.mjs

      - name: System Apps governed Agent actions contract
        run: node tests/system-apps-v160-contract.mjs

      - name: System Apps health diagnostics contract
        run: node tests/system-apps-v170-contract.mjs

      - name: System Apps end-to-end Agent action UX contract
        run: |
          node tests/system-apps-v190-contract.mjs
          php tests/system-apps-v190-runtime.php

      - name: System Apps integrated release lifecycle contract
        run: node tests/system-apps-v200-contract.mjs
