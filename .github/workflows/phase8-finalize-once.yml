name: Phase 8 Finalize Once

on:
  push:
    branches: [feature-paid-appointments-phase-8]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: feature-paid-appointments-phase-8
          fetch-depth: 0
      - name: Apply final Phase 8 fixes
        shell: bash
        run: |
          cat > /tmp/phase8_patch.py <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:180]!r}')
              text=text.replace(old,new,count)
              p.write_text(text)

          # 1) Provider checkout hardening + one canonical money parser.
          p=Path('includes/agent-paid-appointments-v800-part3.php')
          text=p.read_text()
          marker='function agent_paid_appointments_decimal_to_minor_v800'
          if marker in text:
              start=text.index(marker)
              end=text.index('function agent_paid_appointments_create_checkout_v800',start)
              text=text[:start]+text[end:]
          old="$params=['mode'=>'payment','success_url'=>$return.'&session_id={CHECKOUT_SESSION_ID}','cancel_url'=>$cancel,'customer_email'=>(string)$paid['payer_email'],'line_items'=>[['quantity'=>1,'price_data'=>['currency'=>$currency,'unit_amount'=>$due,'product_data'=>['name'=>$name]]]],'metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']],'payment_intent_data'=>['metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']]]];"
          new="$params=['mode'=>'payment','success_url'=>$return.'&session_id={CHECKOUT_SESSION_ID}','cancel_url'=>$cancel,'line_items'=>[['quantity'=>1,'price_data'=>['currency'=>$currency,'unit_amount'=>$due,'product_data'=>['name'=>$name]]]],'metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']],'payment_intent_data'=>['metadata'=>['vp3_paid_booking_id'=>(string)$paid['id']]]];$payerEmail=trim((string)$paid['payer_email']);if($payerEmail!==''&&filter_var($payerEmail,FILTER_VALIDATE_EMAIL))$params['customer_email']=$payerEmail;"
          if old in text: text=text.replace(old,new,1)
          old="$body=['idempotency_key'=>$idempotency,'quick_pay'=>['name'=>$name,'price_money'=>['amount'=>$due,'currency'=>strtoupper($currency)],'location_id'=>$locationId],'checkout_options'=>['redirect_url'=>$return]];\n        if($fee>0)$body['checkout_options']['app_fee_money']=['amount'=>$fee,'currency'=>strtoupper($currency)];"
          new="$squareCurrency=strtoupper(trim((string)($caps['currency']??'')));if($squareCurrency!==''&&$squareCurrency!==strtoupper($currency))throw new RuntimeException('This Square location does not support the appointment currency.');\n        $body=['idempotency_key'=>$idempotency,'quick_pay'=>['name'=>$name,'price_money'=>['amount'=>$due,'currency'=>strtoupper($currency)],'location_id'=>$locationId],'checkout_options'=>['redirect_url'=>$return]];\n        if($fee>0){$squareCfg=agent_paid_appointments_config_v800()['square'];if((string)$squareCfg['environment']!=='production')throw new RuntimeException('Square sandbox does not support application fees for hosted appointment checkout. Set the appointment platform fee to 0 while testing Square sandbox.');$body['checkout_options']['app_fee_money']=['amount'=>$fee,'currency'=>strtoupper($currency)];}"
          if old in text: text=text.replace(old,new,1)
          p.write_text(text)

          # 2) Provider completion: exact PayPal minor units and external payment lineage.
          p=Path('includes/agent-paid-appointments-v800-part4.php')
          text=p.read_text()
          text=text.replace("$amount=(int)round(((float)($capture['amount']['value']??0))*100);","$amount=agent_paid_appointments_decimal_to_minor_v800((string)($capture['amount']['value']??'0'));",1)
          text=text.replace("(int)round(((float)($capture['amount']['value']??0))*100)","agent_paid_appointments_decimal_to_minor_v800((string)($capture['amount']['value']??'0'))",1)
          old="if((string)$paid['provider_snapshot']!==$provider)throw new RuntimeException('Payment provider does not match this appointment.');if($amountCents<(int)$paid['amount_due_cents'])"
          new="if((string)$paid['provider_snapshot']!==$provider)throw new RuntimeException('Payment provider does not match this appointment.');if(trim($externalPaymentId)==='')throw new RuntimeException('Payment provider transaction identity is missing.');if($amountCents<(int)$paid['amount_due_cents'])"
          if old in text: text=text.replace(old,new,1)
          p.write_text(text)

          # 3) Central lifecycle reschedule guard: pending commercial holds may cancel, but never reschedule into confirmed.
          p=Path('includes/agent-appointment-lifecycle-v700-part4.php')
          text=p.read_text()
          needle="    if($bookingId<1||$ownerId<1||!in_array((string)($booking['status']??''),['pending','confirmed'],true))throw new RuntimeException('Only an active appointment can be rescheduled.');\n    $event=agent_scheduling_event_type_v430"
          replacement="    if($bookingId<1||$ownerId<1||!in_array((string)($booking['status']??''),['pending','confirmed'],true))throw new RuntimeException('Only an active appointment can be rescheduled.');\n    if(function_exists('agent_paid_appointments_schema_ready_v800')&&agent_paid_appointments_schema_ready_v800($pdo)){\n        $paid=agent_paid_appointments_paid_booking_for_booking_v800($pdo,$bookingId);\n        if($paid&&(string)$paid['payment_status']==='awaiting_payment')throw new RuntimeException('Complete or cancel the pending appointment payment before rescheduling.');\n    }\n    $event=agent_scheduling_event_type_v430"
          if needle in text: text=text.replace(needle,replacement,1)
          p.write_text(text)

          # 4) Public manage flow: cancellation must remain available during a hold; reschedule is blocked.
          p=Path('public-booking-controller-v700.php')
          text=p.read_text()
          wrong="            $paid = $paidReady ? agent_paid_appointments_paid_booking_for_booking_v800($pdo, (int)$managedBooking['id']) : null;\n            if ($paid && (string)$paid['payment_status'] === 'awaiting_payment') throw new RuntimeException('Complete or cancel the pending appointment payment before rescheduling.');\n            if ($lifecycleReady) {"
          right="            $paid = $paidReady ? agent_paid_appointments_paid_booking_for_booking_v800($pdo, (int)$managedBooking['id']) : null;\n            if ($lifecycleReady) {"
          if wrong in text: text=text.replace(wrong,right,1)
          needle="        if ($action === 'reschedule') {\n            agent_scheduling_public_rate_limit_v450('reschedule', 10, 60);\n            if (!$managedBooking || !hash_equals((string)$managedBooking['cancel_token'], $manageToken)) throw new RuntimeException('This booking management link is not valid.');\n            $paid = $paidReady ? agent_paid_appointments_paid_booking_for_booking_v800($pdo, (int)$managedBooking['id']) : null;\n            if ($lifecycleReady) {"
          replacement="        if ($action === 'reschedule') {\n            agent_scheduling_public_rate_limit_v450('reschedule', 10, 60);\n            if (!$managedBooking || !hash_equals((string)$managedBooking['cancel_token'], $manageToken)) throw new RuntimeException('This booking management link is not valid.');\n            $paid = $paidReady ? agent_paid_appointments_paid_booking_for_booking_v800($pdo, (int)$managedBooking['id']) : null;\n            if ($paid && (string)$paid['payment_status'] === 'awaiting_payment') throw new RuntimeException('Complete or cancel the pending appointment payment before rescheduling.');\n            if ($lifecycleReady) {"
          if needle in text: text=text.replace(needle,replacement,1)
          p.write_text(text)

          # 5) Agent Chat paid create/cancel.
          p=Path('includes/agent-scheduling-tools-v460.php')
          text=p.read_text()
          create_start=text.index("    if($operation==='create'){")
          create_end=text.index("    if($operation==='reschedule'){",create_start)
          create_block="""    if($operation==='create'){
        $event=agent_scheduling_event_type_v430($pdo,(int)($payload['event_type_id']??0));
        if(!$event||(int)$event['owner_user_id']!==(int)$user['id'])throw new RuntimeException('That appointment type is no longer available to this account.');
        $guestEmail=strtolower(trim((string)($payload['guest_email']??'')));
        $paidDue=0;
        if(function_exists('agent_paid_appointments_schema_ready_v800')&&agent_paid_appointments_schema_ready_v800($pdo)){
            $paidTerms=agent_paid_appointments_event_terms_v800($pdo,(int)$event['id']);
            $paidDue=agent_paid_appointments_amount_due_v800($paidTerms);
            if($paidDue>0&&($guestEmail===''||!filter_var($guestEmail,FILTER_VALIDATE_EMAIL)))throw new RuntimeException('Paid appointments need the guest email before I can hold the time and create a secure payment link.');
            if($paidDue>0&&(!function_exists('agent_appointment_lifecycle_schema_ready_v700')||!agent_appointment_lifecycle_schema_ready_v700($pdo)))throw new RuntimeException('Run the VP3 database upgrade before Agent-paid appointment booking can be used.');
        }
        $booking=agent_scheduling_create_booking_v430($pdo,[
            'event_type_id'=>(int)$event['id'],'start_at_utc'=>(string)$payload['start_at_utc'],'guest_timezone'=>(string)$event['schedule_timezone'],
            'guest_name'=>(string)$payload['guest_name'],'guest_email'=>$guestEmail,'guest_phone'=>'','guest_notes'=>'',
            'created_by_user_id'=>(int)$user['id'],'created_by_agent_id'=>$agentId,'source'=>'agent',
        ]);
        if($paidDue>0){
            $paid=null;
            try{
                $canonical=agent_appointment_lifecycle_booking_v700($pdo,(int)$booking['id'],(int)$user['id'])?:$booking;
                $paid=agent_paid_appointments_create_personal_v800($pdo,$canonical);
                if(!$paid)throw new RuntimeException('Paid appointment state could not be created.');
                $paymentUrl=agent_paid_appointments_payment_url_v800($pdo,$paid);
                if($paymentUrl==='')throw new RuntimeException('Secure appointment payment link could not be created.');
            }catch(Throwable $commercialError){
                try{agent_scheduling_cancel_booking_v430($pdo,(int)$booking['id'],(int)$user['id']);}catch(Throwable $ignored){}
                if($paid){try{agent_paid_appointments_record_cancellation_v800($pdo,$paid,'system',(int)$user['id'],$agentId?:null,'agent_commercial_booking_rollback');}catch(Throwable $ignored){}}
                throw $commercialError;
            }
            $result['answer']='Time held pending payment. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is reserved for '.agent_scheduling_tools_slot_label_v460((string)$booking['start_at_utc'],(string)$booking['organizer_timezone']).'. The appointment is not confirmed until the payment provider verifies payment.';
            $result['actions'][]=['type'=>'open_url','label'=>'Open secure payment','url'=>$paymentUrl];
            agent_tool_log($user,'scheduling.book',(string)$pending['request_text'],'success',['booking_id'=>(int)$booking['id'],'event_type_id'=>(int)$booking['event_type_id'],'start_at_utc'=>(string)$booking['start_at_utc'],'agent_id'=>$agentId,'payment_status'=>'awaiting_payment','paid_booking_id'=>(int)$paid['id']],$conversationId);
            return $result;
        }
        $result['answer']='Booked. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is set for '.agent_scheduling_tools_slot_label_v460((string)$booking['start_at_utc'],(string)$booking['organizer_timezone']).'.';
        $result['actions'][]=['type'=>'open_url','label'=>'Open Scheduling','url'=>url('/scheduling.php?open='.(int)$booking['id'].'#bookings')];
        agent_tool_log($user,'scheduling.book',(string)$pending['request_text'],'success',['booking_id'=>(int)$booking['id'],'event_type_id'=>(int)$booking['event_type_id'],'start_at_utc'=>(string)$booking['start_at_utc'],'agent_id'=>$agentId],$conversationId);
        return $result;
    }
"""
          text=text[:create_start]+create_block+text[create_end:]
          old="        if(!agent_scheduling_cancel_booking_v430($pdo,$bookingId,(int)$user['id']))throw new RuntimeException('That appointment could not be cancelled.');\n        $result['answer']='Cancelled. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is no longer on your schedule.';"
          new="        $paid=(function_exists('agent_paid_appointments_schema_ready_v800')&&agent_paid_appointments_schema_ready_v800($pdo))?agent_paid_appointments_paid_booking_for_booking_v800($pdo,$bookingId):null;\n        if(function_exists('agent_appointment_lifecycle_schema_ready_v700')&&agent_appointment_lifecycle_schema_ready_v700($pdo)){$life=agent_appointment_lifecycle_booking_v700($pdo,$bookingId,(int)$user['id']);if(!$life)throw new RuntimeException('That appointment is no longer available.');agent_appointment_lifecycle_transition_v700($pdo,$life,'cancelled','agent',(int)$user['id'],$agentId?:null,['source'=>'agent_chat_v460']);}elseif(!agent_scheduling_cancel_booking_v430($pdo,$bookingId,(int)$user['id']))throw new RuntimeException('That appointment could not be cancelled.');\n        if($paid)agent_paid_appointments_record_cancellation_v800($pdo,$paid,'agent',(int)$user['id'],$agentId?:null,'agent_chat_cancelled');\n        $result['answer']='Cancelled. '.(string)$booking['event_title'].' with '.(string)$booking['guest_name'].' is no longer on your schedule.';"
          if old in text: text=text.replace(old,new,1)
          p.write_text(text)

          # 6) Update compatibility contracts for in-place Phase 7 semantics.
          p=Path('tests/agent-scheduling-tools-v460-contract.mjs')
          text=p.read_text()
          text=text.replace("assert.match(tools, /owner_user_id=\\? AND schedule_id=\\? AND status IN \\('pending','confirmed'\\)/, 'reschedule mutations must remain owner and schedule scoped');","assert.match(tools, /SELECT \\* FROM agent_scheduling_bookings WHERE id=\\? AND owner_user_id=\\? AND schedule_id=\\? LIMIT 1/, 'approved reschedule execution must re-read an owner- and schedule-scoped canonical booking');",1)
          old="""assert.match(tools, /SELECT GET_LOCK\\(\\?,5\\)/, 'rescheduling must serialize its cancel/create transaction');
assert.match(tools, /if\\(\\$started\\)\\$pdo->beginTransaction\\(\\)/, 'rescheduling must be atomic');
assert.match(tools, /if\\(\\$started&&\\$pdo->inTransaction\\(\\)\\)\\$pdo->rollBack\\(\\)/, 'failed reschedules must roll back');
assert.match(tools, /rescheduled_from_id=\\?/, 'rescheduling must preserve booking lineage');
assert.match(tools, /SELECT RELEASE_LOCK\\(\\?\\)/, 'reschedule schedule lock must be released');"""
          new="""assert.match(tools, /agent_appointment_lifecycle_reschedule_v700/, 'approved Agent rescheduling must delegate to the canonical in-place lifecycle path');
const rescheduleStart=tools.indexOf('function agent_scheduling_tools_reschedule_owner_v460');
const rescheduleEnd=tools.indexOf('function agent_scheduling_tools_execute_pending_v460',rescheduleStart);
const reschedule=rescheduleStart>=0&&rescheduleEnd>rescheduleStart?tools.slice(rescheduleStart,rescheduleEnd):'';
assert.ok(reschedule,'Agent reschedule helper must exist');
assert.doesNotMatch(reschedule,/agent_scheduling_create_booking_v430/,'Agent rescheduling must not create a replacement booking');
assert.match(reschedule,/agent_paid_appointments_paid_booking_for_booking_v800/,'Agent rescheduling must inspect commercial lineage when Phase 8 is installed');
assert.match(reschedule,/Complete or cancel the pending appointment payment before rescheduling/,'Agent rescheduling must not confirm an unpaid commercial hold');
assert.match(reschedule,/agent_paid_appointments_record_reschedule_v800/,'Paid Agent reschedules must audit retained payment lineage');"""
          if old in text: text=text.replace(old,new,1)
          p.write_text(text)

          p=Path('tests/agent-appointment-lifecycle-v700-contract.mjs')
          text=p.read_text()
          text=text.replace("assert.match(publicPage,/agent_scheduling_cancel_booking_v430[\\s\\S]*throw \\$captureError/,'A failed intake persistence step must roll back the canonical booking');","assert.match(publicPage,/agent_appointment_lifecycle_capture_intake_v700[\\s\\S]*agent_scheduling_cancel_booking_v430[\\s\\S]*throw \\$commercialError/,'A failed intake or commercial persistence step must roll back the canonical booking');",1)
          p.write_text(text)

          p=Path('tests/agent-paid-appointments-v800-contract.mjs')
          text=p.read_text()
          text=text.replace("assert.match(core,/PRIMARY KEY\\s*\\(workspace_owner_user_id\\)/,'A Team must have only one primary appointment provider selection');","assert.match(core,/workspace_owner_user_id INT UNSIGNED NOT NULL PRIMARY KEY/,'A Team must have only one primary appointment provider selection');",1)
          needle="assert.match(core,/function agent_paid_appointments_decimal_to_minor_v800/,'Member-entered money must be parsed without floating-point arithmetic');"
          if needle in text and 'exactly one canonical money parser' not in text:
              text=text.replace(needle,needle+"\nassert.equal((core.match(/function agent_paid_appointments_decimal_to_minor_v800/g)||[]).length,1,'Phase 8 must load exactly one canonical money parser');\nassert.doesNotMatch(core,/round\\(\\(\\(float\\)/,'Provider payment amounts must not use binary floating-point conversion');",1)
          needle="assert.match(core,/main_location_id/,'Square connection must resolve the merchant payment location instead of treating merchant_id as location_id');"
          if needle in text and 'Square sandbox must fail clearly' not in text:
              text=text.replace(needle,needle+"\nassert.match(core,/Square sandbox does not support application fees for hosted appointment checkout/,'Square sandbox must fail clearly instead of silently dropping a configured platform fee');\nassert.match(core,/Square location does not support the appointment currency/,'Square checkout must reject a seller-location currency mismatch before provider mutation');",1)
          needle="assert.match(legacyReschedule,/agent_paid_appointments_record_reschedule_v800/,'Paid Agent Chat reschedule must audit retained commercial lineage');"
          if needle in text and 'Agent-created paid appointments must require' not in text:
              text=text.replace(needle,needle+"\nassert.match(legacyTools,/Paid appointments need the guest email before I can hold the time and create a secure payment link/,'Agent-created paid appointments must require an addressable payer');\nassert.match(legacyTools,/Time held pending payment/,'Agent-created paid appointments must be described as held, not confirmed');\nassert.match(legacyTools,/agent_paid_appointments_create_personal_v800/,'Agent-created paid appointments must create canonical commercial state');\nassert.match(legacyTools,/agent_paid_appointments_payment_url_v800/,'Agent-created paid appointments must return a secure payment path');",1)
          p.write_text(text)

          # 7) Dedicated Phase 8 workflow must load all runtime parts together.
          p=Path('.github/workflows/agent-paid-appointments-v800.yml')
          text=p.read_text()
          needle='          for f in includes/agent-paid-appointments-v800-part*.php; do php -l "$f"; done\n'
          addition=needle+"          php -r \"require 'includes/agent-paid-appointments-v800-part1.php'; require 'includes/agent-paid-appointments-v800-part2.php'; require 'includes/agent-paid-appointments-v800-part3.php'; require 'includes/agent-paid-appointments-v800-part4.php'; require 'includes/agent-paid-appointments-v800-part5.php'; echo 'PHASE8_PARTS_LOAD=PASS'.PHP_EOL;\"\n"
          if needle in text and 'PHASE8_PARTS_LOAD=PASS' not in text: text=text.replace(needle,addition,1)
          p.write_text(text)
          PY
          python3 /tmp/phase8_patch.py
      - name: Validate focused contracts and PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/agent-paid-appointments-v800-part3.php
          php -l includes/agent-paid-appointments-v800-part4.php
          php -l includes/agent-appointment-lifecycle-v700-part4.php
          php -l public-booking-controller-v700.php
          php -l includes/agent-scheduling-tools-v460.php
          php -r "require 'includes/agent-paid-appointments-v800-part1.php'; require 'includes/agent-paid-appointments-v800-part2.php'; require 'includes/agent-paid-appointments-v800-part3.php'; require 'includes/agent-paid-appointments-v800-part4.php'; require 'includes/agent-paid-appointments-v800-part5.php'; echo 'PHASE8_PARTS_LOAD=PASS'.PHP_EOL;"
          node tests/agent-scheduling-tools-v460-contract.mjs
          node tests/agent-appointment-lifecycle-v700-contract.mjs
          node tests/agent-paid-appointments-v800-contract.mjs
      - name: Commit validated fixes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase8-finalize-once.yml
          git add includes/agent-paid-appointments-v800-part3.php includes/agent-paid-appointments-v800-part4.php includes/agent-appointment-lifecycle-v700-part4.php public-booking-controller-v700.php includes/agent-scheduling-tools-v460.php tests/agent-scheduling-tools-v460-contract.mjs tests/agent-appointment-lifecycle-v700-contract.mjs tests/agent-paid-appointments-v800-contract.mjs .github/workflows/agent-paid-appointments-v800.yml
          git commit -m "Phase 8: complete payment runtime and compatibility hardening"
          git push origin HEAD:feature-paid-appointments-phase-8
