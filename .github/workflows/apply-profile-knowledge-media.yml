name: Apply Profile Knowledge Media
on:
  push:
    branches:
      - feature/profile-knowledge-media-20260905
    paths:
      - tools/apply-profile-knowledge-media.py
      - .github/workflows/apply-profile-knowledge-media.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-knowledge-media-20260905
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/apply-profile-knowledge-media.py
      - name: Focused validation
        run: |
          php -l api/profile-agent.php
          php -l includes/profile-agent-runtime.php
          php -l profile.php
          php -l profile-agent.php
          node tests/profile-knowledge-media-contract.mjs
      - name: Commit application changes
        run: |
          git config user.name "davemt74-lang"
          git config user.email "davemt74@gmail.com"
          git add api/profile-agent.php includes/profile-agent-runtime.php profile.php profile.css profile-agent-portal.js profile-agent-portal.css profile-agent.php tests/profile-knowledge-media-contract.mjs tools/run_recovery_baseline.py
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Add Profile knowledge and media controls"
            git push origin HEAD:feature/profile-knowledge-media-20260905
          fi
