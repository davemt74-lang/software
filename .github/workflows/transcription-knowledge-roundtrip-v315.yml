name: Transcription Knowledge Round Trip v3.15

on:
  pull_request:
    paths:
      - 'api/transcription-knowledge-save-v314.php'
      - 'transcription-knowledge-folders-v313.js'
      - 'artist-listening-naming.js'
      - 'knowledge.php'
      - 'includes/knowledge.php'
      - 'includes/artist-listening.php'
      - 'tests/transcription-folder-observer-hotfix-contract.mjs'
      - 'tests/transcription-knowledge-save-v314-contract.mjs'
      - 'tests/transcription-knowledge-roundtrip-v315-contract.mjs'
      - '.github/workflows/transcription-knowledge-roundtrip-v315.yml'
  push:
    branches: [main]
    paths:
      - 'api/transcription-knowledge-save-v314.php'
      - 'transcription-knowledge-folders-v313.js'
      - 'artist-listening-naming.js'
      - 'knowledge.php'
      - 'includes/knowledge.php'
      - 'includes/artist-listening.php'
      - 'tests/transcription-folder-observer-hotfix-contract.mjs'
      - 'tests/transcription-knowledge-save-v314-contract.mjs'
      - 'tests/transcription-knowledge-roundtrip-v315-contract.mjs'
      - '.github/workflows/transcription-knowledge-roundtrip-v315.yml'

jobs:
  transcription-knowledge-roundtrip:
    name: transcription knowledge round trip (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: php -l api/transcription-knowledge-save-v314.php
      - name: JavaScript syntax
        run: |
          node --check transcription-knowledge-folders-v313.js
          node --check artist-listening-naming.js
          node --check tests/transcription-folder-observer-hotfix-contract.mjs
      - name: Retained folder observer regression
        run: node tests/transcription-folder-observer-hotfix-contract.mjs
      - name: Save regression contract
        run: node tests/transcription-knowledge-save-v314-contract.mjs
      - name: Round-trip hardening contract
        run: node tests/transcription-knowledge-roundtrip-v315-contract.mjs
