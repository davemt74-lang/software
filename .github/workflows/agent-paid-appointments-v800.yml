name: Agent Paid Appointments v8.00

on:
  push:
    branches: [feature-paid-appointments-phase-8]

permissions:
  contents: write

jobs:
  apply-commerce-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: feature-paid-appointments-phase-8
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct verified Commerce source
        shell: bash
        run: |
          set -euo pipefail
          files=(.phase8/chunk-01.b64 .phase8/chunk-02.b64 .phase8/chunk-03.b64 .phase8/chunk-05.b64 .phase8/chunk-04.b64 .phase8/chunk-06-exact.b64 .phase8/chunk-07.b64)
          cat "${files[@]}" > /tmp/phase8-commerce.b64
          base64 -d /tmp/phase8-commerce.b64 > /tmp/phase8-commerce.tar.gz
          echo 'fcae2818c7ba62a9d642da5a15e6db8a3801cd1ef0b6981507d69ddbb5ffe07f  /tmp/phase8-commerce.tar.gz' | sha256sum -c -
          tar -xzf /tmp/phase8-commerce.tar.gz -C .
          rm -f includes/agent-paid-appointments-v800-part3.php includes/agent-paid-appointments-v800-part4.php includes/agent-paid-appointments-v800-part5.php
      - name: Validate Commerce and scheduling compatibility
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do php -l "$f" >/dev/null; done < <(tar -tzf /tmp/phase8-commerce.tar.gz | grep '\.php$')
          node tests/agent-commerce-v800-contract.mjs
          node tests/agent-paid-appointments-v800-contract.mjs
          node tests/agent-scheduling-tools-v460-contract.mjs
          node tests/agent-appointment-lifecycle-v700-contract.mjs
          php -r "require 'includes/agent-commerce-v800.php'; require 'includes/agent-paid-appointments-v800.php'; echo 'COMMERCE_RUNTIME_LOAD=PASS'.PHP_EOL;"
      - name: Commit validated Commerce source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase8
          rm -f .github/workflows/agent-commerce-v800.yml .github/workflows/phase8-commerce-apply-once.yml .github/workflows/phase8-finalize-once.yml
          git checkout HEAD -- .github/workflows/agent-paid-appointments-v800.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 8: generalize Commerce with appointment fulfillment'
          git push origin HEAD:feature-paid-appointments-phase-8
