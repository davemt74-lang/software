name: Browser Companion Phase 6+7 · Source Feed + Research v20.60

on:
  push:
    branches:
      - main
      - phase6-browser-companion-this-page-following-v2050
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Source + Research contract · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser Companion regressions
        run: |
          node tests/extension-device-auth-v2000.mjs
          node tests/extension-device-auth-v2001.mjs
          node tests/browser-share-v2010.mjs
          node tests/browser-share-v2011.mjs
          node tests/browser-share-chat-feed-v2020.mjs
          node tests/browser-companion-v2030.mjs
          node tests/browser-companion-rich-capture-v2040.mjs
      - name: Phase 6 source/feed regression
        run: node tests/browser-companion-source-feed-v2050.mjs
      - name: Phase 7 Research Projects + Publishing contract
        run: node tests/research-projects-publishing-v2060.mjs
      - name: JavaScript syntax
        run: |
          node --check browser-companion/background.js
          node --check browser-companion/sidepanel.js
          node --check tests/browser-companion-source-feed-v2050.mjs
          node --check tests/research-projects-publishing-v2060.mjs
      - name: PHP syntax
        run: |
          php -l includes/browser-source-feed-v2050.php
          php -l api/browser-source-feed-v2050.php
          php -l includes/browser-share-chat-feed-v2020.php
          php -l includes/browser-share-media-v2040.php
          php -l api/browser-share-media-v2040.php
          php -l source.php
          php -l annotation.php
          php -l includes/research-projects-v2060.php
          php -l api/research-projects-v2060.php
          php -l research.php
          php -l research-project.php
          php -l research-report-builder.php
          php -l research-report.php
          php -l upgrade.php

  package:
    name: Package Browser Companion v20.60
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build directly loadable extension ZIP
        run: |
          mkdir -p dist
          cd browser-companion
          zip -r ../dist/vp3-browser-companion-v20.60.0.zip . -x '*.DS_Store'
          cd ..
          unzip -t dist/vp3-browser-companion-v20.60.0.zip
          unzip -Z1 dist/vp3-browser-companion-v20.60.0.zip | grep -qx 'manifest.json'
          if unzip -Z1 dist/vp3-browser-companion-v20.60.0.zip | grep -q '^browser-companion/'; then
            echo 'Extension ZIP contains an unexpected wrapper folder.' >&2
            exit 1
          fi
          sha256sum dist/vp3-browser-companion-v20.60.0.zip > dist/vp3-browser-companion-v20.60.0.zip.sha256
          zip -r dist/vp3-phase7-research-deploy.zip \
            api/browser-source-feed-v2050.php \
            api/browser-share-media-v2040.php \
            includes/browser-source-feed-v2050.php \
            includes/browser-share-chat-feed-v2020.php \
            includes/browser-share-media-v2040.php \
            includes/bootstrap.php \
            browser-companion \
            source.php annotation.php \
            includes/research-projects-v2060.php \
            api/research-projects-v2060.php \
            research.php research-project.php research-report-builder.php research-report.php \
            upgrade.php
          unzip -t dist/vp3-phase7-research-deploy.zip
          sha256sum dist/vp3-phase7-research-deploy.zip > dist/vp3-phase7-research-deploy.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vp3-browser-companion-v20.60.0
          path: |
            dist/vp3-browser-companion-v20.60.0.zip
            dist/vp3-browser-companion-v20.60.0.zip.sha256
            dist/vp3-phase7-research-deploy.zip
            dist/vp3-phase7-research-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30
