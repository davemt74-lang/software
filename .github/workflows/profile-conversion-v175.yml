name: Profile Conversion v1.75

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: php -l profile.php
      - name: Contract syntax
        run: node --check tests/profile-conversion-v175-contract.mjs
      - name: Profile conversion contract
        run: node tests/profile-conversion-v175-contract.mjs
