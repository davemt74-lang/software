name: Apply Profile Agent widget and portal UX

on:
  push:
    branches:
      - feature/profile-agent-widget-portal-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Profile Agent UX patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-agent-widget-portal-20260905
          fetch-depth: 0

      - name: Apply focused UX patch
        run: python3 tools/apply_profile_agent_widget_portal.py

      - name: Focused contract
        run: |
          php -l profile.php
          php -l profile-agent.php
          node tests/profile-agent-attention-contract.mjs

      - name: Commit focused patch and remove temporary patch tooling
        run: |
          git config user.name "davemt74-lang"
          git config user.email "davemt74@gmail.com"
          git rm .github/workflows/apply-profile-agent-widget-portal.yml
          git rm tools/apply_profile_agent_widget_portal.py
          git add profile.php profile.css profile-agent.php profile-agent-portal.css profile-agent-portal.js tests/profile-agent-attention-contract.mjs
          git commit -m "Refine Profile Agent public widget and service portal"
          git push origin HEAD:feature/profile-agent-widget-portal-20260905
