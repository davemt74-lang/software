name: Browser Companion Agent Execution v21.80

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - browser-companion-agent-execution-v2180

permissions:
  contents: read

jobs:
  contract:
    name: Agent Execution · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: v21.80 Browser Execution contract
        run: node tests/browser-companion-agent-execution-v2180.mjs

      - name: Retained Browser Companion contracts
        run: |
          node tests/extension-device-token-v2100.mjs
          node tests/browser-companion-v2030.mjs
          node tests/browser-companion-account-shell-v2110.mjs
          node tests/browser-companion-cognitive-now-v2120.mjs
          node tests/browser-cognitive-review-hardening-v2120.mjs
          node tests/browser-companion-contextual-agent-v2130.mjs
          node tests/browser-companion-proactive-notifications-v2140.mjs
          node tests/browser-companion-contextual-quick-actions-v2150.mjs
          node tests/browser-companion-agent-workspace-v2160.mjs
          node tests/browser-companion-cross-web-memory-v2170.mjs

      - name: Retained Cognitive Runtime contracts
        run: |
          node tests/vp3-cognitive-runtime-spec-v500.mjs
          node tests/cognitive-runtime-core-v500.mjs
          node tests/cognitive-presentation-v510.mjs
          node tests/cognitive-cards-v520.mjs
          node tests/cognitive-feed-v530.mjs
          node tests/cognitive-learning-v540.mjs
          node tests/cognitive-planning-v550.mjs
          node tests/cognitive-orchestration-v560.mjs
          node tests/cognitive-memory-v570.mjs

      - name: JavaScript syntax
        run: |
          node --check browser-companion/background.js
          node --check browser-companion/sidepanel.js
          node --check tests/browser-companion-agent-execution-v2180.mjs

      - name: PHP syntax
        run: |
          php -l includes/browser-execution-v2180.php
          php -l api/extension-execution-v2180.php
          php -l upgrade.php

  package:
    name: Build v21.80 deploy packages
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build cumulative extension and server overlay
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/server/api dist/server/includes dist/server/browser-companion
          (
            cd browser-companion
            zip -r ../dist/vp3-browser-companion-extension-v21.80.zip . -x '*.DS_Store'
          )
          unzip -t dist/vp3-browser-companion-extension-v21.80.zip

          cp api/extension-token.php api/extension-me.php api/extension-device-disconnect-v2030.php api/extension-cognitive-now-v2120.php api/extension-notifications-v2140.php api/extension-agent-voice-v2140.php api/extension-agent-chat-v2160.php api/extension-memory-v2170.php api/extension-execution-v2180.php dist/server/api/
          cp api/cognitive-*.php api/chat-v236.php api/chat-notifications-brain-v240.php dist/server/api/

          cp includes/extension-device-auth-v2000.php includes/extension-device-auth-v2001.php includes/extension-device-token-v2100.php includes/extension-notifications-v2140.php includes/agent-chat-runtime-v2160.php includes/browser-memory-v2170.php includes/browser-execution-v2180.php dist/server/includes/
          cp includes/browser-context-v2130.php includes/agent-surface-context-v131.php includes/browser-share-v2010.php includes/browser-source-feed-v2050.php includes/research-projects-v2060.php includes/knowledge.php includes/knowledge-retrieval-v162.php includes/user-calendar-v1300.php includes/crm-v180.php dist/server/includes/
          cp includes/cognitive-*.php includes/agent-cognitive-loop-v310.php includes/bootstrap.php dist/server/includes/

          cp extension-connect.php upgrade.php chat.php chat.js chat-browser-context-v2130.js chat-browser-context-v2130.css chat-notifications-drawer-v240.js chat-notifications-drawer-v240.css dist/server/
          cp chat-cognitive-*.js chat-cognitive-*.css dist/server/
          cp -R browser-companion/. dist/server/browser-companion/

          cat > dist/server/DEPLOY.txt <<'EOF'
          VP3 Browser Companion v21.80 — Agent Execution & Follow-Through
          Cumulative overlay through v21.80.

          Extract into the VP3 application root and overwrite included files.
          Sign in as owner/admin and run upgrade.php once.

          v21.80 adds browser_execution_tickets_v2180 and
          browser_execution_events_v2180. The execution ledger stores only VP3
          object references plus action/lifecycle/verification metadata. It does
          not store browser history, page URLs, titles, selected text, page
          content, summaries, excerpts, or Agent prompts.

          Browser actions follow Propose -> Confirm -> Execute -> Verify.
          Current page relationships and permissions are re-derived server-side
          before proposal and again before execution. Reversible Source follow
          actions execute through the canonical Source Feed service. Task,
          Knowledge and Team-share writes remain explicit downstream handoffs.
          EOF

          (
            cd dist/server
            zip -r ../vp3-browser-companion-server-v21.80.zip .
          )
          unzip -t dist/vp3-browser-companion-server-v21.80.zip

          sha256sum dist/vp3-browser-companion-extension-v21.80.zip > dist/vp3-browser-companion-extension-v21.80.zip.sha256
          sha256sum dist/vp3-browser-companion-server-v21.80.zip > dist/vp3-browser-companion-server-v21.80.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: vp3-browser-companion-agent-execution-v21.80
          path: |
            dist/vp3-browser-companion-extension-v21.80.zip
            dist/vp3-browser-companion-extension-v21.80.zip.sha256
            dist/vp3-browser-companion-server-v21.80.zip
            dist/vp3-browser-companion-server-v21.80.zip.sha256
          if-no-files-found: error
          retention-days: 30
