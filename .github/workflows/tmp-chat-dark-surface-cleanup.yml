name: Temporary Chat Dark Surface Cleanup

on:
  push:
    branches:
      - fix/chat-remove-brown-theme

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[chat-dark-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-remove-brown-theme
          fetch-depth: 0
      - name: Replace remaining dark UI surfaces at source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('chat.css')
          css=p.read_text()

          # Explicit source-level replacements for recovered dark surfaces.
          # Intentionally leave modal/backdrop dimmers and black primary action
          # buttons alone; only page/card/player/form surfaces become light.
          surface_map={
            '#090807':'#ffffff','#0a0908':'#ffffff','#0b0a08':'#ffffff',
            '#0c0a08':'#ffffff','#0d0b09':'#ffffff','#0d0b0a':'#ffffff',
            '#0d0c0a':'#ffffff','#0e0c0a':'#ffffff','#0f0d0b':'#ffffff',
            '#100d0a':'#ffffff','#13100d':'#ffffff','#14110e':'#ffffff',
            '#161310':'#ffffff','#17120e':'#ffffff','#18130f':'#ffffff',
            '#181511':'#ffffff','#181512':'#ffffff','#1a1612':'#f9fafb',
            '#1b1713':'#f9fafb','#1b1714':'#f9fafb','#1c1712':'#f9fafb',
            '#21170f':'#f9fafb','#211c17':'#f9fafb','#211d19':'#f9fafb',
            '#241d17':'#f9fafb','#24201c':'#f9fafb','#26221e':'#f9fafb',
            '#27231f':'#f9fafb','#28231f':'#f9fafb','#29241f':'#f9fafb',
            '#292520':'#f9fafb','#292521':'#f9fafb','#2a2118':'#f9fafb',
            '#2a2521':'#f9fafb','#2a2622':'#f9fafb','#2b2621':'#f9fafb',
            '#2b2722':'#f9fafb','#2c231a':'#f9fafb','#2c2722':'#f9fafb',
            '#2d2823':'#f9fafb','#30251c':'#f9fafb','#302a25':'#f9fafb',
            '#302b26':'#f9fafb','#312b25':'#f9fafb','#332d27':'#f9fafb',
            '#332e29':'#f9fafb','#342e28':'#f9fafb','#352f29':'#f9fafb',
            '#37302a':'#f9fafb','#37312b':'#f9fafb','#38312a':'#f9fafb',
            '#393129':'#f9fafb','#39322b':'#f9fafb','#3a322a':'#f9fafb',
            '#3a332c':'#f9fafb','#3a342e':'#f9fafb','#3b342e':'#f9fafb',
            '#40352d':'#f9fafb','#403832':'#f9fafb','#42372e':'#f9fafb',
            '#483b30':'#f9fafb','#4a4036':'#f9fafb','#4d4135':'#f9fafb',
          }

          # Only replace dark literals when used inside background declarations.
          bg_re=re.compile(r'(?P<prop>background(?:-color)?\s*:\s*)(?P<value>[^;}]+)',re.I)
          overlay_selector_words=('backdrop','overlay')
          rule_re=re.compile(r'(?P<selector>[^{}]+)\{(?P<body>[^{}]*)\}')

          def rule_x(m):
            selector=m.group('selector')
            body=m.group('body')
            sl=selector.lower()
            is_dimmer=any(word in sl for word in overlay_selector_words)
            def bg_x(bm):
              value=bm.group('value')
              if not is_dimmer:
                for old,new in surface_map.items():
                  value=value.replace(old,new)
                # Recovered near-black RGBA surfaces become opaque/light. Keep
                # dark transparent dimmers only on overlay/backdrop selectors.
                value=re.sub(r'rgba\((?:4|8|10|12|13|18|20|25)\s*,\s*(?:4|7|9|10|11|12|16|17|21|24)\s*,\s*(?:3|6|8|9|10|13|14|17|20)\s*,\s*[.0-9]+\)', '#ffffff', value)
              return bm.group('prop')+value
            body=bg_re.sub(bg_x,body)
            return selector+'{'+body+'}'

          for _ in range(2):
            css=rule_re.sub(rule_x,css)

          # Explicit multi-line gradients and known source owners.
          css=css.replace('''background:linear-gradient(\n      180deg,\n      #ffffff,\n      #0d0c0a\n    );''','background:#ffffff;')
          css=css.replace('''background:linear-gradient(\n      180deg,\n      #ffffff,\n      rgba(13,12,10,.99)\n    );''','background:#ffffff;')
          css=css.replace('''background:linear-gradient(\n      180deg,\n      rgba(8,7,6,.12),\n      rgba(8,7,6,.98) 18%\n    );''','background:linear-gradient(180deg,rgba(255,255,255,.72),#ffffff 18%);')
          css=css.replace('/* Stonefellow v70 — custom dark audio + persistent Now Playing */','/* Stonefellow v70 — custom audio + persistent Now Playing */')
          css=css.replace('/* Shared dark range treatment. */','/* Shared range treatment. */')

          # Light surfaces need dark copy. Normalize recovered cream text
          # literals globally, while preserving white on the explicit black
          # primary/send/player buttons by restoring those rules afterward.
          light_text_map={
            '#fff0dd':'#111827','#f3e6d5':'#111827','#f2e8de':'#111827',
            '#f0dcc5':'#111827','#eee5dc':'#111827','#eee2d5':'#111827',
            '#ece3da':'#111827','#eadfd4':'#111827','#eadbcb':'#111827',
            '#ead9c6':'#111827','#ead9c5':'#111827','#e8ddd1':'#111827',
            '#e7dbcf':'#111827','#e6d8ca':'#111827','#e5d0b6':'#111827',
            '#e4d7c9':'#111827','#e3dad0':'#111827','#e3d8ce':'#111827',
            '#e3d8cd':'#111827','#e2d8ce':'#111827','#e1d8ce':'#111827',
            '#e1c5a3':'#111827','#e0d8cf':'#111827','#e0d7cd':'#111827',
            '#e0d6cb':'#111827','#e0d4c6':'#111827','#ded6cd':'#111827',
            '#ded5cc':'#111827','#ded5cb':'#111827','#ded4ca':'#111827',
            '#ded4c9':'#111827','#ddd4cb':'#111827','#ddd3c8':'#111827',
            '#dbd1c7':'#111827','#d8cec4':'#111827','#d7cec5':'#111827',
            '#d7cec4':'#111827','#d5ccc2':'#111827','#d5cbc1':'#111827',
            '#d4cbc2':'#111827','#d4cac0':'#111827','#d2c9c0':'#111827',
            '#d2c8be':'#111827','#d1c7bd':'#111827','#d1c5b9':'#111827',
            '#d0c6bc':'#111827','#cfc6bc':'#111827','#cfc5bb':'#111827',
            '#cfc3b7':'#111827','#cdc3b8':'#111827','#cbc2b8':'#111827',
            '#c9c0b7':'#111827','#b9aea3':'#374151','#bcae9f':'#374151',
            '#ada39a':'#374151','#a79e95':'#374151','#a79d93':'#374151',
            '#a59b92':'#374151','#aaa097':'#374151','#999':'#6b7280',
            '#eee':'#111827','#ddd':'#374151'
          }
          color_re=re.compile(r'(?P<prop>color\s*:\s*)(?P<value>#[0-9a-fA-F]{3,8})',re.I)
          css=color_re.sub(lambda m:m.group('prop')+light_text_map.get(m.group('value').lower(),m.group('value')),css)

          # Restore intentional white text on canonical dark primary controls.
          css=re.sub(r'(\.chat-composer button\{[^{}]*?background:var\(--accent\);)color:#[0-9a-fA-F]+',r'\1color:#ffffff',css)
          css=re.sub(r'(\.chat-player-toggle\{[^{}]*?background:#111827 !important;)\s*color:#[0-9a-fA-F]+ !important',r'\1\n  color:#ffffff !important',css)
          css=re.sub(r'(\.chat-now-playing-transport button\.primary\{[^{}]*?background:#111827;)\s*color:#[0-9a-fA-F]+',r'\1\n  color:#ffffff',css)

          # A few sources use black as semantic primary. Keep those; reject any
          # other near-black page/card/form background in chat.css.
          p.write_text(css)

          # Clean the temporary parser-anchor while we are here.
          test=Path('tests/chat-light-source-contract.mjs')
          t=test.read_text().replace("assert.equal(/#[0-9a-f]{6}/i.test(''), false); // parser anchor\n",'')
          t=t.replace('// legacy warm Chat palette audit is enforced by the source-migration workflow and representative token bans above.\n','')
          test.write_text(t)

          # Temporary workflow self-removal.
          Path('.github/workflows/tmp-chat-dark-surface-cleanup.yml').unlink()
          print('CHAT_DARK_SURFACE_CLEAN=PASS')
          PY
      - name: Focused contracts and lint
        run: |
          node tests/chat-light-source-contract.mjs
          php -l chat.php
          php -l chat-legacy-v108.php
      - name: Commit dark-surface cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove remaining dark Chat surfaces [chat-dark-clean]"
          git push origin HEAD:fix/chat-remove-brown-theme
