name: Agent Workflow Runs v14.00

on:
  push:
    branches:
      - main
      - phase-14-agent-workflow-runs
  pull_request:

permissions:
  contents: read

jobs:
  workflow-runs:
    name: Agent workflows · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint Agent Workflow PHP
        run: |
          php -l includes/agent-workflow-runs-v1400.php
          php -l api/agent-workflow-runs-v1400.php
          php -l agent-workflows.php
          php -l agent-workflow-upgrade-v1400.php
          php -l calendar.php
          php -l includes/bootstrap.php

      - name: Verify Agent Workflow contract
        run: |
          node tests/agent-workflow-runs-v1400-contract.mjs
          php tests/agent-workflow-runs-v1400-test.php
