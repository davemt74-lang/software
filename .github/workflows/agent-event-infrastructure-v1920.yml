name: Webhook + Event Infrastructure v19.2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Event infrastructure · PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-file: production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP syntax
        run: |
          php -l includes/agent-event-infrastructure-v1920.php
          php -l includes/agent-event-routes-v1920.php
          php -l api/agent-webhook-v1920.php
          php -l api/agent-events-v1920.php
          php -l agent-event-infrastructure-upgrade-v1920.php
          php -l agent-events.php
          php -l tests/agent-event-infrastructure-v1920-test.php
      - name: JavaScript syntax
        run: node --check tests/agent-event-infrastructure-v1920-contract.mjs
      - name: Event infrastructure contract
        run: node tests/agent-event-infrastructure-v1920-contract.mjs
      - name: Event runtime safety
        run: php tests/agent-event-infrastructure-v1920-test.php
      - name: Preserve Phase 19.0 contract
        run: node tests/agent-job-engine-v1900-contract.mjs
      - name: Preserve Phase 19.1 contract
        run: node tests/agent-worker-runtime-v1910-contract.mjs
