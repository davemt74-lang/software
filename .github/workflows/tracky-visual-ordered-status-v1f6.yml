name: Tracky Visual Ordered Status
on:
  pull_request:
    paths:
      - 'includes/tracky-cloud-v270.php'
      - 'includes/tracky-visual-status-order-v1f6.php'
      - 'includes/agent-visual-onboarding-v120.php'
      - 'tests/tracky-visual-order-mysql-v1f6.php'
      - '.github/workflows/tracky-visual-ordered-status-v1f6.yml'
  push:
    branches: [main]
    paths:
      - 'includes/tracky-cloud-v270.php'
      - 'includes/tracky-visual-status-order-v1f6.php'
      - 'includes/agent-visual-onboarding-v120.php'
      - 'tests/tracky-visual-order-mysql-v1f6.php'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ordered-status-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: trackyci
          MYSQL_DATABASE: tracky_visual_order_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptrackyci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring
          coverage: none
      - name: Validate PHP and contract
        run: |
          php -l includes/tracky-visual-status-order-v1f6.php
          php -l includes/tracky-cloud-v270.php
          php -l includes/agent-visual-onboarding-v120.php
          php tests/tracky-visual-ordered-status-v1f6.php
          node tests/tracky-visual-ordered-status-v1f6.mjs
      - name: Check transaction ordering on isolated MySQL 8
        env:
          TRACKY_ORDER_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=tracky_visual_order_ci;charset=utf8mb4
          TRACKY_ORDER_TEST_USER: root
          TRACKY_ORDER_TEST_PASS: trackyci
        run: php tests/tracky-visual-order-mysql-v1f6.php
