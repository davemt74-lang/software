name: Profile Agent Conversion v1.76

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/profile-agent-booking-context-v176.php
          php -l includes/profile-agent-transcription-context.php
      - name: JavaScript syntax
        run: |
          node --check profile-agent.js
          node --check tests/profile-agent-conversion-v176-contract.mjs
      - name: Profile Agent conversion contract
        run: node tests/profile-agent-conversion-v176-contract.mjs
