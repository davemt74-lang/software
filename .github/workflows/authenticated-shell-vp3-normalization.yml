name: Authenticated Shell VP3 Normalization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/header.php
          php -l includes/member-header.php
      - name: JavaScript syntax
        run: |
          node --check member-shell-v77.js
          node --check profile-social-v320.js
      - name: Authenticated shell normalization contract
        run: node tests/authenticated-shell-vp3-normalization-contract.mjs
      - name: Retained profile runtime resilience contract
        run: node tests/profile-runtime-resilience-contract.mjs
