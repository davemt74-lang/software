name: Section 14 Authority and Security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: section14-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  authority:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pa1-fixture
          MYSQL_DATABASE: profile_authority_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppa1-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current principal and authorization fallback regressions
        run: |
          php -l includes/permissions.php
          php -l includes/permissions-v105.php
          php -l includes/homeserver-local-execution-v230.php
          php tests/authority_section14.php
      - name: Retained authorization contracts
        run: |
          node tests/permission-architecture-v188.mjs
          node tests/agent-tool-authorization-v400.mjs
          php tests/agent-permissions-v035-contract.php
      - name: Public Profile Canvas attachment and visibility boundaries
        run: |
          php -l profile-canvas.php
          php -l includes/profile-canvases-v1.php
          php -l includes/coding-canvas-public-view-v1.php
          php -l api/profile-canvases-v1.php
          php tests/profile-canvases-v1.php
          node tests/profile-canvases-api-v1.mjs
          node tests/profile-canvases-owner-v1.mjs
          node tests/profile-canvases-browser-v1.mjs --render-only
      - name: Public Canvas governed Campaign Reward and Media sources
        run: |
          php -l includes/coding-canvas-commands-v1.php
          php -l includes/coding-canvas-public-sources-v1.php
          php -l includes/coding-canvas-public-marketing-v1.php
          php -l includes/coding-canvas-public-view-v1.php
          php -l includes/coding-canvas-publishing-v1.php
          php -l includes/coding-canvas-provider-v1.php
          node --check coding-canvas-runtime-v1.js
          node --check chat-coding-canvas-v1.js
          php tests/public-canvas-marketing-v1.php
          node tests/public-canvas-marketing-runtime-v1.mjs
      - name: Unified Marketing workspace owner data and current Chat contract
        run: |
          php -l includes/initiative-marketing-workspace-v1.php
          php -l api/initiative-workbench-v1.php
          php tests/marketing-workspace-v1.php
          node --check chat-marketing-workspace-v1.js
          node --check chat-media-commands-v1.js
          node --check chat.js
