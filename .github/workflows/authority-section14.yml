  profile_owner_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: bash tools/install-ci-chromium.sh
      - name: Public Profile Canvas gallery, full-page mobile display and shared chat
        run: node tests/profile-canvases-browser-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-canvases-browser-evidence
          path: artifacts/profile-canvases/
          if-no-files-found: ignore
      - name: Profile owner thread selection, drafts and refresh
        run: node tests/profile-owner-threads-pa1-browser.mjs
      - name: Profile checkout review, retry and accurate status
        run: node tests/profile-checkout-review-pa2-browser.mjs
      - name: Public Profile conversation checkout, confirmation, return and mobile
        run: node tests/profile-conversation-checkout-pa5-browser.mjs
      - name: Main Chat visitor card, exact visible acknowledgement and mobile replies
        run: node tests/profile-visitor-doorbell-pa3-browser.mjs
      - name: Native visitor admission, reload, dispatch and account changes
        run: node tests/profile-visitor-handoff-pa3-browser.mjs
      - name: Direct Profile calls, explicit media consent, teardown and mobile canvas
        run: node tests/profile-calls-pa3c-browser.mjs
      - name: Assisted Profile voice settings and activity drawer
