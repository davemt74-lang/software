name: Public Funnel + Onboarding Continuity

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Funnel PHP syntax
        run: |
          php -l includes/vp3-funnel.php
          php -l includes/vp3-public.php
          php -l signup.php
          php -l login.php
          php -l pricing.php
          php -l book-demo.php
          php -l api/public-funnel-event.php
          php -l tests/public-funnel-runtime.php
      - name: Runtime redirect and source contract
        run: php tests/public-funnel-runtime.php
      - name: Static contract syntax
        run: |
          node --check vp3-public-funnel.js
          node --check tests/public-funnel-onboarding-contract.mjs
          node --check tests/public-homepage-funnel-completion.mjs
      - name: Public funnel and onboarding contract
        run: node tests/public-funnel-onboarding-contract.mjs
      - name: Homepage and funnel completion contract
        run: node tests/public-homepage-funnel-completion.mjs
      - name: Retained public/auth contract
        run: node tests/vp3-public-auth-contract.mjs
      - name: Retained mega-menu pages contract
        run: node tests/public-mega-menu-pages-contract.mjs
      - name: Profile WebMCP PHP syntax
        run: |
          php -l includes/profile-webmcp-v100.php
          php -l includes/profile-webmcp-capability-resolver-v190.php
          php -l includes/profile-webmcp-tool-router-v191.php
          php -l includes/profile-webmcp-confirmation-v192.php
          php -l includes/agent-profile-webmcp-v193.php
          php -l includes/profile-webmcp-continuity-v194.php
          php -l includes/profile-webmcp-continuity-v195.php
          php -l includes/profile-webmcp-release-v196.php
          php -l includes/profile-webmcp-negotiation-v200.php
          php -l includes/profile-webmcp-health-v201.php
          php -l api/profile-webmcp-health-v201.php
          php -l api/profile-webmcp-continuity-v195.php
          php -l includes/profile-agent-public-service-v110.php
          php -l includes/profile-webmcp-external-v120.php
          php -l includes/profile-webmcp-analytics-v130.php
          php -l includes/profile-webmcp-chat-v140.php
          php -l includes/profile-webmcp-actions-v150.php
          php -l includes/profile-webmcp-scheduling-v150.php
          php -l includes/profile-webmcp-commerce-v160.php
          php -l includes/profile-webmcp-campaigns-v170.php
          php -l includes/profile-webmcp-rewards-v180.php
          php -l profile-webmcp-commerce-return-v160.php
          php -l api/profile-webmcp-v100.php
          php -l api/profile-webmcp-external-v120.php
          php -l profile.php
          php -l tests/profile-webmcp-v100.php
          php -l tests/profile-webmcp-capability-resolver-v190.php
          php -l tests/profile-webmcp-tool-router-v191.php
          php -l tests/profile-webmcp-confirmation-v192.php
          php -l tests/profile-webmcp-agent-brain-v193.php
          php -l tests/profile-webmcp-continuity-v194.php
          php -l tests/profile-webmcp-continuity-v195.php
          php -l tests/profile-webmcp-release-v196.php
          php -l tests/profile-webmcp-negotiation-v200.php
          php -l tests/profile-webmcp-health-v201.php
          php -l tests/profile-webmcp-agent-v110.php
          php -l tests/profile-webmcp-external-v120.php
          php -l tests/profile-webmcp-analytics-v130.php
          php -l tests/profile-webmcp-chat-v140.php
          php -l tests/profile-webmcp-scheduling-v150.php
          php -l tests/profile-webmcp-commerce-v160.php
          php -l tests/profile-webmcp-campaigns-v170.php
          php -l tests/profile-webmcp-campaigns-v171.php
          php -l tests/profile-webmcp-campaigns-v172.php
          php -l tests/profile-webmcp-rewards-v180.php
          php -l tests/profile-webmcp-rewards-v181.php
          php -l tests/profile-webmcp-rewards-v182.php
          php -l tests/profile-webmcp-rewards-v183.php
          php -l tests/profile-webmcp-rewards-v184.php
      - name: Profile WebMCP PHP security contract
        run: |
          php tests/profile-webmcp-v100.php
          php tests/profile-webmcp-capability-resolver-v190.php
          php tests/profile-webmcp-tool-router-v191.php
          php tests/profile-webmcp-confirmation-v192.php
          php tests/profile-webmcp-agent-brain-v193.php
          php tests/profile-webmcp-continuity-v194.php
          php tests/profile-webmcp-continuity-v195.php
          php tests/profile-webmcp-release-v196.php
          php tests/profile-webmcp-negotiation-v200.php
          php tests/profile-webmcp-health-v201.php
          php tests/profile-webmcp-agent-v110.php
          php tests/profile-webmcp-external-v120.php
          php tests/profile-webmcp-analytics-v130.php
          php tests/profile-webmcp-chat-v140.php
          php tests/profile-webmcp-scheduling-v150.php
          php tests/profile-webmcp-commerce-v160.php
          php tests/profile-webmcp-campaigns-v170.php
          php tests/profile-webmcp-campaigns-v171.php
          php tests/profile-webmcp-campaigns-v172.php
          php tests/profile-webmcp-rewards-v180.php
          php tests/profile-webmcp-rewards-v181.php
          php tests/profile-webmcp-rewards-v182.php
          php tests/profile-webmcp-rewards-v183.php
          php tests/profile-webmcp-rewards-v184.php
      - name: Profile WebMCP static integration contract
        run: |
          node tests/profile-webmcp-v100-contract.mjs
          node tests/profile-webmcp-capability-resolver-v190-contract.mjs
          node tests/profile-webmcp-tool-router-v191-contract.mjs
          node tests/profile-webmcp-confirmation-v192-contract.mjs
          node tests/profile-webmcp-agent-brain-v193-contract.mjs
          node tests/profile-webmcp-continuity-v194-contract.mjs
          node tests/profile-webmcp-continuity-v195-contract.mjs
          node tests/profile-webmcp-release-v196-contract.mjs
          node tests/profile-webmcp-release-v196-journey.mjs
          node tests/profile-webmcp-negotiation-v200-contract.mjs
          node tests/profile-webmcp-negotiation-v200-runtime.mjs
          node tests/profile-webmcp-health-v201-contract.mjs
          node tests/profile-webmcp-agent-v110-contract.mjs
          node tests/profile-webmcp-external-v120-contract.mjs
          node tests/profile-webmcp-analytics-v130-contract.mjs
          node tests/profile-webmcp-chat-v140-contract.mjs
          node tests/profile-webmcp-scheduling-v150-contract.mjs
          node tests/profile-webmcp-commerce-v160-contract.mjs
          node tests/profile-webmcp-campaigns-v170-contract.mjs
          node tests/profile-webmcp-campaigns-v171-contract.mjs
          node tests/profile-webmcp-campaigns-v172-contract.mjs
          node tests/profile-webmcp-rewards-v180-contract.mjs
          node tests/profile-webmcp-rewards-v181-contract.mjs
          node tests/profile-webmcp-rewards-v182-contract.mjs
          node tests/profile-webmcp-rewards-v183-contract.mjs
          node tests/profile-webmcp-rewards-v184-contract.mjs
      - name: Profile WebMCP browser runtime contract
        run: |
          node tests/profile-webmcp-v100-runtime.mjs
          node tests/profile-webmcp-confirmation-v192-runtime.mjs
          node tests/profile-webmcp-continuity-v194-runtime.mjs
          node tests/profile-webmcp-continuity-v195-runtime.mjs
          node tests/profile-webmcp-agent-v110-runtime.mjs
          node tests/profile-webmcp-external-v120-runtime.mjs
          node tests/profile-webmcp-analytics-v130-runtime.mjs
          node tests/profile-webmcp-chat-v140-runtime.mjs
          node tests/profile-webmcp-scheduling-v150-runtime.mjs
          node tests/profile-webmcp-commerce-v160-runtime.mjs
          node tests/profile-webmcp-campaigns-v170-runtime.mjs
          node tests/profile-webmcp-campaigns-v171-runtime.mjs
          node tests/profile-webmcp-campaigns-v172-runtime.mjs
          node tests/profile-webmcp-rewards-v180-runtime.mjs
          node tests/profile-webmcp-rewards-v181-runtime.mjs
          node tests/profile-webmcp-rewards-v182-runtime.mjs
          node tests/profile-webmcp-rewards-v183-runtime.mjs
          node tests/profile-webmcp-rewards-v184-runtime.mjs
      - name: Profile WebMCP production package smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/vp3-webmcp-package
          mkdir -p /tmp/vp3-webmcp-package
          rsync -a ./ /tmp/vp3-webmcp-package/ \
            --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='private/' \
            --exclude='uploads/' --exclude='config.php' --exclude='.env*'
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-v100.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-capability-resolver-v190.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-tool-router-v191.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-confirmation-v192.php
          test -f /tmp/vp3-webmcp-package/includes/agent-profile-webmcp-v193.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-continuity-v194.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-continuity-v195.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-release-v196.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-negotiation-v200.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-health-v201.php
          test -f /tmp/vp3-webmcp-package/api/profile-webmcp-health-v201.php
          test -f /tmp/vp3-webmcp-package/api/profile-webmcp-continuity-v195.php
          test -f /tmp/vp3-webmcp-package/includes/profile-agent-public-service-v110.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-external-v120.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-analytics-v130.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-chat-v140.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-actions-v150.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-scheduling-v150.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-commerce-v160.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-campaigns-v170.php
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-rewards-v180.php
          test -f /tmp/vp3-webmcp-package/profile-webmcp-commerce-return-v160.php
          test -f /tmp/vp3-webmcp-package/api/profile-webmcp-v100.php
          test -f /tmp/vp3-webmcp-package/api/profile-webmcp-external-v120.php
          test -f /tmp/vp3-webmcp-package/profile-webmcp-v100.js
          test -f /tmp/vp3-webmcp-package/profile-webmcp-external-v120.js
          grep -Fq "includes/profile-webmcp-v100.php" /tmp/vp3-webmcp-package/profile.php
          grep -Fq "profile-webmcp-v100.js" /tmp/vp3-webmcp-package/profile.php
          grep -Fq "webmcpExternalScriptUrl" /tmp/vp3-webmcp-package/profile-agent.php
          grep -Fq "webmcpExternalScriptUrl" /tmp/vp3-webmcp-package/profile-agent-radar-sites.js
          grep -Fq "WebMCP calls" /tmp/vp3-webmcp-package/profile-agent-analytics.js
          grep -Fq "Agent Chat" /tmp/vp3-webmcp-package/profile-agent-radar-sites.js
          grep -Fq "Scheduling" /tmp/vp3-webmcp-package/profile-agent-radar-sites.js
          grep -Fq "Commerce" /tmp/vp3-webmcp-package/profile-agent-radar-sites.js
          grep -Fq "vp3_profile_webmcp_commerce_record_purchase_v160" /tmp/vp3-webmcp-package/includes/agent-commerce-v800-part4.php
          grep -Fq "vp3_profile_webmcp_actions_schema_ready_v150" /tmp/vp3-webmcp-package/upgrade.php
