name: VP3 Universal Display Cards 11B.3 v5.20

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - phase11b3-universal-display-cards-v520

permissions:
  contents: read

jobs:
  contract:
    name: Universal Cards · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cognitive Runtime specification
        run: node tests/vp3-cognitive-runtime-spec-v500.mjs
      - name: 11B.1 Runtime Core
        run: node tests/cognitive-runtime-core-v500.mjs
      - name: 11B.2 Cognitive Presentation
        run: node tests/cognitive-presentation-v510.mjs
      - name: 11B.3 Universal Cards
        run: node tests/cognitive-cards-v520.mjs
      - name: JavaScript syntax
        run: |
          node --check chat-cognitive-cards-v520.js
          node --check chat-cognitive-presentation-v510.js
          node --check chat.js
      - name: PHP syntax
        run: |
          php -l includes/cognitive-cards-v520.php
          php -l api/cognitive-cards-v520.php
          php -l includes/cognitive-runtime-v500.php
          php -l includes/cognitive-presentation-v510.php
          php -l includes/cognitive-runtime-meetings-v500.php
          php -l chat.php
