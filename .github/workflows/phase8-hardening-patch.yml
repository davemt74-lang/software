name: Phase 8 Hardening Patch

on:
  push:
    branches: [feature-paid-appointments-phase-8]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-paid-appointments-phase-8
          fetch-depth: 0
      - name: Apply targeted Phase 8 hardening
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
              text=text.replace(old,new) if count is None else text.replace(old,new,count)
              p.write_text(text)

          p=Path('includes/agent-scheduling-tools-v460.php')
          text=p.read_text()
          start=text.index('function agent_scheduling_tools_reschedule_owner_v460')
          end=text.index('function agent_scheduling_tools_execute_pending_v460',start)
          replacement=r'''function agent_scheduling_tools_reschedule_owner_v460(PDO $pdo,array $user,array $booking,string $startAtUtc,int $agentId): array
          {
              $userId=(int)($user['id']??0);
              if($userId<1||(int)($booking['owner_user_id']??0)!==$userId)throw new RuntimeException('That appointment is not available to this account.');
              if(!in_array((string)($booking['status']??''),['pending','confirmed'],true))throw new RuntimeException('Only an active appointment can be rescheduled.');
              if(!function_exists('agent_appointment_lifecycle_schema_ready_v700')||!agent_appointment_lifecycle_schema_ready_v700($pdo))throw new RuntimeException('Run the VP3 database upgrade before Agent rescheduling can be used.');
              $current=agent_appointment_lifecycle_booking_v700($pdo,(int)$booking['id'],$userId);
              if(!$current)throw new RuntimeException('That appointment is no longer available.');
              $paid=null;
              if(function_exists('agent_paid_appointments_schema_ready_v800')&&agent_paid_appointments_schema_ready_v800($pdo)){
                  $paid=agent_paid_appointments_paid_booking_for_booking_v800($pdo,(int)$booking['id']);
                  if($paid&&(string)$paid['payment_status']==='awaiting_payment')throw new RuntimeException('Complete or cancel the pending appointment payment before rescheduling.');
              }
              $fresh=agent_appointment_lifecycle_reschedule_v700(
                  $pdo,$current,$startAtUtc,
                  (string)($current['guest_timezone']?:$current['organizer_timezone']),
                  'agent',$userId,$agentId?:null
              );
              if($paid)agent_paid_appointments_record_reschedule_v800($pdo,$paid,'agent',$userId,$agentId?:null);
              return $fresh;
          }

          '''
          p.write_text(text[:start]+replacement+text[end:])

          replace('appointment-payments.php',"(int)round(((float)($_POST['price']??0))*100)","agent_paid_appointments_decimal_to_minor_v800((string)($_POST['price']??'0'))")
          replace('appointment-payments.php',"(int)round(((float)($_POST['deposit']??0))*100)","agent_paid_appointments_decimal_to_minor_v800((string)($_POST['deposit']??'0'))")
          replace('appointment-payments.php',"(int)round(((float)($_POST['cancellation_fee']??0))*100)","agent_paid_appointments_decimal_to_minor_v800((string)($_POST['cancellation_fee']??'0'))")
          replace('appointment-payments.php',"(int)round(((float)($_POST['refund_amount']??0))*100)","agent_paid_appointments_decimal_to_minor_v800((string)($_POST['refund_amount']??'0'))")
          replace('appointment-payments.php','name="hold_minutes" min="5"','name="hold_minutes" min="30"')

          replace('includes/agent-paid-appointments-v800-part2.php',"$hold=max(5,min(120,(int)($input['hold_minutes']??20)));","$hold=max(30,min(120,(int)($input['hold_minutes']??30)));")
          replace('includes/agent-paid-appointments-v800-part2.php',"'hold_minutes'=>20","'hold_minutes'=>30")
          replace('includes/agent-paid-appointments-v800-part1.php','hold_minutes SMALLINT UNSIGNED NOT NULL DEFAULT 20','hold_minutes SMALLINT UNSIGNED NOT NULL DEFAULT 30')

          replace('includes/agent-paid-appointments-v800-part4.php',";if((int)$paid['platform_fee_cents']>0)$params['refund_application_fee']='true';$resp=",';$resp=')

          replace('public-booking-controller-v700.php',"$paid = $paidReady ? agent_paid_appointments_paid_booking_for_booking_v800($pdo, (int)$managedBooking['id']) : null;\n            if ($lifecycleReady) {\n                $managedBooking = agent_appointment_lifecycle_booking_v700", "$paid = $paidReady ? agent_paid_appointments_paid_booking_for_booking_v800($pdo, (int)$managedBooking['id']) : null;\n            if ($paid && (string)$paid['payment_status'] === 'awaiting_payment') throw new RuntimeException('Complete or cancel the pending appointment payment before rescheduling.');\n            if ($lifecycleReady) {\n                $managedBooking = agent_appointment_lifecycle_booking_v700",1)
          replace('public-booking-view-v700.php','<?php if ($activeBooking && $slotEventPublic): ?>','<?php if ($activeBooking && !$paymentAwaiting && $slotEventPublic): ?>',1)

          replace('appointment-payment.php',"if(!headers_sent()){header('Referrer-Policy: no-referrer');header('X-Robots-Tag: noindex, nofollow, noarchive');}","if(!headers_sent()){header('Referrer-Policy: no-referrer');header('X-Robots-Tag: noindex, nofollow, noarchive');header('Cache-Control: no-store, private');}")
      - name: Commit hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hardening changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/agent-scheduling-tools-v460.php appointment-payments.php includes/agent-paid-appointments-v800-part1.php includes/agent-paid-appointments-v800-part2.php includes/agent-paid-appointments-v800-part4.php public-booking-controller-v700.php public-booking-view-v700.php appointment-payment.php
          git commit -m "Phase 8: harden paid rescheduling and money handling"
          git push origin HEAD:feature-paid-appointments-phase-8
