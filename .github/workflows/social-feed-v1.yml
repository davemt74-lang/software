name: HomeServer Social Feed V1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: social-feed-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Canonical posts, profiles and relationships
        env:
          VP3_SECTION7_MYSQL_DSN: mysql:host=127.0.0.1;port=3306
          VP3_SECTION7_MYSQL_PASSWORD: fixture
        run: |
          php -l includes/social-feed-v1.php
          php -l api/social-feed-v1.php
          php -l feed.php
          php tests/social-feed-v1-mysql.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser acceptance
        run: |
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
          node tests/social-feed-v1-browser.mjs
