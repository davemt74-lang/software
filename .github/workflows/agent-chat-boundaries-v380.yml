name: Agent Chat Boundaries v3.80

on:
  push:
    branches:
      - main
      - feature/canonical-agent-chat-boundaries-v380
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Agent Chat boundary contract
        run: node tests/agent-chat-boundaries-v380.mjs

      - name: JavaScript syntax
        run: node --check tests/agent-chat-boundaries-v380.mjs

      - name: PHP syntax
        run: |
          php -l includes/agent-chat-boundary-v380.php
          php -l api/chat-v236.php
          php -l api/chat-stream-v121.php
          php -l includes/chat-agent-policy-v236.php
          php -l includes/chat-engine.php
          php -l includes/agent-surface-context-v131.php
