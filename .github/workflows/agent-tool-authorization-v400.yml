name: Agent Tool Authorization v4.00

on:
  push:
    branches:
      - main
      - feature/canonical-agent-tool-authorization-v400
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Agent tool authorization contract
        run: node tests/agent-tool-authorization-v400.mjs

      - name: JavaScript syntax
        run: node --check tests/agent-tool-authorization-v400.mjs

      - name: PHP syntax
        run: |
          php -l includes/agent-tool-authorization-v400.php
          php -l api/chat-v236.php
          php -l includes/music-workspace-resources-v330.php
          php -l includes/release-workspace-v332.php
          php -l includes/homeserver-approvals-v028.php
          php -l includes/agent-action-system-v124.php
