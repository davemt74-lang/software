name: VP3 Recovery Diagnostics
'on':
  push:
    branches:
    - diagnostic/vp3-recovery-20261117
permissions:
  contents: read
jobs:
  browser_and_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
        - 0
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        extensions: mbstring, pdo_sqlite, dom, curl
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing browser test runtime
      run: 'npm install --no-save --ignore-scripts playwright@1.62.1

        bash tools/install-ci-chromium.sh'
    - name: Run every assigned test and report each result
      env:
        VP3_DIAGNOSTIC_SHARD: ${{ matrix.shard }}
      run: "python3 - <<'PY_DIAGNOSTIC'\nimport json, os, subprocess, time\nfrom pathlib import Path\ncommands=json.loads('[\"\
        node tests/initiative-live-context-browser.mjs\"]')\nshard=int(os.environ['VP3_DIAGNOSTIC_SHARD'])\nout=Path('vp3-diagnostic-results');out.mkdir()\n\
        results=[]\nfor i,command in enumerate(commands):\n    if i%4!=shard: continue\n    print('START '+command,flush=True)\n\
        \    started=time.monotonic();log=out/(str(i).zfill(3)+'.log')\n    with log.open('w') as output:\n        try:\n\
        \            code=subprocess.run(['bash','-e','-c',command],stdout=output,stderr=subprocess.STDOUT,timeout=180).returncode\n\
        \        except subprocess.TimeoutExpired: code=124\n    result={'index':i,'command':command,'exit_code':code,'seconds':round(time.monotonic()-started,2)}\n\
        \    results.append(result)\n    print(json.dumps(result),flush=True)\n    if code: print('\\n'.join(log.read_text(errors='replace').splitlines()[-65:]),flush=True)\n\
        \    (out/'results.json').write_text(json.dumps(results,indent=2))\nprint('DIAGNOSTIC_FAILURES='+json.dumps([r for\
        \ r in results if r['exit_code']]),flush=True)\nraise SystemExit(1 if any(r['exit_code'] for r in results) else 0)\n\
        PY_DIAGNOSTIC\n"
    - name: Retain diagnostic results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vp3-diagnostic-${{ matrix.shard }}
        path: vp3-diagnostic-results/
        retention-days: 3
  production_preflight:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Build production deploy archive
      shell: bash
      env:
        VP3_RELEASE_SHA: ${{ github.sha }}
      run: "set -euo pipefail\n\nrm -rf _deploy software-deploy.zip\nmkdir _deploy\n\nrsync -a ./ _deploy/ \\\n  --exclude='.git/'\
        \ \\\n  --exclude='.github/' \\\n  --exclude='.gitignore' \\\n  --exclude='config.php' \\\n  --exclude='.env' \\\n\
        \  --exclude='.env.*' \\\n  --exclude='private/' \\\n  --exclude='uploads/' \\\n  --exclude='tests/' \\\n  --exclude='tools/'\
        \ \\\n  --exclude='_deploy/' \\\n  --exclude='*.md' \\\n  --exclude='*.zip'\n\ncat > _deploy/VP3_RELEASE.json <<EOF\n\
        {\n  \"release\": \"VP3 Cloud Production\",\n  \"mission_lifecycle_section\": \"A5C11\",\n  \"research_section\":\
        \ \"R3\",\n  \"capture_routing_section\": \"R4\",\n  \"project_knowledge_section\": \"R11\",\n  \"minimum_mission_schema\"\
        : 79,\n  \"build\": \"vp3-cloud-main-${VP3_RELEASE_SHA:0:12}\",\n  \"commit\": \"${VP3_RELEASE_SHA}\",\n  \"repository\"\
        : \"${GITHUB_REPOSITORY}\",\n  \"workflow_run_id\": \"${GITHUB_RUN_ID}\",\n  \"tracky_agent_eyes_section\": \"1G5\"\
        ,\n  \"tracky_agent_eyes_scene_protocol\": \"tracky.agent-eyes.shared-scene.v1g3d\",\n  \"tracky_feature_track\":\
        \ \"V2.81\",\n  \"tracky_release_section\": 3,\n  \"tracky_federated_automation_protocol\": \"physical_federated_automation.v1\"\
        ,\n  \"tracky_federated_automation_execution_enabled\": false,\n  \"tracky_physical_trigger_runtime\": true,\n  \"\
        tracky_distributed_action_execution\": true,\n  \"tracky_golden_operational_scenarios\": 24,\n  \"tracky_recovery_authority\"\
        : \"section7_authoritative_reconciliation\",\n  \"preserve_runtime_paths\": [\"config.php\", \".env\", \"private/\"\
        , \"uploads/\"]\n}\nEOF\n\ntest -s _deploy/VP3_RELEASE.json\npython3 -m json.tool _deploy/VP3_RELEASE.json >/dev/null\n\
        grep -Fq '\"commit\": \"'\"${VP3_RELEASE_SHA}\"'\"' _deploy/VP3_RELEASE.json\ntest -f _deploy/includes/tracky-agent-scene-v1g3d.php\n\
