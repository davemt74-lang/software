name: VP3 Recovery Diagnostics
'on':
  push:
    branches:
    - diagnostic/vp3-recovery-20261117
permissions:
  contents: read
jobs:
  browser_and_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
