name: VP3 Cognitive Presentation 11B.2 v5.10

concurrency:
  group: \${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: \${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - phase11b2-presentation-chat-shell-v510

permissions:
  contents: read

jobs:
  contract:
    name: Cognitive Presentation · PHP \${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: \${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Specification contract
        run: node tests/vp3-cognitive-runtime-spec-v500.mjs
      - name: 11B.1 core contract
        run: node tests/cognitive-runtime-core-v500.mjs
      - name: 11B.2 presentation contract
        run: node tests/cognitive-presentation-v510.mjs
      - name: JavaScript syntax
        run: node --check chat-cognitive-presentation-v510.js && node --check chat-notifications-drawer-v240.js
      - name: PHP syntax
        run: |
          php -l includes/cognitive-presentation-v510.php
          php -l api/cognitive-presentation-v510.php
          php -l api/chat-notifications-brain-v240.php
          php -l includes/agent-cognitive-loop-v310.php
          php -l chat.php
          php -l upgrade.php
