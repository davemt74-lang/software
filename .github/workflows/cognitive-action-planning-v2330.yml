name: Cognitive Action Planning v23.30

on:
  pull_request:
    paths:
      - 'docs/VP3_COGNITIVE_ACTION_PLANNING_V2330.md'
      - 'includes/cognitive-action-planning-v2330.php'
      - 'includes/cognitive-planning-v550.php'
      - 'includes/cognitive-orchestration-v560.php'
      - 'includes/bootstrap.php'
      - 'tests/cognitive-action-planning-v2330.mjs'
      - '.github/workflows/cognitive-action-planning-v2330.yml'
  push:
    branches:
      - 'cognitive-action-planning-v2330'

jobs:
  contract:
    name: Cognitive Action Planning v23.30 · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/cognitive-action-planning-v2330.php
          php -l includes/cognitive-planning-v550.php
          php -l includes/cognitive-orchestration-v560.php
          php -l includes/bootstrap.php
      - name: v23.30 architecture contract
        run: node tests/cognitive-action-planning-v2330.mjs
      - name: Retained cognitive operations contracts
        run: |
          node tests/cognitive-opportunities-v2320.mjs
          node tests/cognitive-priority-queue-v2310.mjs
          node tests/cognitive-operations-v2300.mjs
          node tests/cognitive-runtime-core-v500.mjs
          node tests/cognitive-feed-v530.mjs
          node tests/cognitive-learning-v540.mjs
          node tests/cognitive-planning-v550.mjs
          node tests/cognitive-orchestration-v560.mjs
          node tests/cognitive-memory-v570.mjs
          node tests/browser-companion-cognitive-now-v2120.mjs
