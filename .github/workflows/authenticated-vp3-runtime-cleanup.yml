name: Authenticated VP3 Runtime Cleanup

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: php -l includes/member-header.php
      - name: JavaScript syntax
        run: node --check vp3-authenticated-runtime-bridge.js
      - name: Authenticated VP3 runtime cleanup contract
        run: node tests/authenticated-vp3-runtime-cleanup-contract.mjs
      - name: Retained authenticated shell consolidation contract
        run: node tests/authenticated-shell-consolidation-contract.mjs
      - name: Retained VP3 normalization contract
        run: node tests/authenticated-shell-vp3-normalization-contract.mjs
      - name: Retained profile runtime resilience contract
        run: node tests/profile-runtime-resilience-contract.mjs
