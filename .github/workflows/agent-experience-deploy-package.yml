name: Agent Experience Deploy Package
on:
  push:
    branches:
      - build/agent-experience-deploy-20261006
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v4
        with:
          ref: ef1c4f6cc6d60b8302f94d8f8557a624ee23b6e7
          fetch-depth: 1
      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr VP3-Cloud-Agent-Experience-Deploy.zip . -x ".git/*"
          sha256sum VP3-Cloud-Agent-Experience-Deploy.zip > VP3-Cloud-Agent-Experience-SHA256.txt
      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: VP3-Cloud-Agent-Experience-Deploy
          path: |
            VP3-Cloud-Agent-Experience-Deploy.zip
            VP3-Cloud-Agent-Experience-SHA256.txt
          if-no-files-found: error
          retention-days: 7
