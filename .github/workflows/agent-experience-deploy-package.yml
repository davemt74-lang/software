name: Cloud Deploy Package
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-experience-deploy-package.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr VP3-Cloud-Agent-Experience-Deploy.zip . -x ".git/*" ".github/*"
          sha256sum VP3-Cloud-Agent-Experience-Deploy.zip > VP3-Cloud-Agent-Experience-SHA256.txt
      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: VP3-Cloud-Agent-Experience-Deploy
          path: |
            VP3-Cloud-Agent-Experience-Deploy.zip
            VP3-Cloud-Agent-Experience-SHA256.txt
          if-no-files-found: error
          retention-days: 14
