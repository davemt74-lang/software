name: Team Workspaces v3.50

on:
  push:
    branches:
      - main
      - feature/canonical-teams-workspaces-v350
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Team lifecycle contract
        run: node tests/team-workspace-lifecycle-v350.mjs

      - name: JavaScript syntax
        run: node --check tests/team-workspace-lifecycle-v350.mjs

      - name: PHP syntax
        run: |
          php -l includes/team-workspace-lifecycle-v350.php
          php -l includes/artist-workspaces-v104.php
          php -l includes/team-subscription.php
          php -l includes/bootstrap.php
          php -l team.php
          php -l team-invite.php
          php -l login.php
          php -l signup.php
          php -l admin/team-workspaces.php
          php -l chat.php
          php -l setup.php
          php -l upgrade.php
