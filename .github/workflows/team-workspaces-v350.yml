name: Team Workspaces v3.50

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - feature/canonical-teams-workspaces-v350
      - campaigns-rewards-v100
      - campaigns-rewards-v110-reward-tray
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Team lifecycle contract
        run: node tests/team-workspace-lifecycle-v350.mjs

      - name: Campaigns & Rewards V1 contract
        run: |
          php tests/campaigns-rewards-v100.php
          node tests/campaigns-rewards-v100.mjs

      - name: Campaigns & Rewards V1.10 contract
        run: |
          php tests/campaigns-rewards-v110.php
          node tests/campaigns-rewards-v110.mjs

      - name: Campaigns & Rewards V1.18 contract
        run: |
          php tests/campaigns-rewards-v118.php
          node tests/campaigns-rewards-v118.mjs

      - name: Campaigns & Rewards V1.19 contract
        run: |
          php tests/campaigns-rewards-v119.php
          node tests/campaigns-rewards-v119.mjs

      - name: Full MySQL 8 upgrade audit
        run: python3 tests/upgrade-mysql8-static-audit.py

      - name: JavaScript syntax
        run: |
          node --check tests/team-workspace-lifecycle-v350.mjs
          node --check tests/campaigns-rewards-v100.mjs
          node --check tests/campaigns-rewards-v110.mjs
          node --check tests/campaigns-rewards-v118.mjs
          node --check tests/campaigns-rewards-v119.mjs
          node --check reward-tray-v110.js
          node --check reward-qr-v110.js

      - name: PHP syntax
        run: |
          php -l includes/team-workspace-lifecycle-v350.php
          php -l includes/artist-workspaces-v104.php
          php -l includes/team-subscription.php
          php -l includes/bootstrap.php
          php -l includes/campaigns-rewards-v100.php
          php -l includes/campaigns-rewards-platform-v100.php
          php -l includes/campaigns-rewards-domain-v100.php
          php -l includes/campaigns-rewards-release-v100.php
          php -l includes/campaigns-rewards-v110.php
          php -l includes/campaigns-rewards-release-v110.php
          php -l includes/campaigns-rewards-types-v118.php
          php -l includes/campaigns-rewards-v118.php
          php -l includes/campaigns-rewards-release-v118.php
          php -l includes/campaigns-rewards-v119.php
          php -l includes/campaigns-rewards-release-v119.php
          php -l tests/campaigns-rewards-v118.php
          php -l tests/campaigns-rewards-v119.php
          php -l cron/campaigns-rewards-v119.php
          php -l api/reward-tray-v110.php
          php -l team.php
          php -l campaigns.php
          php -l rewards.php
          php -l campaign.php
          php -l campaign-claim.php
          php -l rewards-wallet.php
          php -l profile.php
          php -l plugins.php
          php -l includes/member-navigation.php
          php -l team-invite.php
          php -l login.php
          php -l signup.php
          php -l admin/team-workspaces.php
          php -l chat.php
          php -l setup.php
          php -l upgrade.php
