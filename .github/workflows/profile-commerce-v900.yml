name: Profile Commerce v9.00

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Profile Commerce contract
        run: node tests/profile-commerce-v900-contract.mjs
      - name: Retained Commerce contract
        run: node tests/agent-commerce-v800-contract.mjs
      - name: Cross-repo payment contract
        run: node tests/commerce-payment-v1-contract.mjs
      - name: Retained Profile Agent route contract
        run: node tests/profile-agent-attention-contract.mjs
      - name: Retained member navigation contract
        run: node tests/member-navigation-contract.mjs
      - name: Profile Commerce runtime load
        run: php -r "require 'includes/agent-commerce-v800.php'; require 'includes/profile-agent.php'; require 'includes/profile-commerce-v900.php'; require 'includes/profile-commerce-checkout-v900.php'; require 'includes/profile-commerce-ops-v900.php'; echo 'PROFILE_COMMERCE_RUNTIME=PASS'.PHP_EOL;"
      - name: PHP syntax
        run: |
          php -l includes/profile-commerce-v900.php
          php -l includes/profile-commerce-checkout-v900.php
          php -l includes/profile-commerce-ops-v900.php
          php -l profile-v900.php
          php -l profile-commerce-product.php
          php -l profile-commerce-products.php
          php -l includes/profile-agent-transcription-context.php
          php -l includes/member-navigation.php
          php -l profile.php
