name: Temporary Chat Light Source Migration

on:
  push:
    branches:
      - fix/chat-remove-brown-theme

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[chat-light-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-remove-brown-theme
          fetch-depth: 0
      - name: Harden migration for all recovered brown border alphas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp_chat_light_source_migration.py')
          s = p.read_text()
          needle = "for old, new in rgba_replacements.items():\n    css = css.replace(old, new)\n"
          insert = needle + "css = re.sub(r'rgba\\(190,155,111,([.0-9]+)\\)', r'rgba(17,24,39,\\1)', css)\n"
          if needle not in s:
              raise SystemExit('migration insertion point missing')
          p.write_text(s.replace(needle, insert, 1))
          PY
      - name: Apply source migration
        run: python3 tools/tmp_chat_light_source_migration.py
      - name: Focused source contract
        run: node tests/chat-light-source-contract.mjs
      - name: PHP lint current Chat shell
        run: |
          php -l chat.php
          php -l chat-legacy-v108.php
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize Chat light source and navigation [chat-light-migrated]"
          git push origin HEAD:fix/chat-remove-brown-theme
