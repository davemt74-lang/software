name: Distributed Agent Worker Runtime v19.1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Worker runtime · PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-file: production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP syntax
        run: |
          php -l includes/agent-worker-runtime-v1910.php
          php -l includes/agent-worker-cloud-v1910.php
          php -l includes/agent-job-worker-v1900.php
          php -l agent-worker-v1910.php
          php -l api/agent-workflow-runs-v1400.php
          php -l agent-workflows.php
      - name: JavaScript syntax
        run: node --check tests/agent-worker-runtime-v1910-contract.mjs
      - name: Distributed worker contract
        run: node tests/agent-worker-runtime-v1910-contract.mjs
      - name: Preserve Phase 19.0 contract
        run: node tests/agent-job-engine-v1900-contract.mjs
