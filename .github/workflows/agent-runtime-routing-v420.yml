name: Agent Runtime Routing v4.20

on:
  push:
    branches:
      - main
      - feature/canonical-agent-runtime-routing-v420
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Agent runtime routing contract
        run: node tests/agent-runtime-routing-v420.mjs

      - name: JavaScript syntax
        run: node --check tests/agent-runtime-routing-v420.mjs

      - name: PHP syntax
        run: |
          php -l includes/agent-runtime-routing-v420.php
          php -l includes/ai-usage-accounting-v032.php
          php -l includes/bootstrap.php
          php -l api/chat-v236.php
          php -l api/chat-stream-v121.php
          php -l api/agent-runtime-status-v034.php
          php -l setup.php
          php -l upgrade.php
