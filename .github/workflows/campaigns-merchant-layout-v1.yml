name: Campaigns Merchant Layout
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: campaigns-merchant-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  merchant-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merchant creation PHP and canonical scroll contracts
        run: |
          php -l campaigns.php
          php -l includes/member-header.php
          node tests/campaigns-merchant-layout-contract-v1.mjs
      - name: Install browser acceptance runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          bash tools/install-ci-chromium.sh
      - name: Create Merchant scrolling and sidebar on desktop and mobile
        run: node tests/campaigns-merchant-layout-browser-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaigns-merchant-layout-evidence
          path: artifacts/campaigns-merchant-layout/
          if-no-files-found: ignore
