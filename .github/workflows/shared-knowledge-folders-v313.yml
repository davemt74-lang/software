name: Shared Knowledge Folders v3.13

on:
  push:
    branches:
      - main
      - shared-knowledge-folders
  pull_request:

permissions:
  contents: read

jobs:
  shared-knowledge-folders:
    name: Shared Knowledge Folders · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint shared folder integration
        run: |
          php -l includes/personal-capabilities-v242.php
          php -l includes/knowledge.php
          php -l knowledge.php
          php -l api/artist-listening-intelligence-v300.php
          php -l includes/main-sidebar.php
          php -l tests/shared-knowledge-folders-v313-contract.php
          php -l tests/agent-ui-v034-contract.php

      - name: Verify JavaScript syntax
        run: |
          node --check transcription-knowledge-folders-v313.js
          node --check artist-listening-naming.js
          node --check tests/transcription-folder-observer-hotfix-contract.mjs

      - name: Verify shared folder contract
        run: php tests/shared-knowledge-folders-v313-contract.php

      - name: Verify transcription folder observer hotfix
        run: node tests/transcription-folder-observer-hotfix-contract.mjs

      - name: Verify Agent UI navigation contract
        run: php tests/agent-ui-v034-contract.php

      - name: Verify canonical Main Feed shell contract
        run: node tests/main-feed-canonical-ui-contract.mjs

      - name: Verify member sidebar shell contract
        run: node tests/member-sidebar-shell-contract.mjs

      - name: Verify member navigation contract
        run: node tests/member-navigation-contract.mjs

      - name: Verify member header contract
        run: node tests/member-header-contract.mjs

      - name: Verify Artist Listening runtime contract
        run: node tests/artist-listening-runtime.mjs

      - name: Verify transcription Knowledge integration contract
        run: node tests/transcription-agent-knowledge-integration.mjs

      - name: Verify Cloud schema upgrade contract
        run: node tests/cloud-schema-upgrade-contract.mjs
