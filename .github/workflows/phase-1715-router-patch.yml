name: Phase 17.15 Router Patch

on:
  push:
    branches: [phase-17.15-goal-commitments]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire strategic commitment check-ins') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-17.15-goal-commitments
          fetch-depth: 0
      - name: Wire Phase 17.15 into Phase 17.14 chat boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('includes/agent-goal-review-v1714.php')
          s=p.read_text()
          include="require_once __DIR__.'/agent-goal-commitments-v1715.php';"
          if include not in s:
              anchor="require_once __DIR__.'/agent-objective-memory-v177.php';"
              if anchor not in s:
                  raise SystemExit('Phase 17.14 include anchor not found')
              s=s.replace(anchor, anchor+'\n'+include, 1)
          route="$commitment=agent_goal_commitment_chat_v1715($query,$user,$conversationId);if(!empty($commitment['handled']))return $commitment;"
          if route not in s:
              anchor="function agent_goal_review_chat_v1714(string $query,array $user,int $conversationId=0): array\n{\n"
              if anchor not in s:
                  raise SystemExit('Phase 17.14 chat anchor not found')
              s=s.replace(anchor, anchor+'    '+route+'\n', 1)
          p.write_text(s)
          PY
          php -l includes/agent-goal-review-v1714.php
          php -l includes/agent-goal-commitments-v1715.php
      - name: Commit router wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add includes/agent-goal-review-v1714.php
          git commit -m "Phase 17.15: wire strategic commitment check-ins"
          git push origin HEAD:phase-17.15-goal-commitments
