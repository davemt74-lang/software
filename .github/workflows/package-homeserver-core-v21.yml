name: Package VP3 Cloud HomeServer Core v2.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cumulative deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/includes dist/api dist/docs

          cp api/homeserver-https-pair-v1300.php dist/api/
          cp api/homeserver-https-poll-v1300.php dist/api/
          cp api/homeserver-status.php dist/api/
          cp api/homeserver-connection-v1200.php dist/api/

          cp includes/bootstrap.php dist/includes/
          cp includes/homeserver-agent-v018.php dist/includes/
          cp includes/homeserver-cloud-pairing-actions-v1200.php dist/includes/
          cp includes/homeserver-cloud-pairing-v1200.php dist/includes/
          cp includes/homeserver-https-relay-v1300.php dist/includes/
          cp includes/homeserver-shared-agent-v210.php dist/includes/
          cp includes/homeserver-vp3.php dist/includes/
          cp includes/agent-brain-context-v142.php dist/includes/
          cp includes/notifications.php dist/includes/
          cp includes/profile-agent.php dist/includes/
          cp includes/user-agent-system-v236.php dist/includes/
          cp includes/main-sidebar.php dist/includes/

          cp homeserver-settings-v1210.js dist/
          cp homeserver-vp3.js dist/
          cp settings-homeserver.php dist/
          cp setup.php dist/
          cp upgrade.php dist/
          cp docs/HOMESERVER_V21_SHARED_AGENT_FABRIC.md dist/docs/

          cat > dist/DEPLOY.txt <<'EOF'
          VP3 Cloud HomeServer Core v2.1
          Matching release for HomeServer v2.1.

          Upload these files preserving paths and replace the existing files.
          Then run upgrade.php once.

          Shared product release version: 2.1

          v2.1 includes:
          - authenticated Cloud -> HomeServer -> Cloud system.ping verification
          - shared Agent Brain / memory, knowledge, contacts, tasks and notifications fabric
          - HomeServer connection-state events in canonical Agent Brain cognition
          - high-priority Agent Chat notification when HomeServer disconnects
          - Profile Agent HomeServer integrations through owner-controlled data policies
          - round-trip latency and shared-sync diagnostics
          - all verified v2.0 and v13.06 HTTPS relay fixes

          Internal protocol/schema identifiers such as v1300/v1200 remain compatibility identifiers.
          EOF

          cd dist
          zip -r vp3-cloud-v2.1.zip \
            api/homeserver-https-pair-v1300.php \
            api/homeserver-https-poll-v1300.php \
            api/homeserver-status.php \
            api/homeserver-connection-v1200.php \
            includes/bootstrap.php \
            includes/homeserver-agent-v018.php \
            includes/homeserver-cloud-pairing-actions-v1200.php \
            includes/homeserver-cloud-pairing-v1200.php \
            includes/homeserver-https-relay-v1300.php \
            includes/homeserver-shared-agent-v210.php \
            includes/homeserver-vp3.php \
            includes/agent-brain-context-v142.php \
            includes/notifications.php \
            includes/profile-agent.php \
            includes/user-agent-system-v236.php \
            includes/main-sidebar.php \
            homeserver-settings-v1210.js \
            homeserver-vp3.js \
            settings-homeserver.php \
            setup.php \
            upgrade.php \
            docs/HOMESERVER_V21_SHARED_AGENT_FABRIC.md \
            DEPLOY.txt

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vp3-cloud-v2.1
          path: dist/vp3-cloud-v2.1.zip
          if-no-files-found: error
          retention-days: 14
