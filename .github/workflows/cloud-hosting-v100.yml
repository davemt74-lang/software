        run: node tests/system-apps-v290-contract.mjs
      - name: System Apps Section 17 Music Server contract
        run: node tests/system-apps-v300-contract.mjs
      - name: System Apps Section 18 Photo Library contract
        run: node tests/system-apps-v310-contract.mjs
      - name: System Apps Section 19 Download Manager contract
        run: node tests/system-apps-v320-contract.mjs
      - name: System Apps Section 20 Media Processor contract
        run: node tests/system-apps-v330-contract.mjs
      - name: System Apps Section 9 user app SDK integration contract
        run: node tests/system-apps-v220-contract.mjs
      - name: Cloud Hosting Section 1 architecture contract
        run: node tests/cloud-hosting-v100-contract.mjs
      - name: Cloud Hosting Section 2 architecture contract
        run: node tests/cloud-hosting-v110-contract.mjs
      - name: Cloud Hosting Section 3 architecture contract
        run: node tests/cloud-hosting-v120-contract.mjs
      - name: Cloud Hosting Section 4 Agent tools contract
