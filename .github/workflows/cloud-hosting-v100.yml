        run: node tests/ai-credential-key-preservation-v2453.mjs
      - name: Existing package entitlement composition regression
        run: node tests/package-entitlement-composition-v340.mjs
      - name: Existing cloud schema upgrade completeness regression
        run: node tests/cloud-schema-upgrade-contract.mjs
      - name: Cloud personal LLM encryption, routing and billing regression
        run: |
          php -l includes/user-llm-v1.php
          php -l api/user-llm-v1.php
          php -l settings-ai-providers.php
          php -l includes/ai-stream-v121.php
          node tests/cloud-user-llm-v1-contract.cjs
          php -r '(new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","root",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]))->exec("CREATE DATABASE IF NOT EXISTS llm_test");'
          LLM_TEST_DSN='mysql:host=127.0.0.1;port=3306;dbname=llm_test;charset=utf8mb4' LLM_TEST_USER=root LLM_TEST_PASS=root php -d zend.assertions=1 -d assert.exception=1 tests/user-llm-v1.php
      - name: CI workflow governance regression
        run: node tests/ci-workflow-consolidation.mjs
      - name: MySQL 8 Cloud Hosting integration
        env:
          VP3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_hosting_test;charset=utf8mb4
          VP3_TEST_MYSQL_USER: root
          VP3_TEST_MYSQL_PASS: root
        run: |
          php tests/system-apps-v100-mysql.php
          php tests/system-apps-v110-mysql.php
          php tests/system-apps-v120-mysql.php
          php tests/system-apps-v130-mysql.php
          php tests/system-apps-v160-mysql.php
          php tests/system-apps-v170-mysql.php
          php tests/system-apps-v200-mysql.php
          php tests/system-apps-v240-mysql.php
          php tests/system-apps-v250-mysql.php
          php tests/cloud-hosting-v100-mysql.php
          php tests/cloud-hosting-v110-mysql.php
          php tests/cloud-hosting-v120-mysql.php
          php tests/cloud-hosting-v130-mysql.php
          php tests/cloud-hosting-v140-mysql.php
          php tests/cloud-hosting-v150-acceptance.php
          php tests/cloud-hosting-v200-mysql.php
