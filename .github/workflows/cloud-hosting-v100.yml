name: Cloud Hosting V1 Section 1

on:
  pull_request:
    paths:
      - "includes/cloud-hosting-v100.php"
      - "includes/subscription-schema.php"
      - "includes/ai-settings.php"
      - "includes/bootstrap.php"
      - "admin/ai.php"
      - "setup.php"
      - "upgrade.php"
      - "tests/cloud-hosting-v100-*"
      - ".github/workflows/cloud-hosting-v100.yml"
  push:
    branches:
      - main
    paths:
      - "includes/cloud-hosting-v100.php"
      - "includes/subscription-schema.php"
      - "includes/ai-settings.php"
      - "includes/bootstrap.php"
      - "admin/ai.php"
      - "setup.php"
      - "upgrade.php"
      - "tests/cloud-hosting-v100-*"
      - ".github/workflows/cloud-hosting-v100.yml"

concurrency:
  group: cloud-hosting-v100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  section1:
    name: Cloud Hosting Section 1 · PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_hosting_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql,sodium,openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP lint Cloud Hosting surfaces
        run: |
          php -l includes/cloud-hosting-v100.php
          php -l includes/subscription-schema.php
          php -l includes/ai-settings.php
          php -l includes/bootstrap.php
          php -l admin/ai.php
          php -l setup.php
          php -l upgrade.php
          php -l tests/cloud-hosting-v100-mysql.php
      - name: Cloud Hosting architecture contract
        run: node tests/cloud-hosting-v100-contract.mjs
      - name: Credential key preservation regression
        run: node tests/ai-credential-key-preservation-v2453.mjs
      - name: Existing package entitlement composition regression
        run: node tests/package-entitlement-composition-v340.mjs
      - name: Existing cloud schema upgrade completeness regression
        run: node tests/cloud-schema-upgrade-contract.mjs
      - name: CI workflow governance regression
        run: node tests/ci-workflow-consolidation.mjs
      - name: MySQL 8 Cloud Hosting integration
        env:
          VP3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_hosting_test;charset=utf8mb4
          VP3_TEST_MYSQL_USER: root
          VP3_TEST_MYSQL_PASS: root
        run: php tests/cloud-hosting-v100-mysql.php
