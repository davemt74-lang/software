concurrency:
  group: cloud-hosting-v100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosting:
    name: Cloud Hosting · PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_hosting_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql,sodium,openssl,curl,zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP lint Cloud Hosting surfaces
        run: |
          php -l includes/system-apps-v100.php
          php -l includes/system-apps-v110.php
          php -l includes/system-apps-v120.php
          php -l includes/system-apps-v130.php
          php -l includes/system-apps-v140.php
          php -l includes/system-apps-v150.php
          php -l includes/system-apps-v160.php
          php -l includes/system-apps-v170.php
          php -l includes/system-apps-v180.php
          php -l includes/system-apps-v190.php
          php -l includes/system-apps-v200.php
          php -l includes/system-apps-v210.php
          php -l includes/system-apps-v220.php
          php -l includes/system-apps-v230.php
          php -l includes/system-apps-v240.php
          php -l includes/system-apps-v250.php
          php -l includes/system-apps-v260.php
          php -l includes/system-apps-v270.php
          php -l includes/system-apps-v280.php
          php -l includes/system-apps-v290.php
          php -l includes/system-apps-v300.php
          php -l includes/system-apps-v310.php
          php -l includes/system-apps-v320.php
          php -l includes/system-apps-v330.php
          php -l private-app-share.php
          php -l api/system-apps-v100.php
          php -l apps.php
          php -l tests/system-apps-v100-mysql.php
          php -l tests/system-apps-v110-mysql.php
          php -l tests/system-apps-v120-mysql.php
          php -l tests/system-apps-v130-mysql.php
          php -l tests/system-apps-v160-mysql.php
          php -l tests/system-apps-v170-mysql.php
          php -l tests/system-apps-v200-mysql.php
          php -l tests/system-apps-v240-mysql.php
          php -l tests/system-apps-v250-mysql.php
          php -l includes/cloud-hosting-v100.php
          php -l includes/cloud-hosting-v110.php
          php -l includes/cloud-hosting-v120.php
          php -l includes/cloud-hosting-agent-v130.php
          php -l includes/cloud-hosting-ui-v140.php
          php -l includes/cloud-hosting-release-v150.php
          php -l includes/cloud-hosting-domains-v200.php
          php -l includes/cloud-hosting-releases-v220.php
          php -l includes/cloud-hosting-diagnostics-v230.php
          php -l includes/cloud-hosting-health-v240.php
          php -l tests/cloud-hosting-v200-mysql.php
          php -l tests/cloud-hosting-v220-mysql.php
          php -l tests/cloud-hosting-v230-mysql.php
          php -l tests/cloud-hosting-v240-mysql.php
          php -l tests/cloud-hosting-v150-acceptance.php
          php -l hosting.php
          php -l tests/cloud-hosting-v140-mysql.php
          php -l includes/subscription-schema.php
          php -l includes/ai-settings.php
          php -l includes/bootstrap.php
          php -l admin/ai.php
          php -l setup.php
          php -l upgrade.php
          php -l tests/cloud-hosting-v100-mysql.php
          php -l tests/cloud-hosting-v110-mysql.php
          php -l tests/cloud-hosting-v120-mysql.php
          php -l tests/cloud-hosting-v130-mysql.php
      - name: System Apps Section 10 architecture contract
        run: node tests/system-apps-v100-contract.mjs
      - name: System Apps Section 11 HomeServer install contract
        run: node tests/system-apps-v110-contract.mjs
      - name: System Apps Section 12 Hosting binding contract
        run: node tests/system-apps-v120-contract.mjs
