name: HomeServer Cloud Pairing v12.10

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - phase-15-2-2-cloud-issued-pairing
  pull_request:

permissions:
  contents: read

jobs:
  cloud-pairing:
    name: Cloud pairing · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint pairing PHP
        run: |
          php -l includes/homeserver-vp3.php
          php -l includes/homeserver-cloud-pairing-v1200.php
          php -l includes/homeserver-cloud-pairing-actions-v1200.php
          php -l includes/homeserver-account-pairing-v1210.php
          php -l includes/homeserver-relay-lifecycle-v1210.php
          php -l includes/homeserver-relay-bootstrap-v1210.php
          php -l api/homeserver-connection-v1200.php
          php -l api/homeserver-pair-v1210.php
          php -l api/homeserver-relay-bootstrap-v1210.php
          php -l api/homeserver-status.php
          php -l settings-homeserver.php
          php -l includes/member-navigation.php

      - name: Verify account-token pairing contracts
        run: |
          node tests/homeserver-cloud-pairing-v1200-contract.mjs
          node tests/homeserver-account-pairing-v1210-contract.mjs

      - name: Verify browser bundle syntax
        run: |
          node --check homeserver-settings-v1210.js
          node --check homeserver-settings-lifecycle-v1200.js
