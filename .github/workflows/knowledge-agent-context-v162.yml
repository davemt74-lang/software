name: Knowledge Agent Context v16.2

on:
  push:
    branches:
      - main
      - phase-16-2-knowledge-agent-context
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Phase 16.2 surfaces
        run: |
          php -l includes/knowledge-retrieval-v162.php
          php -l api/chat-v236.php
          php -l api/chat-stream-v121.php
          php -l tests/knowledge-agent-context-v162-contract.php
          php -l tests/knowledge-agent-context-v162-security-contract.php
      - name: Phase 16.2 behavior contract
        run: php tests/knowledge-agent-context-v162-contract.php
      - name: Phase 16.2 privacy contract
        run: php tests/knowledge-agent-context-v162-security-contract.php
      - name: Knowledge regression contracts
        run: |
          if [ -f tests/knowledge-library-v161-contract.php ]; then php tests/knowledge-library-v161-contract.php; fi
          if [ -f tests/knowledge-library-v161-security-contract.php ]; then php tests/knowledge-library-v161-security-contract.php; fi
          if [ -f tests/shared-knowledge-folders-v313-contract.php ]; then php tests/shared-knowledge-folders-v313-contract.php; fi
