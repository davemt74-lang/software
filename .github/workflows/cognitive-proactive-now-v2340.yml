name: Cognitive Proactive Agent Now v23.40

on:
  pull_request:
    paths:
      - 'docs/VP3_COGNITIVE_PROACTIVE_NOW_V2340.md'
      - 'includes/cognitive-proactive-now-v2340.php'
      - 'includes/cognitive-feed-v530.php'
      - 'includes/cognitive-presentation-v510.php'
      - 'api/extension-cognitive-now-v2120.php'
      - 'chat-cognitive-feed-v530.js'
      - 'chat-cognitive-feed-v530.css'
      - 'chat.php'
      - 'includes/bootstrap.php'
      - 'tests/cognitive-proactive-now-v2340.mjs'
      - '.github/workflows/cognitive-proactive-now-v2340.yml'
  push:
    branches:
      - 'cognitive-proactive-agent-now-v2340'

jobs:
  contract:
    name: Cognitive Proactive Agent Now v23.40 · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/cognitive-proactive-now-v2340.php
          php -l includes/cognitive-feed-v530.php
          php -l includes/cognitive-presentation-v510.php
          php -l api/extension-cognitive-now-v2120.php
          php -l includes/bootstrap.php
          php -l chat.php
      - name: JavaScript syntax
        run: node --check chat-cognitive-feed-v530.js
      - name: v23.40 architecture contract
        run: node tests/cognitive-proactive-now-v2340.mjs
      - name: Retained v23.x audit + cognitive contracts
        run: |
          node tests/cognitive-stack-audit-v23x.mjs
          node tests/cognitive-action-planning-v2330.mjs
          node tests/cognitive-opportunities-v2320.mjs
          node tests/cognitive-priority-queue-v2310.mjs
          node tests/cognitive-operations-v2300.mjs
          node tests/cognitive-runtime-core-v500.mjs
          node tests/cognitive-presentation-v510-contract.mjs
          node tests/cognitive-feed-v530.mjs
          node tests/cognitive-learning-v540.mjs
          node tests/cognitive-planning-v550.mjs
          node tests/cognitive-orchestration-v560.mjs
          node tests/cognitive-memory-v570.mjs
          node tests/browser-companion-cognitive-now-v2120.mjs
          node tests/browser-companion-proactive-notifications-v2140.mjs
