name: Workspace Data Sync
on:
  pull_request:
    paths:
      - 'includes/homeserver-workspace-sync-v1.php'
      - 'api/homeserver-workspace-sync-v1.php'
      - 'api/workspace-data-v1.php'
      - 'workspace-data*'
      - 'includes/main-sidebar.php'
      - 'tests/workspace_sync_v1.php'
      - 'tests/workspace_sync_server.php'
      - '.github/workflows/workspace-sync-v1.yml'
  push:
    branches: [main]
    paths:
      - 'includes/homeserver-workspace-sync-v1.php'
      - 'api/homeserver-workspace-sync-v1.php'
      - 'api/workspace-data-v1.php'
      - 'workspace-data*'
      - 'includes/main-sidebar.php'
      - 'tests/workspace_sync_v1.php'
      - 'tests/workspace_sync_server.php'
      - '.github/workflows/workspace-sync-v1.yml'
permissions:
  contents: read
concurrency:
  group: workspace-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite,mbstring
          coverage: none
      - run: |
          php -l tests/workspace_sync_server.php
          php -l includes/homeserver-workspace-sync-v1.php
          php -l api/homeserver-workspace-sync-v1.php
          php -l api/workspace-data-v1.php
          php -l workspace-data.php
          php -l includes/main-sidebar.php
          node --check workspace-data-v1.js
          php tests/workspace_sync_v1.php
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: workspace-fixture
          MYSQL_DATABASE: workspace
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pworkspace-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring
          coverage: none
      - run: php tests/workspace_sync_v1.php
        env:
          VP3_WORKSPACE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=workspace;charset=utf8mb4
          VP3_WORKSPACE_MYSQL_PASSWORD: workspace-fixture
