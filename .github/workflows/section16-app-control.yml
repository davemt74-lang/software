name: Section 16 Apps and Agent Control
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - run: php tests/apps-control-section16.php
      - run: node tests/system-apps-v290-contract.mjs
      - run: node tests/ci-workflow-consolidation.mjs
