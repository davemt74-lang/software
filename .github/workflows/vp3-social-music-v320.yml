name: VP3 Social + Music Architecture

on:
  pull_request:
  push:
    branches:
      - main
      - feature/vp3-social-music-workspace-20260909
      - feature/music-workspace-resource-ownership-v330

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP lint architecture surfaces
        run: |
          php -l includes/social-network-v320.php
          php -l includes/social-network-v321.php
          php -l includes/plugin-registry-v320.php
          php -l includes/music-workspace-plugin-v320.php
          php -l includes/music-workspace-release-schema-v330.php
          php -l includes/music-workspace-resources-v330.php
          php -l includes/music-workspace-resources-v331.php
          php -l includes/release-workspace-v332.php
          php -l includes/release-agent-v105.php
          php -l includes/release-guard-v105.php
          php -l includes/release-proactive-v105.php
          php -l includes/release-chat-v105.php
          php -l includes/artist-music-v185.php
          php -l includes/member-navigation.php
          php -l includes/permissions.php
          php -l includes/bootstrap.php
          php -l api/messages-v320.php
          php -l api/profile-social-v320.php
          php -l api/team-chat-v109.php
          php -l api/team-chat-v320.php
          php -l plugins.php
          php -l messages.php
          php -l music-workspace.php
          php -l music-library.php
          php -l music-studio.php
          php -l music-releases.php
          php -l setup.php
          php -l upgrade.php

      - name: Social + plugin architecture contract
        run: node tests/vp3-social-music-architecture-v320.mjs

      - name: Music Workspace resource ownership contract
        run: node tests/music-workspace-resource-ownership-v330.mjs

      - name: Legacy release workspace compatibility contract
        run: node tests/release-workspace-compat-v332.mjs
