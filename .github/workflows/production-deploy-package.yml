          test -f _deploy/includes/video-meetings-followthrough-verification-v18200.php
          test -f _deploy/includes/agent-event-infrastructure-v1920.php
          test -f _deploy/api/cognitive-feed-v530.php
          test -f _deploy/api/cognitive-planning-v550.php
          test -f _deploy/api/cognitive-orchestration-v560.php
          test -f _deploy/api/extension-cognitive-now-v2120.php
          test -f _deploy/includes/extension-notifications-v2140.php
          test -f _deploy/api/chat-notifications-brain-v240.php
          test -f _deploy/chat-notifications-drawer-v240.js
          test -f _deploy/chat-cognitive-feed-v530.js
          test -f _deploy/chat-cognitive-feed-v530.css
          test -f _deploy/includes/ai-settings.php
          test -f _deploy/includes/chat-engine.php
          test -f _deploy/includes/chat-agent-policy-v236.php
          test -f _deploy/includes/knowledge-retrieval-v162.php
          test -f _deploy/includes/agent-chat-runtime-v2160.php
          test -f _deploy/includes/cognitive-live-session-v2370.php
          test -f _deploy/includes/bootstrap.php
          test -f _deploy/upgrade.php

          # Production updates must never touch local secrets or user/runtime data.
          test ! -e _deploy/config.php
          test ! -e _deploy/private
          test ! -e _deploy/uploads
          if find _deploy -maxdepth 1 -type f -name '.env*' | grep -q .; then
            echo 'Runtime environment files leaked into the deploy package.' >&2
            exit 1
          fi

          if find _deploy -type f \( -path '*/tests/*' -o -path '*/tools/*' -o -path '*/.github/*' \) | grep -q .; then
            echo 'Development-only files leaked into the deploy package.' >&2
            exit 1
          fi

          (
            cd _deploy
            zip -q -r ../software-deploy.zip .
          )

          unzip -t software-deploy.zip
          echo "Deploy archive size: $(du -h software-deploy.zip | cut -f1)"
          echo "Deploy file count: $(find _deploy -type f | wc -l)"

      - name: Upload directly extractable production deploy
        uses: actions/upload-artifact@v4
        with:
          name: software-production-deploy
          path: _deploy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
