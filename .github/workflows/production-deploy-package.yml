name: Production Deploy Package

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build production deploy archive
        shell: bash
        env:
          VP3_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf _deploy software-deploy.zip
          mkdir _deploy

          rsync -a ./ _deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='config.php' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='private/' \
            --exclude='uploads/' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='_deploy/' \
            --exclude='*.md' \
            --exclude='*.zip'

          cat > _deploy/VP3_RELEASE.json <<EOF
          {
            "release": "VP3 Cloud Production",
            "mission_lifecycle_section": "A5C11",
            "research_section": "R3",
            "capture_routing_section": "R4",
            "project_knowledge_section": "R11",
            "minimum_mission_schema": 79,
            "build": "vp3-cloud-main-${VP3_RELEASE_SHA:0:12}",
            "commit": "${VP3_RELEASE_SHA}",
            "cloud_phone_workspace": "twilio-browser-phone-v1",
            "phone_push_section": "PS5C.4",
            "phone_location_checkins": "location-specialist-v1",
            "phone_shell": "chat-inbox-requests-settings-v1",
            "phone_push_worker_minimum_php": "8.2",
            "phone_push_delivery_default": "off",
            "phone_agent_workspace": "paired-owner-approved-v2",
            "phone_canvas_delivery": "canonical-private-v1",
            "canvas_source_editor": "owner-draft-v1",
            "canvas_live_source": "checkpointed-provider-stream-v1",
            "canvas_workflow_checks": "sample-actions-one-repair-v1",
            "notification_reliability": "semantic-wake-v1",
            "agent_phone_shell": "account-context-v1",
            "phone_call_continuity": "persistent-window-v1",
            "phone_agent_activity": "all-view-background-v1",
            "chat_sidebar_unread": "native-receipts-v1",
            "phone_canvas_loading": "bounded-read-retry-v1",
            "member_transcriptions": "account-bound-library-v1",
            "admin_shell": "standard-header-v1",
            "music_catalog_schema": "music-song-metadata-v1-20261126",
            "music_listening_protocol": "native_listening_v1",
            "music_provider_protocol": "vp3_music_provider_v1",
            "music_provider_schema": "music-provider-v1-20261126",
            "music_provider_upgrade_note": "docs/MUSIC-PROVIDER-DEPLOY.txt",
            "music_source_page_profile": "public_music_pages_v2",
            "music_analytics_protocol": "vp3_music_analytics_v1",
            "music_analytics_period_basis": "session_start_cohort_v1",
            "music_analytics_upgrade_note": "docs/MUSIC-ANALYTICS-DEPLOY.txt",
            "music_listening_totals_protocol": "vp3_music_listening_totals_v1",
            "music_listening_totals_basis": "all_retained_measured_history_v1",
            "music_listening_totals_upgrade_note": "docs/MUSIC-LISTENING-TOTALS-DEPLOY.txt",
            "music_chat_protocol": "vp3_music_chat_v1",
            "music_chat_sources": ["vp3", "youtube"],
            "music_chat_playlists": "owner-private-source-tagged-v1",
            "music_chat_upgrade_note": "docs/MUSIC-CHAT-DEPLOY.txt",
            "music_upgrade_note": "docs/MUSIC-CATALOG-LISTENING-DEPLOY.txt",
            "phone_agent_email_calls": "owner-consented-v1",
            "phone_agent_email_call_delivery_default": "off",
            "gmail_draft_preferences": "owner-reviewed-email-soul-v1",
            "gmail_attachment_understanding": "owner-reviewed-documents-v1",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "tracky_agent_eyes_section": "1G5",
            "tracky_agent_eyes_scene_protocol": "tracky.agent-eyes.shared-scene.v1g3d",
            "tracky_feature_track": "V2.81",
            "tracky_release_section": 3,
            "tracky_federated_automation_protocol": "physical_federated_automation.v1",
            "tracky_federated_automation_execution_enabled": false,
            "tracky_physical_trigger_runtime": true,
            "tracky_distributed_action_execution": true,
            "tracky_golden_operational_scenarios": 24,
            "tracky_recovery_authority": "section7_authoritative_reconciliation",
            "preserve_runtime_paths": ["config.php", ".env", "private/", "uploads/"]
          }
