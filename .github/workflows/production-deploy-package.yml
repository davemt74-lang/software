name: Production Deploy Package

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build production deploy archive
        shell: bash
        env:
          VP3_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf _deploy software-deploy.zip
          mkdir _deploy

          rsync -a ./ _deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='config.php' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='private/' \
            --exclude='uploads/' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='_deploy/' \
            --exclude='*.md' \
            --exclude='*.zip'

          cat > _deploy/VP3_RELEASE.json <<EOF
          {
            "release": "Cognitive Runtime v23.90",
            "build": "vp3-cognitive-domain-integration-release-v2390-20260922",
            "commit": "${VP3_RELEASE_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "preserve_runtime_paths": ["config.php", ".env", "private/", "uploads/"]
          }
          EOF

          test -s _deploy/VP3_RELEASE.json
          python3 -m json.tool _deploy/VP3_RELEASE.json >/dev/null
          grep -Fq '"commit": "'"${VP3_RELEASE_SHA}"'"' _deploy/VP3_RELEASE.json
          test -f _deploy/chat.php
          test -f _deploy/.htaccess

          # v23.90 release hardening: the production artifact must contain
          # the canonical cognitive loop, live-session/event foundation and user surfaces.
          test -f _deploy/includes/cognitive-runtime-v500.php
          test -f _deploy/includes/cognitive-presentation-v510.php
          test -f _deploy/includes/cognitive-cards-v520.php
          test -f _deploy/includes/cognitive-feed-v530.php
          test -f _deploy/includes/cognitive-learning-v540.php
          test -f _deploy/includes/cognitive-planning-v550.php
          test -f _deploy/includes/cognitive-orchestration-v560.php
          test -f _deploy/includes/cognitive-memory-v570.php
          test -f _deploy/includes/cognitive-operations-v2300.php
          test -f _deploy/includes/cognitive-priority-queue-v2310.php
          test -f _deploy/includes/cognitive-opportunities-v2320.php
          test -f _deploy/includes/cognitive-action-planning-v2330.php
          test -f _deploy/includes/cognitive-proactive-now-v2340.php
          test -f _deploy/includes/cognitive-calibration-v2350.php
          test -f _deploy/includes/cognitive-release-v2360.php
          test -f _deploy/includes/cognitive-domain-manifest-v2370.php
          test -f _deploy/includes/cognitive-live-session-v2370.php
          test -f _deploy/includes/cognitive-runtime-session-v2370.php
          test -f _deploy/includes/cognitive-release-v2370.php
          test -f _deploy/includes/cognitive-domain-integration-v2380.php
          test -f _deploy/includes/cognitive-release-v2380.php
          test -f _deploy/includes/cognitive-domain-integration-v2390.php
          test -f _deploy/includes/cognitive-release-v2390.php
          test -f _deploy/includes/agent-event-infrastructure-v1920.php
          test -f _deploy/api/cognitive-feed-v530.php
          test -f _deploy/api/cognitive-planning-v550.php
          test -f _deploy/api/cognitive-orchestration-v560.php
          test -f _deploy/api/extension-cognitive-now-v2120.php
          test -f _deploy/includes/extension-notifications-v2140.php
          test -f _deploy/chat-cognitive-feed-v530.js
          test -f _deploy/chat-cognitive-feed-v530.css
          test -f _deploy/includes/bootstrap.php
          test -f _deploy/upgrade.php

          # Production updates must never touch local secrets or user/runtime data.
          test ! -e _deploy/config.php
          test ! -e _deploy/private
          test ! -e _deploy/uploads
          if find _deploy -maxdepth 1 -type f -name '.env*' | grep -q .; then
            echo 'Runtime environment files leaked into the deploy package.' >&2
            exit 1
          fi

          if find _deploy -type f \( -path '*/tests/*' -o -path '*/tools/*' -o -path '*/.github/*' \) | grep -q .; then
            echo 'Development-only files leaked into the deploy package.' >&2
            exit 1
          fi

          (
            cd _deploy
            zip -q -r ../software-deploy.zip .
          )

          unzip -t software-deploy.zip
          echo "Deploy archive size: $(du -h software-deploy.zip | cut -f1)"
          echo "Deploy file count: $(find _deploy -type f | wc -l)"

      - name: Upload directly extractable production deploy
        uses: actions/upload-artifact@v4
        with:
          name: software-production-deploy
          path: _deploy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
