name: Production Deploy Package

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build production deploy archive
        shell: bash
        env:
          VP3_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf _deploy software-deploy.zip
          mkdir _deploy

          rsync -a ./ _deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='config.php' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='private/' \
            --exclude='uploads/' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='_deploy/' \
            --exclude='*.md' \
            --exclude='*.zip'

          cat > _deploy/VP3_RELEASE.json <<EOF
          {
            "release": "VP3 Cloud Production",
            "build": "vp3-cloud-main-${VP3_RELEASE_SHA:0:12}",
            "commit": "${VP3_RELEASE_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "preserve_runtime_paths": ["config.php", ".env", "private/", "uploads/"]
          }
          EOF

          test -s _deploy/VP3_RELEASE.json
          python3 -m json.tool _deploy/VP3_RELEASE.json >/dev/null
          grep -Fq '"commit": "'"${VP3_RELEASE_SHA}"'"' _deploy/VP3_RELEASE.json
          test -f _deploy/chat.php
          test -f _deploy/.htaccess

          # Campaigns & Rewards V1.26 release hardening: the production artifact must contain
          # the canonical cognitive loop, live-session/event foundation and user surfaces.
          test -f _deploy/includes/cognitive-runtime-v500.php
          test -f _deploy/includes/cognitive-presentation-v510.php
          test -f _deploy/includes/cognitive-cards-v520.php
          test -f _deploy/includes/cognitive-feed-v530.php
          test -f _deploy/includes/cognitive-learning-v540.php
          test -f _deploy/includes/cognitive-planning-v550.php
          test -f _deploy/includes/cognitive-orchestration-v560.php
          test -f _deploy/includes/cognitive-memory-v570.php
          test -f _deploy/includes/cognitive-operations-v2300.php
          test -f _deploy/includes/cognitive-priority-queue-v2310.php
          test -f _deploy/includes/cognitive-opportunities-v2320.php
          test -f _deploy/includes/cognitive-action-planning-v2330.php
          test -f _deploy/includes/cognitive-proactive-now-v2340.php
