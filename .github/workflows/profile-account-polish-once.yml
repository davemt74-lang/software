name: Profile Account Polish Once

on:
  push:
    branches:
      - fix/profile-url-account-theme-20260904
    paths:
      - .github/workflows/profile-account-polish-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-url-account-theme-20260904
          fetch-depth: 0
      - name: Apply final naming and URL display cleanup
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new in replacements:
                  if old not in s: raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
                  s=s.replace(old,new)
              p.write_text(s)

          patch('account.php',[
              ("onsubmit=\"return confirm('Reset your private SOUL.md to the Stonefellow default?');\"", "onsubmit=\"return confirm('Reset your private SOUL.md to the <?= e(system_agent_name()) ?> default?');\""),
              ('Reset to Stonefellow Default','Reset to <?= e(system_agent_name()) ?> Default'),
              ('Your default signed-in Stonefellow workspace.','Your default signed-in <?= e(system_agent_name()) ?> workspace.'),
              ('<strong>Stonefellow Player</strong>','<strong><?= e(system_agent_name()) ?> Player</strong>'),
              ('Open private Stonefellow investor information.','Open private <?= e(system_agent_name()) ?> investor information.'),
          ])

          patch('profile-dashboard.js',[
              ("function render(){const p=state.profile||{},agents=state.agents||[],profileAgentId=Number(p.profile_agent_id||0),systemName=String(state.system_agent_name||'System');panel.innerHTML=",
               "function render(){const p=state.profile||{},agents=state.agents||[],profileAgentId=Number(p.profile_agent_id||0),systemName=String(state.system_agent_name||'System'),profileUrl=String(state.profile_url||state.profile_url_example||'/username'),profileDisplayUrl=new URL(profileUrl,window.location.origin).href;panel.innerHTML="),
              ("esc(state.profile_url||state.profile_url_example||'/username')","esc(profileDisplayUrl)"),
          ])

          patch('voice-profile.php',[
              ('“I’m creating my Stonefellow voice profile. This recording contains my natural speaking voice, pace, tone and pronunciation.”','“I’m creating my <?= e(system_agent_name()) ?> voice profile. This recording contains my natural speaking voice, pace, tone and pronunciation.”'),
              ('value="This is my Stonefellow voice profile."','value="This is my <?= e(system_agent_name()) ?> voice profile."'),
              ('csrf:<?= json_encode(csrf_token()) ?>','csrf:<?= json_encode(csrf_token()) ?>,\n  systemName:<?= json_encode(system_agent_name()) ?>'),
          ])

          patch('voice-profile.js',[
              ("const clean=(value,limit=220)=>String(value??'').replace(/\\s+/g,' ').trim().slice(0,limit);","const clean=(value,limit=220)=>String(value??'').replace(/\\s+/g,' ').trim().slice(0,limit);\n  const systemName=clean(cfg.systemName||'System',80);"),
              ("Recognition consent can be configured now. Provider speaker enrollment remains a separate identity step.","Recognition consent can be configured now. Provider speaker enrollment remains a separate identity step."),
              ("Enable recognition consent when you want Stonefellow to associate a verified provider voice match with your conversational identity.","Enable recognition consent when you want ${systemName} to associate a verified provider voice match with your conversational identity."),
              ("I confirm this selected recording contains my own voice. Create my Stonefellow voice clone and send this sample to ElevenLabs?","I confirm this selected recording contains my own voice. Create my ${systemName} voice clone and send this sample to ElevenLabs?"),
              ("Your Stonefellow voice clone was created.","Your ${systemName} voice clone was created."),
              ("Revoke and permanently delete your Stonefellow voice clone from ElevenLabs? Your private source samples will remain until you delete them.","Revoke and permanently delete your ${systemName} voice clone from ElevenLabs? Your private source samples will remain until you delete them."),
          ])

          test=Path('tests/member-navigation-contract.mjs'); s=test.read_text()
          s=s.replace("const htaccess = read('.htaccess');","const htaccess = read('.htaccess');\nconst voiceProfileJs = read('voice-profile.js');")
          marker="for (const css of [accountAgentCss, profileDashboardCss, accountCss]) { assert.ok(!css.includes('background:#11100f'), 'account surfaces must not contain legacy black card backgrounds'); }"
          extra=marker+"\nassert.ok(!account.includes('Stonefellow'), 'My Account user-facing copy should use the configured system name');\nassert.ok(profileDashboard.includes('profileDisplayUrl=new URL(profileUrl,window.location.origin).href'), 'profile dashboard should display the full canonical domain/username URL');\nassert.ok(!profileDashboard.includes('Stonefellow-powered'), 'Profile Agent copy should use the configured system name');\nassert.ok(voiceProfile.includes('systemName:<?= json_encode(system_agent_name()) ?>'), 'Voice Profile should expose the configured system name to its runtime');\nassert.ok(!voiceProfileJs.includes('Stonefellow voice clone'), 'Voice Profile runtime must not hardcode the system name');\nassert.ok(accountCss.includes('#agent-brain .agent-brain-tool-grid>a'), 'Agent Brain tool cards should be explicitly covered by the light account theme');"
          if marker not in s: raise SystemExit('test marker missing')
          test.write_text(s.replace(marker,extra))
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/profile-account-polish-once.yml
          git config user.name davemt74-lang
          git config user.email davemt74@gmail.com
          git add account.php profile-dashboard.js voice-profile.php voice-profile.js tests/member-navigation-contract.mjs account.css
          git commit -m "Finish profile URL display and account naming cleanup"
          git push origin HEAD:fix/profile-url-account-theme-20260904
