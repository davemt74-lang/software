name: Transcription Knowledge Save v3.14

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
    paths:
      - 'api/transcription-knowledge-save-v314.php'
      - 'transcription-knowledge-folders-v313.js'
      - 'artist-listening-naming.js'
      - 'knowledge.php'
      - 'includes/knowledge.php'
      - 'includes/artist-listening.php'
      - 'tests/transcription-knowledge-save-v314-contract.mjs'
      - '.github/workflows/transcription-knowledge-save-v314.yml'
  push:
    branches: [main]
    paths:
      - 'api/transcription-knowledge-save-v314.php'
      - 'transcription-knowledge-folders-v313.js'
      - 'artist-listening-naming.js'
      - 'knowledge.php'
      - 'includes/knowledge.php'
      - 'includes/artist-listening.php'
      - 'tests/transcription-knowledge-save-v314-contract.mjs'
      - '.github/workflows/transcription-knowledge-save-v314.yml'

jobs:
  transcription-knowledge-save:
    name: transcription knowledge save (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: php -l api/transcription-knowledge-save-v314.php
      - name: JavaScript syntax
        run: node --check transcription-knowledge-folders-v313.js
      - name: Contract
        run: node tests/transcription-knowledge-save-v314-contract.mjs
