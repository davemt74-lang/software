name: Profile Agent Portal Patch

on:
  push:
    branches:
      - fix/profile-agent-state-20260905
    paths:
      - .github/workflows/profile-agent-portal-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-agent-state-20260905
          fetch-depth: 0
      - name: Patch canonical Profile Agent ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text()
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:90]!r}')
              p.write_text(text.replace(old,new,count))

          replace(
              'includes/profile-agent.php',
              "if(!$agent||empty($agent['is_active'])||empty($agent['is_profile_agent']))return null;",
              "if(!$agent||empty($agent['is_active']))return null;"
          )

          replace(
              'includes/user-agent-system-v236.php',
              "$isDefault=!empty($input['is_default']);$isProfile=!empty($input['is_profile_agent']);",
              "$isDefault=!empty($input['is_default']);$isProfile=array_key_exists('is_profile_agent',$input)?!empty($input['is_profile_agent']):!empty($before['is_profile_agent']);"
          )

          replace(
              'account-agent-settings-v236.js',
              '        <label><input type="checkbox" name="is_profile_agent" value="1"><span>Profile agent</span></label>\n',
              ''
          )
          replace(
              'account-agent-settings-v236.js',
              "el.form.elements.is_profile_agent.checked=!!Number(agent?.is_profile_agent||0);",
              ''
          )
          replace(
              'account-agent-settings-v236.js',
              "is_default:f.has('is_default'),is_profile_agent:f.has('is_profile_agent'),voice_enabled:f.has('voice_enabled'),is_active:f.has('is_active')",
              "is_default:f.has('is_default'),voice_enabled:f.has('voice_enabled'),is_active:f.has('is_active')"
          )

          replace(
              'profile.php',
              "$displayName.' on Stonefellow'",
              "$displayName.' on '.system_agent_name()"
          )
          replace(
              'profile.php',
              '<span class="profile-brand-mark">S</span>',
              '<span class="profile-brand-mark"><?= e(mb_strtoupper(mb_substr(system_agent_name(),0,1))) ?></span>'
          )
          replace(
              'profile.php',
              '<a href="<?= e(url(\'/account.php#profile-agent\')) ?>">My Account</a>',
              '<a href="<?= e(url(\'/profile-agent.php\')) ?>">Profile Agent</a>'
          )
          replace(
              'profile.php',
              '<a href="<?= e(url(\'/account.php#profile-agent\')) ?>">Back to Profile Agent settings</a>',
              '<a href="<?= e(url(\'/profile-agent.php\')) ?>">Back to Profile Agent</a>'
          )
          PY

          git config user.name "davemt74-lang"
          git config user.email "davemt74@gmail.com"
          git add includes/profile-agent.php includes/user-agent-system-v236.php account-agent-settings-v236.js profile.php
          git diff --cached --check
          git commit -m "Make Profile Agent portal the public service authority"
          git push origin HEAD:fix/profile-agent-state-20260905
