name: Cloud User LLM BYOK v1
on:
  pull_request:
    paths:
      - 'includes/user-llm-v1.php'
      - 'api/user-llm-v1.php'
      - 'settings-ai-providers.php'
      - 'includes/ai-settings.php'
      - 'includes/ai-stream-v121.php'
      - 'includes/bootstrap.php'
      - 'includes/agent-runtime-routing-v420.php'
      - 'api/chat-stream-v121.php'
      - 'settings-homeserver.php'
      - 'tests/user-llm-v1.php'
      - 'tests/cloud-user-llm-v1-contract.cjs'
      - '.github/workflows/cloud-user-llm-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-user-llm-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, sodium, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          php -l includes/user-llm-v1.php
          php -l api/user-llm-v1.php
          php -l settings-ai-providers.php
          php -l includes/ai-settings.php
          php -l includes/ai-stream-v121.php
          php -l includes/agent-runtime-routing-v420.php
          php -l api/chat-stream-v121.php
      - name: BYOK and subscription route boundaries
        run: node tests/cloud-user-llm-v1-contract.cjs
  mysql-account-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: llm_test
          MYSQL_USER: llm
          MYSQL_PASSWORD: llm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, sodium, pdo_mysql
      - name: Encrypted account isolation and fail-closed routing
        run: php -d zend.assertions=1 -d assert.exception=1 tests/user-llm-v1.php
