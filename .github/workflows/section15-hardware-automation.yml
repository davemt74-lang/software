name: Section 15 Hardware and Device Automation

on:
  pull_request:
    paths:
      - 'includes/homeserver-governed-actions-v233.php'
      - 'tests/hardware_automation_section15.php'
      - '.github/workflows/section15-hardware-automation.yml'
  push:
    branches: [main]
    paths:
      - 'includes/homeserver-governed-actions-v233.php'
      - 'tests/hardware_automation_section15.php'
      - '.github/workflows/section15-hardware-automation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section15-hardware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  device-approvals:
    name: Device approval receipts · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Device approval receipt behavior and retained bridge
        run: |
          php -l includes/homeserver-governed-actions-v233.php
          php -d zend.assertions=1 -d assert.exception=1 tests/hardware_automation_section15.php
          php -d zend.assertions=1 -d assert.exception=1 tests/homeserver-v233-governed-actions-unit.php
          node tests/homeserver-v233-governed-actions-contract.mjs
