name: Browser Companion Simple Login v21.00

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - simplify-extension-device-token-auth-v2100

permissions:
  contents: read

jobs:
  contract:
    name: Simple Login · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained Browser Companion auth contracts
        run: |
          node tests/extension-device-auth-v2000.mjs
          node tests/extension-device-auth-v2001.mjs
      - name: Browser Companion v21 simple login contract
        run: node tests/extension-device-token-v2100.mjs
      - name: Browser Companion regression contract
        run: node tests/browser-companion-v2030.mjs
      - name: JavaScript syntax
        run: |
          node --check browser-companion/background.js
          node --check browser-companion/sidepanel.js
          node --check browser-companion/options.js
          node --check tests/extension-device-token-v2100.mjs
          node --check tests/browser-companion-v2030.mjs
      - name: PHP syntax
        run: |
          php -l includes/extension-device-token-v2100.php
          php -l includes/extension-device-auth-v2001.php
          php -l api/extension-token.php
          php -l api/extension-me.php
          php -l api/extension-device-disconnect-v2030.php
          php -l extension-connect.php
          php -l includes/bootstrap.php
          php -l upgrade.php

  package:
    name: Build simple-login deploy packages
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build stable ZIPs
        run: |
          rm -rf dist
          mkdir -p dist/server
          (
            cd browser-companion
            zip -r ../dist/vp3-browser-companion-extension.zip . -x '*.DS_Store'
          )
          unzip -t dist/vp3-browser-companion-extension.zip
          unzip -Z1 dist/vp3-browser-companion-extension.zip | grep -qx 'manifest.json'
          mkdir -p dist/server/api dist/server/includes dist/server/browser-companion
          cp api/extension-token.php dist/server/api/
          cp api/extension-me.php dist/server/api/
          cp api/extension-device-disconnect-v2030.php dist/server/api/
          cp includes/extension-device-token-v2100.php dist/server/includes/
          cp includes/extension-device-auth-v2001.php dist/server/includes/
          cp includes/bootstrap.php dist/server/includes/
          cp extension-connect.php upgrade.php dist/server/
          cp -R browser-companion/. dist/server/browser-companion/
          cat > dist/server/DEPLOY.txt <<'EOF'
          VP3 Browser Companion Simple Login v21.00

          Extract into the VP3 application root and overwrite the included files.
          Then sign in as owner/admin and run upgrade.php once.

          Chrome:
          - Use vp3-browser-companion-extension.zip for Load unpacked/extracted testing.
          - The extension connects through normal VP3 login and stores one revocable device token.
          EOF
          (
            cd dist/server
            zip -r ../vp3-browser-companion-deploy.zip .
          )
          unzip -t dist/vp3-browser-companion-deploy.zip
          sha256sum dist/vp3-browser-companion-extension.zip > dist/vp3-browser-companion-extension.zip.sha256
          sha256sum dist/vp3-browser-companion-deploy.zip > dist/vp3-browser-companion-deploy.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vp3-browser-companion-simple-login
          path: |
            dist/vp3-browser-companion-extension.zip
            dist/vp3-browser-companion-extension.zip.sha256
            dist/vp3-browser-companion-deploy.zip
            dist/vp3-browser-companion-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30
