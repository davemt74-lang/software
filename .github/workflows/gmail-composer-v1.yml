name: Gmail Composer and Styled Email

on:
  pull_request:
    paths:
      - 'phone-agent-*'
      - 'phone-location*'
      - 'phone-push-*'
      - 'includes/phone-*'
      - 'api/phone-*'
      - 'includes/agent-image-generation-v1.php'
      - 'agent-worker-v1910.php'
      - 'setup.php'
      - 'upgrade.php'
      - 'tests/phone-agent-workspace-*'
      - '*gmail*'
      - '*email*'
      - 'chat.js'
      - 'chat.php'
      - 'agent-activity-hub-v1.js'
      - 'agent-activity-hub-v1.css'
      - 'agent-top-of-mind-v1.js'
      - 'api/chat-email-v1.php'
      - 'api/agent-email-calls-v1.php'
      - 'includes/agent-orb.php'
      - 'includes/agent-operator-*.php'
      - 'phone-operator-schedule-worker.php'
      - 'tests/fixtures/phone-agent-email-call-*'
      - 'tests/fixtures/agent-email-preferences-*'
      - 'includes/*gmail*'
      - 'includes/*email*'
      - 'includes/agent-connections-v1.php'
      - 'includes/agent-chat-runtime-v2160.php'
      - 'includes/agent-capability-awareness-v1.php'
      - 'includes/agent-surface-context-v131.php'
      - 'includes/agent-top-of-mind-v1.php'
      - 'includes/agent-activity-hub-v1.php'
      - 'includes/homeserver-agent-v025.php'
      - 'includes/ai-settings.php'
      - 'includes/agent-tool-json-v1.php'
      - 'includes/agent-initiative-model-v1.php'
      - 'includes/agent-brain-soul-v1.php'
      - 'tests/agent-brain-soul-v1.php'
      - 'tests/*gmail*'
      - 'tests/*email*'
      - 'tests/agent-top-of-mind-session-http.mjs'
      - 'tests/agent-top-of-mind-followthrough-v1.mjs'
      - 'tests/agent-initiative-model-v1.php'
      - 'tests/profile-owner-drafts-provider-v1.php'
      - 'tests/paired-phone-provider-v1.php'
      - 'tests/fixtures/gmail-email-display-v1.php'
      - '.github/workflows/gmail-composer-v1.yml'
  push:
    branches: [main]
    paths:
      - 'phone-agent-*'
      - 'phone-location*'
      - 'phone-push-*'
      - 'includes/phone-*'
      - 'api/phone-*'
      - 'includes/agent-image-generation-v1.php'
      - 'agent-worker-v1910.php'
      - 'setup.php'
      - 'upgrade.php'
      - 'tests/phone-agent-workspace-*'
      - '*gmail*'
      - '*email*'
      - 'chat.js'
      - 'chat.php'
      - 'agent-activity-hub-v1.js'
      - 'agent-activity-hub-v1.css'
      - 'agent-top-of-mind-v1.js'
      - 'api/chat-email-v1.php'
      - 'api/agent-email-calls-v1.php'
      - 'includes/agent-orb.php'
      - 'includes/agent-operator-*.php'
      - 'phone-operator-schedule-worker.php'
      - 'tests/fixtures/phone-agent-email-call-*'
      - 'tests/fixtures/agent-email-preferences-*'
      - 'includes/*gmail*'
      - 'includes/*email*'
      - 'includes/agent-connections-v1.php'
      - 'includes/agent-chat-runtime-v2160.php'
      - 'includes/agent-capability-awareness-v1.php'
      - 'includes/agent-surface-context-v131.php'
      - 'includes/agent-top-of-mind-v1.php'
      - 'includes/agent-activity-hub-v1.php'
      - 'includes/homeserver-agent-v025.php'
      - 'includes/ai-settings.php'
      - 'includes/agent-tool-json-v1.php'
      - 'includes/agent-initiative-model-v1.php'
      - 'includes/agent-brain-soul-v1.php'
      - 'tests/agent-brain-soul-v1.php'
      - 'tests/*gmail*'
      - 'tests/*email*'
      - 'tests/agent-top-of-mind-session-http.mjs'
      - 'tests/agent-top-of-mind-followthrough-v1.mjs'
      - 'tests/agent-initiative-model-v1.php'
      - 'tests/profile-owner-drafts-provider-v1.php'
      - 'tests/paired-phone-provider-v1.php'
      - 'tests/fixtures/gmail-email-display-v1.php'
      - '.github/workflows/gmail-composer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gmail-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gmail-fixture
          MYSQL_DATABASE: gmail_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pgmail-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      VP3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=gmail_fixture;charset=utf8mb4
      VP3_TEST_MYSQL_USER: root
      VP3_TEST_MYSQL_PASS: gmail-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, curl, fileinfo
          coverage: none
      - name: Review queue, draft lifecycle, private attachments, and styled content
        run: |
          php tests/agent-email-followthrough-mysql.php
          php tests/agent-email-followthrough-source-v1.php
          php tests/agent-email-followthrough-draft-notice-v1.php
          php tests/agent-gmail-followthrough-context-v1.php
          php tests/agent-email-review-queue-v1.php
          php tests/agent-email-sent-v1.php
          php tests/agent-gmail-workspace-context-v1.php
          php tests/agent-gmail-homeserver-context-v1.php
          php tests/agent-email-composer-v1.php
          php tests/agent-email-attachments-v1.php
          php tests/agent-email-display-v1.php
      - name: Explicit draft writing preferences, private revisions and publication recovery
        run: |
          php tests/agent-brain-soul-v1.php
          php tests/agent-email-preferences-v1.php
          php tests/agent-email-preferences-provider-v1.php
          for file in includes/agent-email-preferences-*.php; do php -l "$file"; done
      - name: Explicit attachment understanding, original bytes, private scope and provider accounting
        run: |
          php tests/agent-gmail-documents-v1.php
          php tests/agent-gmail-documents-provider-v1.php
          for file in includes/agent-gmail-document*.php api/gmail-documents-v1.php; do php -l "$file"; done
      - name: Private Phone Agent enrollment, native sources, receipts and background push
        run: |
          for file in tests/phone-agent-workspace-*.php; do php "$file"; done
          for file in includes/phone-agent-workspace-*.php includes/phone-agent-device-grants-v1.php includes/coding-canvas-phone-v1.php api/phone-agent-workspace-v1.php api/phone-location-v1.php phone-location.php; do php -l "$file"; done
      - name: Existing Gmail send, writing, provider and inference boundaries
        run: |
          php tests/agent-connections-gmail-v1.php
          php tests/agent-connection-email-writing-v1.php
          php tests/agent-connection-gmail-v1.php
          php tests/agent-connection-gmail-inbox-initial-summary-v1.php
          php tests/profile-owner-drafts-provider-v1.php
          php tests/paired-phone-provider-v1.php
          php tests/agent-initiative-model-v1.php
      - name: Owner email-call consent, canonical sources, native Operator and exact voice review
        run: |
          for file in tests/phone-agent-email-call*.php; do php "$file"; done
          php tests/agent-operator-owner-email-v1.php
          for file in includes/phone-agent-email-call*.php includes/agent-operator-owner-email-v1.php api/agent-email-calls-v1.php; do php -l "$file"; done
      - name: PHP syntax and production entry points
        run: |
          for file in includes/agent-email-followthrough-v1.php includes/agent-email-followthrough-source-v1.php includes/agent-email-followthrough-draft-v1.php includes/agent-email-followthrough-notice-v1.php includes/agent-email-followthrough-status-v1.php; do
            php -l "$file"
          done
          for file in api/chat-email-v1.php includes/agent-email-review-queue-v1.php includes/agent-email-sent-v1.php includes/agent-gmail-workspace-context-v1.php includes/agent-email-composer-v1.php includes/agent-coordination-gmail-draft-v1.php includes/agent-email-attachments-v1.php includes/agent-email-display-v1.php includes/agent-connection-email-chat-v1.php includes/agent-connection-email-followup-v1.php includes/agent-connection-gmail-inbox-initial-v1.php includes/agent-connection-gmail-v1.php includes/agent-connections-v1.php includes/agent-capability-awareness-v1.php includes/agent-surface-context-v131.php includes/agent-top-of-mind-v1.php includes/agent-activity-hub-v1.php includes/homeserver-agent-v025.php includes/ai-settings.php includes/agent-chat-runtime-v2160.php chat.php; do
            php -l "$file"
          done
  gmail-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VP3_EMAIL_COMPOSER_SCREENSHOT: artifacts/gmail-composer-phone.png
      VP3_EMAIL_DISPLAY_SCREENSHOTS: artifacts/email-display
      VP3_EMAIL_REVIEW_SCREENSHOT_DIR: artifacts/email-review
      VP3_GMAIL_SENT_SCREENSHOT_DIR: artifacts/gmail-sent
      VP3_GMAIL_FOLLOWTHROUGH_SCREENSHOT_DIR: artifacts/gmail-followthrough
      VP3_PHONE_AGENT_SCREENSHOT_DIR: artifacts/phone-agent
      VP3_EMAIL_CALLS_SCREENSHOT_DIR: artifacts/email-calls
      VP3_EMAIL_WRITING_SCREENSHOT_DIR: artifacts/email-writing
      VP3_GMAIL_DOCUMENTS_SCREENSHOT_DIR: artifacts/gmail-documents
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          bash tools/install-ci-chromium.sh
      - name: Popup and canvas compose, image attachments, draft recovery, and send states
        run: node tests/chat-email-composer-browser.mjs
      - name: Owner-reviewed writing preferences, history, conflicts and dirty navigation
        run: |
          node tests/email-writing-preferences-state-v1.mjs
          node tests/email-writing-preferences-browser-v1.mjs
      - name: Attachment summaries, source pages, explicit replies, Phone scope and responsive review
        run: node tests/gmail-documents-browser-v1.mjs
      - name: Response deadlines, verified outcomes, pause, resolve and follow-up review
        run: node tests/gmail-followthrough-browser.mjs
      - name: Connected Phone Agent native review, dirty navigation, private canvases and push targets
        run: |
          node tests/agent-email-call-settings-state-v1.mjs
          node tests/agent-email-call-settings-browser-v1.mjs
          node tests/phone-agent-workspace-state-v1.mjs
          node tests/phone-agent-workspace-browser-v1.mjs
          node tests/phone-agent-paired-http-v1.mjs
      - name: Selected email instructions and private Chat recovery
        run: |
          node tests/chat-send-recovery.mjs
          node tests/chat-email-review-queue-browser.mjs
          node tests/agent-top-of-mind-session-http.mjs
          node tests/agent-top-of-mind-followthrough-v1.mjs
      - name: Formatted private email, styles, links, image controls, and phone layout
        run: node tests/gmail-email-display-browser.mjs
      - name: Visible draft entry and live Gmail Sent mailbox
        run: node tests/gmail-sent-browser.mjs
      - name: Existing Gmail specialist and inbox reader regression
        run: |
          node tests/chat-email-specialist-browser.mjs
          node tests/gmail-inbox-initial-ui-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmail-composer-and-email-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
