name: Temporary Chat Surface Audit Fix

on:
  push:
    branches:
      - fix/chat-remove-brown-theme

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[chat-surface-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-remove-brown-theme
          fetch-depth: 0
      - name: Enforce light non-modal Chat surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('chat.css')
          css=p.read_text()
          rule_re=re.compile(r'(?P<selector>[^{}]+)\{(?P<body>[^{}]*)\}')
          bg_re=re.compile(r'(?P<prop>background(?:-color)?\s*:\s*)(?P<value>[^;}]+)',re.I)
          color_token=re.compile(r'#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)',re.I)

          exempt_backdrops=(
            '.chat-sidebar-backdrop',
            '.chat-create-modal-backdrop',
            '.chat-player-overlay-backdrop',
            '.chat-queue-overlay',
            '.chat-playlist-overlay',
          )
          exempt_media=(' video','video',' canvas','canvas','waveform')
          exempt_primary=(
            '.chat-composer button',
            '.chat-player-toggle',
            '.chat-now-playing-transport button.primary',
          )

          def parse(token):
            token=token.strip().lower()
            if token.startswith('#'):
              h=token[1:]
              if len(h)==3: h=''.join(c*2 for c in h)
              if len(h)<6: return None
              return tuple(int(h[i:i+2],16) for i in (0,2,4))
            m=re.match(r'rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)',token)
            return tuple(map(int,m.groups())) if m else None

          def luma(rgb):
            r,g,b=rgb
            return (.2126*r+.7152*g+.0722*b)/255

          def is_exempt(selector):
            s=selector.lower()
            if any(x in s for x in exempt_backdrops): return True
            if any(x in s for x in exempt_media): return True
            if any(x in s for x in exempt_primary): return True
            return False

          def transform_rule(m):
            selector=m.group('selector')
            body=m.group('body')
            if is_exempt(selector):
              return selector+'{'+body+'}'

            changed=False
            def transform_bg(bm):
              nonlocal changed
              value=bm.group('value')
              def repl(tm):
                nonlocal changed
                rgb=parse(tm.group(0))
                if rgb and luma(rgb)<.32:
                  changed=True
                  # Gradients stay subtle instead of collapsing their layout.
                  return '#ffffff'
                return tm.group(0)
              value=color_token.sub(repl,value)
              return bm.group('prop')+value
            body=bg_re.sub(transform_bg,body)

            if changed:
              # If this same surface owned recovered light text, restore contrast.
              body=re.sub(r'color\s*:\s*#(?:fff(?:fff)?|eee(?:eee)?|ddd(?:ddd)?|f[0-9a-f]{5}|e[0-9a-f]{5})\b','color:#111827',body,flags=re.I)
            return selector+'{'+body+'}'

          for _ in range(3):
            css=rule_re.sub(transform_rule,css)

          # Feature art is content, but its recovered dark scrim was an old theme
          # surface. Make it a light legibility scrim for dark copy.
          css=re.sub(
            r'(\.chat-player-feature-overlay\s*\{[^{}]*?)background\s*:\s*.*?;',
            r'\1background:linear-gradient(90deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.78) 46%,rgba(255,255,255,.18) 82%),linear-gradient(0deg,rgba(255,255,255,.72),transparent 58%);',
            css,
            flags=re.S
          )
          css=css.replace('filter:brightness(.62) saturate(.8) sepia(.08);','filter:brightness(.94) saturate(.92);')

          # Final audit: no dark background token survives on a normal Chat UI rule.
          failures=[]
          for m in rule_re.finditer(css):
            selector=m.group('selector').strip()
            if is_exempt(selector): continue
            for bm in bg_re.finditer(m.group('body')):
              for tm in color_token.finditer(bm.group('value')):
                rgb=parse(tm.group(0))
                if rgb and luma(rgb)<.32:
                  failures.append(f'{selector[:100]} -> {bm.group("value")[:100]}')
          if failures:
            raise SystemExit('dark non-exempt Chat backgrounds remain:\n'+'\n'.join(failures[:30]))

          p.write_text(css)
          Path('.github/workflows/tmp-chat-surface-audit-fix.yml').unlink()
          print('CHAT_SURFACE_AUDIT=PASS')
          PY
      - name: Focused contracts
        run: |
          node tests/chat-light-source-contract.mjs
          php -l chat.php
          php -l chat-legacy-v108.php
      - name: Commit final surface cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce light Chat surfaces at source [chat-surface-clean]"
          git push origin HEAD:fix/chat-remove-brown-theme
