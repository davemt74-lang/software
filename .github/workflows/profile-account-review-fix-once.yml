name: Profile Account Review Fix Once

on:
  push:
    branches:
      - fix/profile-url-account-theme-20260904
    paths:
      - .github/workflows/profile-account-review-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-url-account-theme-20260904
          fetch-depth: 0
      - name: Fix reviewed interpolation and inline confirmation
        shell: python
        run: |
          from pathlib import Path

          p=Path('voice-profile.js'); s=p.read_text()
          replacements=[
            ("el.recognitionCopy.textContent='Enable recognition consent when you want ${systemName} to associate a verified provider voice match with your conversational identity.';", "el.recognitionCopy.textContent=`Enable recognition consent when you want ${systemName} to associate a verified provider voice match with your conversational identity.`;"),
            ("window.confirm('I confirm this selected recording contains my own voice. Create my ${systemName} voice clone and send this sample to ElevenLabs?')", "window.confirm(`I confirm this selected recording contains my own voice. Create my ${systemName} voice clone and send this sample to ElevenLabs?`)"),
            ("showNotice('Your ${systemName} voice clone was created.');", "showNotice(`Your ${systemName} voice clone was created.`);"),
            ("window.confirm('Revoke and permanently delete your ${systemName} voice clone from ElevenLabs? Your private source samples will remain until you delete them.')", "window.confirm(`Revoke and permanently delete your ${systemName} voice clone from ElevenLabs? Your private source samples will remain until you delete them.`)"),
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit(f'Missing Voice Profile interpolation target: {old}')
              s=s.replace(old,new)
          p.write_text(s)

          p=Path('account.php'); s=p.read_text()
          old="onsubmit=\"return confirm('Reset your private SOUL.md to the <?= e(system_agent_name()) ?> default?');\""
          new="onsubmit=\"return confirm(<?= e(json_encode('Reset your private SOUL.md to the ' . system_agent_name() . ' default?', JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES)) ?>);\""
          if old not in s: raise SystemExit('Missing SOUL reset confirmation target')
          p.write_text(s.replace(old,new))

          p=Path('tests/member-navigation-contract.mjs'); s=p.read_text()
          old_namespace="assert.ok(!profileAgent.includes('STONEFELLOW_PROFILE_NAMESPACE'), 'profile URL generation must not retain a Stonefellow namespace');"
          new_namespace="assert.ok(!profileAgent.includes('const STONEFELLOW_PROFILE_NAMESPACE'), 'profile URL generation must not retain a Stonefellow namespace declaration');"
          if old_namespace not in s: raise SystemExit('Missing namespace regression assertion')
          s=s.replace(old_namespace,new_namespace)
          marker="assert.ok(!voiceProfileJs.includes('Stonefellow voice clone'), 'Voice Profile runtime must not hardcode the system name');"
          extra=marker+"\nassert.ok(voiceProfileJs.includes('`Your ${systemName} voice clone was created.`'), 'Voice Profile dynamic system name must use template interpolation');\nassert.ok(!voiceProfileJs.includes(\"'Your ${systemName} voice clone was created.'\"), 'Voice Profile must not render a literal ${systemName} token');"
          if marker not in s: raise SystemExit('Missing Voice Profile branding test marker')
          p.write_text(s.replace(marker,extra))
      - name: Run focused navigation contract
        run: node tests/member-navigation-contract.mjs
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/profile-account-review-fix-once.yml
          git config user.name davemt74-lang
          git config user.email davemt74@gmail.com
          git add voice-profile.js account.php tests/member-navigation-contract.mjs
          git commit -m "Harden dynamic system name rendering"
          git push origin HEAD:fix/profile-url-account-theme-20260904
