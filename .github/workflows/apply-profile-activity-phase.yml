name: Apply Profile Activity Phase
on:
  push:
    branches: [feature/profile-activity-chat-canvas-20260905]
    paths:
      - .github/workflows/apply-profile-activity-phase.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-activity-chat-canvas-20260905
      - name: Apply integration patch
        run: python3 tools/apply_profile_activity_phase.py
      - name: Focused validation
        run: |
          php -l includes/profile-agent.php
          php -l includes/profile-agent-runtime.php
          php -l includes/chat-agent-policy-v236.php
          php -l chat.php
          php -l api/member-notifications.php
          node tests/profile-activity-chat-contract.mjs
          node tests/profile-agent-attention-contract.mjs
          node tests/member-navigation-contract.mjs
      - name: Commit application changes and remove one-time patcher
        run: |
          rm tools/apply_profile_activity_phase.py
          rm .github/workflows/apply-profile-activity-phase.yml
          git config user.name "davemt74-lang"
          git config user.email "davemt74@gmail.com"
          git add -A
          git commit -m "Integrate Profile Activity with Agent Chat"
          git push origin HEAD:feature/profile-activity-chat-canvas-20260905
