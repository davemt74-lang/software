name: Chat Recording Playback v2.43

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recording playback contract
        run: node tests/chat-recording-playback-contract.mjs
      - name: PHP syntax
        run: |
          php -l api/artist-listening.php
          php -l api/artist-listening-v172.php
          php -l includes/artist-listening.php
          php -l includes/artist-recording-playback-v243.php
