name: Profile Cleanup v1.74

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l profile.php
          php -l profile-v900.php
          php -l api/profile-media.php
          php -l includes/profile-public-media-v174.php
      - name: JavaScript contract syntax
        run: |
          node --check tests/profile-cleanup-v174-contract.mjs
          node --check tests/profile-commerce-v900-contract.mjs
      - name: Profile cleanup contracts
        run: |
          node tests/profile-cleanup-v174-contract.mjs
          node tests/profile-commerce-v900-contract.mjs
