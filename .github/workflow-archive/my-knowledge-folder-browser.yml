name: My Knowledge Folder Browser

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l knowledge.php
          php -l tests/shared-knowledge-folders-v313-contract.php
          php -l tests/agent-ui-v034-contract.php
      - name: JavaScript syntax
        run: |
          node --check knowledge-library-v161.js
          node --check tests/knowledge-library-v161-browser-contract.mjs
          node --check tests/member-shell-v1320-contract.mjs
          node --check tests/member-sidebar-shell-contract.mjs
          node --check tests/profile-commerce-products-shell-v1310-contract.mjs
          node --check tests/main-feed-canonical-ui-contract.mjs
          node --check tests/profile-visitor-crm-v243.mjs
          node --check tests/account-scope-v181.mjs
      - name: Knowledge folder-browser contract
        run: node tests/knowledge-library-v161-browser-contract.mjs
      - name: Shared Knowledge folder regression contract
        run: php tests/shared-knowledge-folders-v313-contract.php
      - name: Retained Agent UI contract
        run: php tests/agent-ui-v034-contract.php
      - name: Retained Main Feed shell contract
        run: node tests/main-feed-canonical-ui-contract.mjs
      - name: Retained visitor CRM and account scope contracts
        run: |
          node tests/profile-visitor-crm-v243.mjs
          node tests/account-scope-v181.mjs
      - name: Retained member shell contracts
        run: |
          node tests/member-shell-v1320-contract.mjs
          node tests/member-sidebar-shell-contract.mjs
          node tests/profile-commerce-products-shell-v1310-contract.mjs
      - name: Retained authenticated shell consolidation contract
        run: node tests/authenticated-shell-consolidation-contract.mjs
      - name: Retained VP3 normalization contract
        run: node tests/authenticated-shell-vp3-normalization-contract.mjs
      - name: Retained authenticated VP3 runtime cleanup contract
        run: node tests/authenticated-vp3-runtime-cleanup-contract.mjs
      - name: Retained profile runtime resilience contract
        run: node tests/profile-runtime-resilience-contract.mjs
