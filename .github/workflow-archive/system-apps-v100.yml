name: System Apps V1

on:
  pull_request:
    paths:
      - "includes/system-apps-v100.php"
      - "api/system-apps-v100.php"
      - "apps.php"
      - "system-apps-v100.css"
      - "includes/member-navigation.php"
      - "includes/main-sidebar.php"
      - "tests/system-apps-v100-*"
      - ".github/workflows/system-apps-v100.yml"
  push:
    branches: [main]
    paths:
      - "includes/system-apps-v100.php"
      - "api/system-apps-v100.php"
      - "apps.php"
      - "system-apps-v100.css"
      - "includes/member-navigation.php"
      - "includes/main-sidebar.php"
      - "tests/system-apps-v100-*"
      - ".github/workflows/system-apps-v100.yml"

concurrency:
  group: system-apps-v100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  system-apps:
    name: System Apps · PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_system_apps_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql,mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP lint
        run: |
          php -l includes/system-apps-v100.php
          php -l api/system-apps-v100.php
          php -l apps.php
          php -l includes/member-navigation.php
          php -l includes/main-sidebar.php
          php -l tests/system-apps-v100-mysql.php
      - name: Architecture contract
        run: node tests/system-apps-v100-contract.mjs
      - name: MySQL ownership integration
        env:
          VP3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_system_apps_test;charset=utf8mb4
          VP3_TEST_MYSQL_USER: root
          VP3_TEST_MYSQL_PASS: root
        run: php tests/system-apps-v100-mysql.php
