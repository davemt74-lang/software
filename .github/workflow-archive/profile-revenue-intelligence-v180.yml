name: Profile Revenue Intelligence v1.80

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-file: production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP syntax
        run: |
          php -l includes/profile-revenue-intelligence-v180.php
          php -l api/profile-revenue-intelligence.php
      - name: JavaScript syntax
        run: |
          node --check profile-agent-analytics.js
          node --check tests/profile-revenue-intelligence-v180-contract.mjs
      - name: Profile revenue intelligence contract
        run: node tests/profile-revenue-intelligence-v180-contract.mjs
