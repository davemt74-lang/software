name: Agent Chat Intelligence v17.1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l chat.php
          php -l home.php
          php -l includes/agent-chat-intelligence-v171.php
          php -l includes/main-sidebar.php
      - name: JavaScript syntax
        run: |
          node --check chat-agent-intelligence-v171.js
          node --check tests/agent-chat-intelligence-v171-contract.mjs
          node --check tests/agent-home-command-center-contract.mjs
      - name: Agent Chat Intelligence contract
        run: node tests/agent-chat-intelligence-v171-contract.mjs
      - name: Home compatibility contract
        run: node tests/agent-home-command-center-contract.mjs
      - name: Retained canonical Chat and shell contracts
        run: |
          node tests/main-feed-canonical-ui-contract.mjs
          node tests/authenticated-shell-consolidation-contract.mjs
          node tests/member-sidebar-shell-contract.mjs
          node tests/member-shell-v1320-contract.mjs
      - name: Retained My Knowledge browser
        run: node tests/knowledge-library-v161-browser-contract.mjs
      - name: Retained Profile Runtime Resilience
        run: node tests/profile-runtime-resilience-contract.mjs
