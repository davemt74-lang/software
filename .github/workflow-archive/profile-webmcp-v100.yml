name: Profile WebMCP v1.00

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/profile-webmcp-v100.php
          php -l api/profile-webmcp-v100.php
          php -l profile.php
          php -l tests/profile-webmcp-v100.php
      - name: Pure PHP security contract
        run: php tests/profile-webmcp-v100.php

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integration contract
        run: node tests/profile-webmcp-v100-contract.mjs
      - name: Browser runtime contract
        run: node tests/profile-webmcp-v100-runtime.mjs

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production package contents
        run: |
          set -euo pipefail
          rm -rf /tmp/vp3-webmcp-package
          mkdir -p /tmp/vp3-webmcp-package
          rsync -a ./ /tmp/vp3-webmcp-package/ \
            --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='private/' \
            --exclude='uploads/' --exclude='config.php' --exclude='.env*'
          test -f /tmp/vp3-webmcp-package/includes/profile-webmcp-v100.php
          test -f /tmp/vp3-webmcp-package/api/profile-webmcp-v100.php
          test -f /tmp/vp3-webmcp-package/profile-webmcp-v100.js
          grep -Fq "includes/profile-webmcp-v100.php" /tmp/vp3-webmcp-package/profile.php
          grep -Fq "profile-webmcp-v100.js" /tmp/vp3-webmcp-package/profile.php
