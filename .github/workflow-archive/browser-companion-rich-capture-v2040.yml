name: Browser Companion Rich Capture v20.40+ regression

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - feature/browser-companion-rich-capture-v2040
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Rich capture contract · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase 1-4 Browser Companion regressions
        run: |
          node tests/extension-device-auth-v2000.mjs
          node tests/extension-device-auth-v2001.mjs
          node tests/browser-share-v2010.mjs
          node tests/browser-share-v2011.mjs
          node tests/browser-share-chat-feed-v2020.mjs
          node tests/browser-companion-v2030.mjs

      - name: Phase 5 rich capture contract
        run: node tests/browser-companion-rich-capture-v2040.mjs

      - name: Phase 6 This Page + Following contract
        run: node tests/browser-companion-source-feed-v2050.mjs

      - name: Phase 7 Research Projects + Publishing contract
        run: node tests/research-projects-publishing-v2060.mjs

      - name: Phase 8 Live Rooms + Cloak Mode contract
        run: node tests/live-rooms-cloak-v2070.mjs

      - name: Phase 9 Source Change + Claims + Moderation contract
        run: node tests/browser-trust-v2080.mjs

      - name: Phase 10 Search & Discovery Intelligence contract
        run: node tests/search-discovery-v2090.mjs

      - name: Manifest contract
        run: node -e "const m=require('./browser-companion/manifest.json'); const p=m.version.split('.').map(Number); if(m.manifest_version!==3||!(p[0]>20||(p[0]===20&&p[1]>=40))) process.exit(1)"

      - name: JavaScript syntax
        run: |
          node --check browser-companion/background.js
          node --check browser-companion/sidepanel.js
          node --check browser-companion/options.js
          node --check browser-share-card-v2020.js
          node --check tests/browser-companion-v2030.mjs
          node --check tests/browser-companion-rich-capture-v2040.mjs
          node --check tests/browser-companion-source-feed-v2050.mjs
          node --check tests/research-projects-publishing-v2060.mjs
          node --check tests/live-rooms-cloak-v2070.mjs
          node --check tests/browser-trust-v2080.mjs
          node --check tests/search-discovery-v2090.mjs
          node --check live-room-v2070.js
          node --check live-directory-v2070.js

      - name: PHP syntax
        run: |
          php -l includes/browser-share-media-v2040.php
          php -l api/browser-share-media-v2040.php
          php -l jobs/browser-share-media-worker-v2040.php
          php -l includes/browser-source-feed-v2050.php
          php -l api/browser-source-feed-v2050.php
          php -l includes/browser-share-chat-feed-v2020.php
          php -l source.php
          php -l annotation.php
          php -l includes/research-projects-v2060.php
          php -l api/research-projects-v2060.php
          php -l research.php
          php -l research-project.php
          php -l research-report-builder.php
          php -l research-report.php
          php -l includes/live-rooms-v2070.php
          php -l api/live-rooms-v2070.php
          php -l live.php
          php -l live-room.php
          php -l includes/browser-trust-v2080.php
          php -l api/browser-trust-v2080.php
          php -l claims.php
          php -l claim.php
          php -l moderation.php
          php -l notification-settings.php
          php -l source-change.php
          php -l includes/search-discovery-v2090.php
          php -l api/search-v2090.php
          php -l search.php
          php -l includes/profile-agent.php
          php -l upgrade.php

  package:
    name: Package Chrome extension
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build directly loadable extension ZIP
        run: |
          mkdir -p dist
          cd browser-companion
          zip -r ../dist/vp3-browser-companion-current.zip . -x '*.DS_Store'
          cd ..
          unzip -t dist/vp3-browser-companion-current.zip
          unzip -Z1 dist/vp3-browser-companion-current.zip | grep -qx 'manifest.json'
          if unzip -Z1 dist/vp3-browser-companion-current.zip | grep -q '^browser-companion/'; then
            echo 'Extension ZIP contains an unexpected wrapper folder.' >&2
            exit 1
          fi
          sha256sum dist/vp3-browser-companion-current.zip > dist/vp3-browser-companion-current.zip.sha256
          zip -r dist/vp3-phase10-search-deploy.zip \
            api/browser-source-feed-v2050.php \
            api/browser-share-media-v2040.php \
            includes/browser-source-feed-v2050.php \
            includes/browser-share-chat-feed-v2020.php \
            includes/browser-share-media-v2040.php \
            includes/bootstrap.php \
            browser-companion \
            source.php annotation.php \
            includes/research-projects-v2060.php \
            api/research-projects-v2060.php \
            research.php research-project.php research-report-builder.php research-report.php \
            includes/live-rooms-v2070.php \
            api/live-rooms-v2070.php \
            live.php live-room.php live-room-v2070.js live-directory-v2070.js \
            includes/browser-trust-v2080.php \
            api/browser-trust-v2080.php \
            claims.php claim.php moderation.php notification-settings.php source-change.php \
            includes/search-discovery-v2090.php \
            api/search-v2090.php search.php \
            includes/profile-agent.php \
            upgrade.php
          unzip -t dist/vp3-phase10-search-deploy.zip
          sha256sum dist/vp3-phase10-search-deploy.zip > dist/vp3-phase10-search-deploy.zip.sha256

      - name: Upload directly loadable Browser Companion
        uses: actions/upload-artifact@v4
        with:
          name: vp3-browser-companion-current
          path: |
            dist/vp3-browser-companion-current.zip
            dist/vp3-browser-companion-current.zip.sha256
            dist/vp3-phase10-search-deploy.zip
            dist/vp3-phase10-search-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30
